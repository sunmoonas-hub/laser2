<!DOCTYPE html>
<html lang="ko" translate="no">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="theme-color" content="#07111f">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover">
<title>LASER MATCH R40 · 실시간 관전</title>
<style>
  :root{--bg:#07111f;--text:#f5f8ff;--muted:#b9c7d8;--cyan:#29e7d6;--lime:#b7ff3c;--red:#ff4d66;--gold:#ffc940}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -15%,#17375a 0,var(--bg) 45%);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
  .wrap{max-width:1080px;margin:0 auto;padding:max(env(safe-area-inset-top),14px) 16px calc(24px + env(safe-area-inset-bottom))}
  header{text-align:center;margin-bottom:14px}
  header h1{font-size:1.3rem;letter-spacing:.06em;margin:0 0 4px}
  header p{color:var(--muted);font-size:.8rem;margin:0}
  .layout{display:grid;grid-template-columns:1fr;gap:16px}
  @media(min-width:860px){.layout{grid-template-columns:1.15fr .85fr;align-items:start}}
  .left,.right{min-width:0}
  .idle{text-align:center;color:var(--muted);padding:20px 20px 4px;font-size:1rem;line-height:1.7}
  .idle b{display:block;color:#fff;font-size:1.25rem;margin-bottom:8px}
  .who{display:flex;justify-content:space-between;align-items:center;margin:14px 0 10px}
  .who .name{font-size:1.4rem;font-weight:800}
  .who .lane{color:var(--muted);font-size:.85rem}
  .status{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;border:1px solid #ffffff28;background:#06101dcc;border-radius:999px;padding:6px 12px;white-space:nowrap}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--red)}
  .status.live .dot{background:#ff4d66;box-shadow:0 0 8px #ff4d66}
  .status.done .dot{background:var(--lime);box-shadow:0 0 8px var(--lime)}
  .target-box{position:relative;width:100%;aspect-ratio:1;max-width:560px;margin:14px auto;border-radius:16px;overflow:hidden;background:#0c1728;border:1px solid #29415e}
  canvas{width:100%;height:100%;display:block}
  .scoreboard{display:grid;grid-template-columns:1.2fr .8fr .8fr;gap:1px;background:#29415e;border-radius:14px;overflow:hidden;margin:14px 0}
  .metric{background:#0e1b2d;padding:14px 6px;text-align:center}
  .metric small{display:block;color:var(--muted);font-size:.7rem;margin-bottom:5px}
  .metric strong{font-size:1.6rem}
  .metric:first-child strong{color:var(--lime);font-size:2rem}
  .updated{text-align:center;color:var(--muted);font-size:.72rem;margin-top:6px}
  .startPanel{background:linear-gradient(160deg,#14243aee,#0c1728ee);border:1px solid #29415e;border-radius:16px;padding:16px}
  .startPanel h2{font-size:1rem;margin:0 0 12px}
  .startPanel .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
  .startPanel .field label{display:block;color:var(--muted);font-size:.75rem;margin:0 0 6px 2px;font-weight:700}
  .startPanel .field input,.startPanel .field select{width:100%;min-height:50px;border:1px solid #29415e;border-radius:10px;background:#091426;color:#fff;padding:10px 12px;font-size:.92rem}
  .startRow{display:flex;gap:10px}
  .startBtn{flex:1;min-height:54px;border:0;border-radius:12px;background:var(--cyan);color:#08111d;font-weight:850;font-size:1rem}
  .startBtn:disabled{opacity:.5}
  .endBtn{flex:none;min-width:110px;min-height:54px;border:1px solid var(--red);border-radius:12px;background:transparent;color:var(--red);font-weight:850;font-size:.92rem}
  .startMsg{text-align:center;color:var(--muted);font-size:.78rem;margin-top:10px;min-height:1.1em}
  .hint{font-size:.74rem;line-height:1.6;color:var(--muted);margin:10px 0 0}
  .shotPanel{background:linear-gradient(160deg,#14243aee,#0c1728ee);border:1px solid #29415e;border-radius:16px;padding:16px;margin-top:16px}
  .shotPanel h2{font-size:1rem;margin:0 0 12px}
  .scoreGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;padding:6px 0 4px}
  .scoreGrid .slot{aspect-ratio:1;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0e1b2d;border:1px solid #29415e;color:var(--muted)}
  .scoreGrid .slot .num{font-size:.62rem;opacity:.75;font-weight:700}
  .scoreGrid .slot .val{font-size:1.3rem;font-weight:900;line-height:1.1}
  .scoreGrid .slot.hit{background:var(--lime);border-color:var(--lime);color:#07111f}
  .scoreGrid .slot.miss{background:var(--red);border-color:var(--red);color:#fff}
  .scoreGrid .slot.flash{animation:scorePop .5s ease}
  @keyframes scorePop{0%{transform:scale(1.35)}100%{transform:scale(1)}}
  .manualTitle{font-size:.9rem;margin:18px 0 8px;color:var(--muted);font-weight:800}
  .manualGrid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
  .manualGrid button{min-height:46px;border:1px solid #34506f;border-radius:10px;background:#142941;color:#fff;font-weight:900;font-size:1.05rem}
  .manualGrid button:active{background:var(--cyan);color:#07111f}
  .manualGrid button:disabled{opacity:.35}
  .manualGrid button.zero{border-color:var(--red);color:var(--red)}
  .undoBtnLive{width:100%;min-height:48px;border:1px solid var(--red);border-radius:12px;background:transparent;color:var(--red);font-weight:800;font-size:.88rem;margin-top:16px}
  .undoBtnLive:disabled{opacity:.4}
  .undoMsg{text-align:center;color:var(--muted);font-size:.76rem;margin-top:8px;min-height:1.1em}
  @media(max-width:420px){.startPanel .grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🎯 LASER MATCH · 실시간 관전</h1>
  </header>
  <div class="layout">
    <div class="left">
      <div id="idleHint" class="idle"><b>대기 중…</b>오른쪽에서 선택한 사로에서 아직 경기가 시작되지 않았어요.</div>
      <div id="liveBox" hidden>
        <div class="who">
          <div><div class="name" id="pName">–</div><div class="lane" id="pLane"></div></div>
          <span class="status" id="statusPill"><i class="dot"></i><span id="statusText">대기</span></span>
        </div>
        <div class="target-box"><canvas id="cv" width="600" height="600"></canvas></div>
        <div class="scoreboard">
          <div class="metric"><small>총점</small><strong id="total">0</strong></div>
          <div class="metric"><small>발수</small><strong><span id="cnt">0</span>/<span id="maxS">10</span></strong></div>
          <div class="metric"><small>평균</small><strong id="avg">0.0</strong></div>
        </div>
        <p class="updated" id="updatedAt"></p>
      </div>
    </div>
    <div class="right">
      <section class="startPanel" id="startPanel">
        <h2>🕹️ 새 경기 시작</h2>
        <div class="grid">
          <div class="field"><label>선수명</label><input id="rPlayer" placeholder="선수 이름" maxlength="40"></div>
          <div class="field"><label>사로</label><select id="rLane"><option value="1">1사로</option><option value="2">2사로</option><option value="3">3사로</option><option value="4">4사로</option><option value="5">5사로</option><option value="6">6사로</option><option value="7">7사로</option><option value="8">8사로</option></select></div>
          <div class="field"><label>대회명</label><input id="rEvent" placeholder="예: 교내 사격대회" maxlength="80"></div>
          <div class="field"><label>경기 발수</label><select id="rMax"><option>5</option><option selected>10</option><option>20</option></select></div>
        </div>
        <div class="startRow">
          <button class="startBtn" id="rStart">🕹️ 1사로 경기 시작</button>
          <button class="endBtn" id="rEnd">🛑 1사로 종료</button>
        </div>
        <p class="startMsg" id="rMsg"></p>
      </section>
      <section class="shotPanel" id="shotPanel" hidden>
        <h2>🎯 획득 점수</h2>
        <div class="scoreGrid" id="scoreGrid"></div>
        <div class="manualTitle">✍️ 수동 점수 입력 (누르면 바로 1발 기록)</div>
        <div class="manualGrid" id="manualGrid"></div>
        <button class="undoBtnLive" id="undoBtnLive">↩️ 마지막 발 취소</button>
        <p class="undoMsg" id="undoMsg"></p>
      </section>
    </div>
  </div>
</div>
<script>
(() => {
  'use strict';
  // index.html의 APPS_SCRIPT_URL과 반드시 같은 주소를 넣으세요.
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyZrVEhkDw7Q4DEjA_uKP-eJrINC7mJ5LrwkP8QOBQV1gBRqGFD-ScU7r6ipQ-QyjEz9Q/exec';
  const $ = id => document.getElementById(id);
  const cv = $('cv'), ctx = cv.getContext('2d');
  let lastSig = '', lastState = null;

  // "지금 보는 사로"와 "시작할 사로"는 항상 같은 사로로 맞춘다.
  // 그래야 시작·취소·종료 버튼이 지금 화면에 보이는 사로에만 적용된다.
  function currentLane(){ return Number($('rLane').value) || 1; }
  function setLane(lane){
    lane = String(lane);
    $('rLane').value = lane;
    $('rStart').textContent = `🕹️ ${lane}사로 경기 시작`;
    $('rEnd').textContent = `🛑 ${lane}사로 종료`;
    // 다른 사로의 화면이 잠깐이라도 섞여 보이지 않게 즉시 비우고 새로 불러온다.
    lastSig = ''; lastState = null; lastShotCount = -1;
    $('rMsg').textContent = ''; $('undoMsg').textContent = '';
    applyView(); syncStartLock();
    restartPoll();
  }
  $('rLane').addEventListener('change', e => setLane(e.target.value));

  let lastShotCount = -1;
  function renderScores(shots, maxShots){
    shots = shots || []; maxShots = maxShots || 10;
    const html = [];
    for(let i=0;i<maxShots;i++){
      const s = shots[i];
      if(s){
        const miss = !s.score;
        html.push(`<div class="slot ${miss?'miss':'hit'}"><span class="num">${i+1}발</span><span class="val">${miss?'0':s.score}</span></div>`);
      } else {
        html.push(`<div class="slot"><span class="num">${i+1}발</span><span class="val">–</span></div>`);
      }
    }
    $('scoreGrid').innerHTML = html.join('');
    if(shots.length !== lastShotCount){
      lastShotCount = shots.length;
      const slots = $('scoreGrid').children;
      const idx = shots.length - 1;
      if(idx >= 0 && slots[idx]) slots[idx].classList.add('flash');
    }
  }

  function drawTarget(shots){
    const W = cv.width, H = cv.height, cx = W/2, cy = H/2, R = W*0.28;
    ctx.clearRect(0,0,W,H);
    for(let i=10;i>=1;i--){
      ctx.beginPath();ctx.arc(cx,cy,R*i/10,0,Math.PI*2);
      ctx.strokeStyle = i===10 ? '#b7ff3ccc' : '#b7ff3c55';
      ctx.lineWidth = i===10 ? 2.5 : 1.4; ctx.stroke();
    }
    ctx.beginPath();ctx.arc(cx,cy,6,0,Math.PI*2);ctx.strokeStyle='#b7ff3c';ctx.lineWidth=2;ctx.stroke();
    (shots||[]).forEach((s,i) => {
      if(s.kind==='manual') return;   // 수동 입력 발은 위치가 없어 점수 칸에만 표시
      const px = cx + (s.u||0)*R, py = cy + (s.v||0)*R;
      ctx.beginPath();
      if(s.kind==='object'){ctx.moveTo(px,py-11);ctx.lineTo(px+11,py);ctx.lineTo(px,py+11);ctx.lineTo(px-11,py);ctx.closePath()}
      else ctx.arc(px,py,10,0,Math.PI*2);
      ctx.fillStyle = s.score ? '#b7ff3c' : '#ff4d66'; ctx.fill();
      ctx.fillStyle = '#07111f'; ctx.font = 'bold 12px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(String(i+1), px, py);
    });
  }

  function handleState(state){
    lastState = state;
    applyView();
    syncStartLock();
  }
  // 이 사로에서 사격이 진행 중이면 시작 버튼을 잠근다(다른 사로는 영향 없음).
  // 사대 폰이 경기 중 15초마다 신호를 보내므로, 60초 넘게 소식이 없으면 연결이 끊긴 것으로 보고 풀어 준다.
  function syncStartLock(){
    const stale = lastState && lastState.updatedAt && (Date.now() - lastState.updatedAt > 60000);
    const busy = !!(lastState && lastState.running && !stale);
    $('rStart').disabled = busy;
    const canManual = busy && Array.isArray(lastState.shots) && lastState.shots.length < (lastState.maxShots || 10);
    for(const b of $('manualGrid').children) b.disabled = !canManual;
  }
  function applyView(){
    const state = lastState;
    const watch = currentLane();
    if(!state || (state.firingLane && state.firingLane !== watch)){ show('idle'); return; }
    const shots = Array.isArray(state.shots) ? state.shots : [];
    if(!(state.player || shots.length)){ show('idle'); return; }
    show('live');
    $('pName').textContent = state.player || '이름 없음';
    $('pLane').textContent = state.eventName ? `${state.eventName} · ${watch}사로` : `${watch}사로`;
    $('statusPill').className = 'status ' + (state.running ? 'live' : 'done');
    $('statusText').textContent = state.running ? '사격 중' : (shots.length ? '완료' : '대기');
    const total = shots.reduce((a,s)=>a+(s.score||0),0);
    $('total').textContent = total;
    $('cnt').textContent = shots.length;
    $('maxS').textContent = state.maxShots || 10;
    $('avg').textContent = shots.length ? (total/shots.length).toFixed(1) : '0.0';
    drawTarget(shots);
    renderScores(shots, state.maxShots);
    $('undoBtnLive').disabled = !shots.length;
    updateAgeText();
  }
  function updateAgeText(){
    if(!lastState || !lastState.updatedAt){ $('updatedAt').textContent = ''; return; }
    const sec = Math.max(0, Math.round((Date.now()-lastState.updatedAt)/1000));
    $('updatedAt').textContent = sec < 3 ? '방금 갱신됨' : `${sec}초 전 갱신`;
  }
  // 상태가 안 바뀌어도 "N초 전"과 시작 버튼 잠금은 시간이 지나면 달라지므로 1초마다 다시 계산한다.
  setInterval(() => { updateAgeText(); syncStartLock(); }, 1000);
  function show(which){
    $('idleHint').hidden = which!=='idle';
    $('liveBox').hidden = which!=='live';
    $('shotPanel').hidden = which!=='live';
  }

  // 사로를 바꾸면 이전 사로의 폴링을 끊고 새 사로로 다시 시작한다.
  let pollToken = 0;
  function restartPoll(){ pollToken++; poll(pollToken); }
  function poll(token){
    if(token !== pollToken) return;
    const lane = currentLane();
    const cb = 'liveCb_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
    const script = document.createElement('script');
    let done = false;
    const timer = setTimeout(() => finish(null), 9000);
    function finish(state){
      if(done) return; done = true;
      clearTimeout(timer);
      window[cb] = function(){};
      script.remove();
      if(token !== pollToken) return;   // 그사이 사로가 바뀌었으면 이 응답은 버린다
      if(state && state.ok !== false && lane === currentLane()){
        const sig = JSON.stringify(state);
        if(sig !== lastSig){ lastSig = sig; handleState(state); }
      }
      setTimeout(() => poll(token), 1200);
    }
    window[cb] = data => finish(data);
    script.onerror = () => finish(null);
    script.src = `${APPS_SCRIPT_URL}?action=live&lane=${lane}&callback=${cb}&t=${Date.now()}`;
    document.head.appendChild(script);
  }

  function sendCmd(cmd, btn, msg){
    cmd = Object.assign({}, cmd, { cmdId: 'cmd_' + Date.now() + '_' + Math.random().toString(36).slice(2,7) });
    btn.disabled = true; msg.textContent = '📡 명령을 보내는 중…';
    const cb = 'startCb_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
    const script = document.createElement('script');
    const timer = setTimeout(() => finish(null), 8000);
    function finish(res){
      clearTimeout(timer); window[cb] = function(){}; script.remove(); syncStartLock();
      if(res && res.ok) msg.textContent = `✅ ${cmd.firingLane}사로에 보냈어요 - 사대 화면에서 자동으로 시작돼요.`;
      else msg.textContent = '⚠️ 전송에 실패했어요. 다시 시도해 주세요.';
    }
    window[cb] = res => finish(res);
    script.onerror = () => finish(null);
    const qs = new URLSearchParams({ action: 'remoteStart', callback: cb, payload: JSON.stringify(cmd) });
    script.src = `${APPS_SCRIPT_URL}?${qs.toString()}`;
    document.head.appendChild(script);
  }
  $('rStart').addEventListener('click', () => {
    const cmd = {
      eventName: $('rEvent').value.trim(),
      player: $('rPlayer').value.trim(),
      firingLane: currentLane(),
      laserColor: 'red',     // 빨간 레이저로 고정
      detectKind: 'laser',   // 레이저만 감지(물체·자국 감지는 사용하지 않음)
      maxShots: Number($('rMax').value)
    };
    if(!cmd.player){ $('rMsg').textContent = '선수 이름을 입력해 주세요.'; return; }
    sendCmd(cmd, $('rStart'), $('rMsg'));
  });

  // 취소·종료 신호는 지금 보고 있는 사로에만 보낸다.
  function sendLaneSignal(action, btn, msg, sendingText, okText, afterFinish){
    const lane = currentLane();
    btn.disabled = true; msg.textContent = sendingText;
    const cb = action + 'Cb_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
    const script = document.createElement('script');
    const timer = setTimeout(() => finish(null), 8000);
    function finish(res){
      clearTimeout(timer); window[cb] = function(){}; script.remove();
      afterFinish();
      msg.textContent = (res && res.ok) ? `✅ ${lane}사로: ${okText}` : '⚠️ 전송에 실패했어요. 다시 시도해 주세요.';
    }
    window[cb] = res => finish(res);
    script.onerror = () => finish(null);
    script.src = `${APPS_SCRIPT_URL}?action=${action}&lane=${lane}&callback=${cb}&t=${Date.now()}`;
    document.head.appendChild(script);
  }
  $('undoBtnLive').addEventListener('click', () => {
    sendLaneSignal('remoteUndo', $('undoBtnLive'), $('undoMsg'), '📡 취소 신호를 보내는 중…', '취소 신호를 보냈어요 - 사대에 곧 반영돼요.',
      () => { $('undoBtnLive').disabled = !(lastState && lastState.shots && lastState.shots.length); });
  });
  $('rEnd').addEventListener('click', () => {
    const lane = currentLane();
    if(!confirm(`${lane}사로 경기를 종료할까요?\n탄착군과 점수가 초기화돼요.`)) return;
    sendLaneSignal('remoteEnd', $('rEnd'), $('rMsg'), '📡 종료 신호를 보내는 중…', '경기를 종료했어요 - 탄착군·점수가 초기화돼요.',
      () => { $('rEnd').disabled = false; });
  });

  // 수동 점수 버튼(10~0). 확인 창 없이 바로 보낸다 - 잘못 눌렀으면 '마지막 발 취소' 후 다시 입력.
  // 서버가 누른 순서대로 번호를 붙여 쌓으므로 빠르게 여러 번 눌러도 누른 횟수만큼 정확히 기록된다.
  for(let sc=10; sc>=0; sc--){
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = sc; if(sc===0) b.className = 'zero';
    b.addEventListener('click', () => sendManual(sc));
    $('manualGrid').appendChild(b);
  }
  function sendManual(score){
    const lane = currentLane(), msg = $('undoMsg');
    msg.textContent = `📡 ${lane}사로에 ${score}점 보내는 중…`;
    const cb = 'manualCb_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
    const script = document.createElement('script');
    const timer = setTimeout(() => finish(null), 8000);
    function finish(res){
      clearTimeout(timer); window[cb] = function(){}; script.remove();
      msg.textContent = (res && res.ok) ? `✅ ${lane}사로: 수동 ${score}점을 보냈어요 - 사대에 곧 반영돼요.` : '⚠️ 전송에 실패했어요. 다시 시도해 주세요.';
    }
    window[cb] = res => finish(res);
    script.onerror = () => finish(null);
    script.src = `${APPS_SCRIPT_URL}?action=remoteManual&lane=${lane}&score=${score}&callback=${cb}&t=${Date.now()}`;
    document.head.appendChild(script);
  }

  drawTarget([]);
  setLane(1);
})();
</script>
</body>
</html>
