      const px = cx + (s.u||0)*R, py = cy + (s.v||0)*R;
      ctx.beginPath();
      if(s.kind==='object'){ctx.moveTo(px,py-11);ctx.lineTo(px+11,py);ctx.lineTo(px,py+11);ctx.lineTo(px-11,py);ctx.closePath()}

      ctx.fillStyle = '#111111'; ctx.font = 'bold 12px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(String(s.no||i+1), px, py);
    });

  // �쒕쾭 �곹깭媛� �덈줈 �� �뚮쭏�� �몄텧��. "吏�湲� 蹂대뒗 �щ줈"�� �ㅼ젣 �щ줈媛� 媛숈쓣 �뚮쭔 �붾㈃�� 媛깆떊�쒕떎.

  function syncStartLock(){

    $('rSaveLearn').hidden = false;
