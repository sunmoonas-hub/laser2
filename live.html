<!DOCTYPE html>
<html lang="ko" translate="no">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="theme-color" content="#07111f">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover">
<title>LASER MATCH · 관전</title>
<style>
  :root{--bg:#07111f;--panel:#101d30;--panel2:#0b1626;--line:#29415e;--text:#f5f8ff;--muted:#b9c7d8;--dim:#5b6f86;--cyan:#29e7d6;--lime:#b7ff3c;--red:#ff4d66;--red2:#ff7a8c;--gold:#ffc940}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
  button,select,input{font:inherit}
  button{cursor:pointer}
  .wrap{max-width:1200px;margin:0 auto;padding:max(env(safe-area-inset-top),14px) 16px calc(24px + env(safe-area-inset-bottom))}
  header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  header h1{font-size:1.25rem;letter-spacing:.04em;margin:0;font-weight:900}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;border:1px solid #ffffff28;background:#06101dcc;border-radius:999px;padding:6px 12px;white-space:nowrap;color:var(--muted)}
  .pill.ok{color:var(--lime);border-color:#b7ff3c66}
  .pill.bad{color:var(--red2);border-color:#ff4d6666}
  .layout{display:grid;grid-template-columns:1fr;gap:16px}
  @media(min-width:860px){.layout{grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);align-items:start}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
  .panel h2{margin:0;font-size:1.05rem;font-weight:900}
  .muted{color:var(--muted)}
  .small{font-size:.8rem}
  .seg{display:grid;gap:6px}
  .seg button{min-height:48px;border-radius:10px;border:2px solid #34506f;background:transparent;color:var(--muted);font-weight:900}
  .seg button.on-practice{background:var(--cyan);border-color:var(--cyan);color:#07111f}
  .seg button.on-eval{background:var(--red);border-color:var(--red);color:#fff}
  .seg button.on-check{background:#5b6f86;border-color:#5b6f86;color:#fff}
  .seg button.on-mode{background:#142941;border-color:var(--cyan);color:var(--text)}
  .lbl{display:flex;flex-direction:column;gap:6px;font-size:.8rem;font-weight:700;color:var(--muted)}
  select{min-height:48px;border-radius:10px;border:1px solid var(--line);background:#091426;color:var(--text);font-size:.95rem;padding:0 10px;width:100%}
  .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .summary{border-radius:12px;border:2px solid var(--cyan);background:#0d2a33;padding:14px;text-align:center}
  .summary.eval{border-color:var(--red);background:#331019}
  .summary.check{border-color:#5b6f86;background:#151f2c}
  .summary.warn{border-color:var(--gold);background:#2e2610}
  .summary .big{font-size:1.2rem;font-weight:900;margin-top:4px;color:var(--cyan)}
  .summary.eval .big{color:var(--red2)}
  .summary.check .big{color:var(--muted)}
  .summary.warn .big{color:var(--gold)}
  .btnrow{display:flex;gap:10px}
  .btn-start{flex:1;min-height:56px;border:0;border-radius:12px;background:var(--cyan);color:#07111f;font-size:1.05rem;font-weight:900}
  .btn-start:disabled{opacity:.4;cursor:not-allowed}
  .btn-line{min-height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--red);background:transparent;color:var(--red2);font-weight:800}
  .btn-line.gray{border-color:#5b6f86;color:var(--muted)}
  .btn-line:disabled{opacity:.4;cursor:not-allowed}
  .msg{text-align:center;color:var(--muted);font-size:.8rem;min-height:1.1em}
  .order-row{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
  .order-row.absent{opacity:.45}
  .order-row .rank{font-weight:900;color:var(--cyan);min-width:24px;text-align:center}
  .order-row .nm{font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .order-row .sh{font-weight:900;color:var(--gold);min-width:40px;text-align:right}
  .icon-btn{width:44px;height:44px;border-radius:9px;border:1px solid #34506f;background:#142941;color:var(--text);display:flex;align-items:center;justify-content:center;flex:none}
  .icon-btn:disabled{opacity:.35}
  .tog-btn{min-height:44px;padding:0 10px;border-radius:9px;border:1px solid #5b6f86;background:transparent;color:var(--muted);font-size:.8rem;font-weight:700;flex:none}
  .stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .stat{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
  .stat .k{font-size:.78rem;color:var(--muted)}
  .stat .v{font-size:1.5rem;font-weight:900}
  .slots10{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px}
  @media(max-width:520px){.slots10{grid-template-columns:repeat(5,minmax(0,1fr))}}
  .slot{border-radius:10px;padding:7px 0;text-align:center;background:var(--panel2);border:1px solid var(--line)}
  .slot .n{font-size:.68rem;color:var(--muted)}
  .slot .s{font-size:1rem;font-weight:900;color:var(--dim)}
  .slot.filled{background:#0d2a33;border-color:var(--cyan)}
  .slot.filled .s{color:var(--text)}
  .slot.next{border-color:var(--gold)}
  .slot.next .s{color:var(--gold)}
  .sec-title{font-size:.88rem;font-weight:800}
  /* 지난 기록: 큰 덩어리 사이 18px, 묶음 안(제목↔칸) 8px */
  .hist-body{display:flex;flex-direction:column;gap:18px}
  .hist-group{display:flex;flex-direction:column;gap:8px}
  .hist-target{width:100%;max-width:440px;margin:0 auto}
  .shot-cells{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px;width:100%;max-width:440px;margin:0 auto}
  .shot-cell{border-radius:8px;padding:6px 0;text-align:center;font-weight:900;font-size:.95rem;background:var(--panel2);border:1px solid var(--line);color:var(--dim)}
  .shot-cell .n{display:block;font-size:.62rem;font-weight:700;opacity:.8}
  .shot-cell.hit{background:var(--lime);border-color:var(--lime);color:#07111f}
  .shot-cell.miss{background:var(--red);border-color:var(--red);color:#fff}
  .canvas-box{background:var(--panel2);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .canvas-box canvas{width:100%;height:auto;display:block;aspect-ratio:1}
  .banner{border-radius:16px;border:2px solid var(--cyan);background:#0d2a33;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .banner .who{font-size:1.9rem;font-weight:900;color:var(--cyan);line-height:1.15;word-break:keep-all}
  .banner .cnt{font-size:1.7rem;font-weight:900;color:var(--gold);text-align:right;white-space:nowrap}
  .banner .sub{font-size:.82rem;color:var(--muted)}
  .scoreboard{display:grid;grid-template-columns:1.2fr .8fr .8fr;gap:1px;background:var(--line);border-radius:14px;overflow:hidden}
  .metric{background:#0e1b2d;padding:12px 6px;text-align:center}
  .metric small{display:block;color:var(--muted);font-size:.72rem;margin-bottom:4px}
  .metric strong{font-size:1.5rem}
  .metric:first-child strong{color:var(--lime);font-size:1.9rem}
  .live-slots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
  .lslot{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0e1b2d;border:1px solid var(--line);color:var(--dim)}
  .lslot .n{font-size:.62rem;font-weight:700;opacity:.8}
  .lslot .v{font-size:1.25rem;font-weight:900;line-height:1.1}
  .lslot.hit{background:var(--lime);border-color:var(--lime);color:#07111f}
  .lslot.miss{background:var(--red);border-color:var(--red);color:#fff}
  .lslot.now{border-color:var(--gold);color:var(--gold)}
  .member-box{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
  .member-box.cur{border-color:var(--cyan)}
  .member-box .mh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .member-box .mn{font-weight:900}
  .member-box.cur .mn{color:var(--cyan)}
  .member-box .ms{font-weight:900;color:var(--gold);white-space:nowrap}
  .mslots{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
  .ms-slot{border-radius:8px;padding:6px 0;text-align:center;font-size:.92rem;font-weight:900;background:#0e1b2d;color:var(--dim);border:1px solid var(--line)}
  .ms-slot.hit{background:var(--lime);border-color:var(--lime);color:#07111f}
  .ms-slot.miss{background:var(--red);border-color:var(--red);color:#fff}
  .ms-slot.now{border-color:var(--gold);color:var(--gold)}
  .keys{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
  .keys button{min-height:46px;border:1px solid #34506f;border-radius:10px;background:#142941;color:var(--text);font-weight:900;font-size:1.05rem}
  .keys button.zero{border-color:var(--red);color:var(--red2)}
  .keys button:disabled{opacity:.35;cursor:not-allowed}
  .savebox{border-radius:12px;padding:12px;text-align:center;font-weight:800;border:1px solid var(--line);background:var(--panel2)}
  .savebox.ok{border-color:var(--lime);color:var(--lime)}
  .savebox.fail{border-color:var(--red);color:var(--red2)}
  .savebox.saving{border-color:var(--gold);color:var(--gold)}
  .hint{color:var(--muted);text-align:center;padding:28px 10px;line-height:1.7}
  .dupwarn{border-radius:12px;border:2px solid var(--gold);background:#2e2610;color:var(--gold);font-weight:800;padding:10px 14px;margin-bottom:14px;text-align:center}
  .startwarn{border-radius:10px;border:2px solid var(--gold);background:#2e2610;color:var(--gold);font-weight:800;font-size:.85rem;padding:8px 12px;text-align:center}
  /* ===== 시작 전 화면 배치 ===== */
  .sel3{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,.8fr) minmax(0,1.6fr);gap:8px}
  .setup-right .msg:empty{display:none}   /* 안내 문구가 없을 땐 자리도 차지하지 않게 */
  /* 맨 아래: 요약 상자 + 시작 버튼 한 줄 */
  .start-row{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:10px;align-items:stretch}
  .start-row .summary{padding:8px 12px;display:flex;flex-direction:column;justify-content:center}
  .start-row .summary .big{font-size:1rem;margin-top:0;line-height:1.35;word-break:keep-all}
  .start-row .btn-start{min-height:60px;line-height:1.3;word-break:keep-all}
  /* 개인전 오른쪽: 사로·반 / 학생, 요약 상자 / 시작 버튼을 각각 두 줄로 */
  .setup-right.ind .sel3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .setup-right.ind #rowStudent{grid-column:1/-1}
  .setup-right.ind .start-row{grid-template-columns:1fr}
  .setup-right.ind .start-row .summary{text-align:center}
  .setup-right.ind .start-row .summary .big{font-size:1.12rem}
  .setup-right.ind .start-row .btn-start{font-size:1.15rem}
  /* 단체전 사격 순서(오른쪽, 1열) */
  .order-list{display:flex;flex-direction:column;gap:6px}
  /* 단체전 탄착군 옆 팀원별 점수 */
  .ih-main.legend .ih-target{width:min(100cqh,calc(100cqw - 160px));height:min(100cqh,calc(100cqw - 160px))}
  .ih-legend{display:flex;flex-direction:column;justify-content:center;gap:8px;width:150px;flex:none}
  .lg{display:grid;grid-template-columns:14px minmax(0,1fr) auto;align-items:center;gap:4px 8px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:7px 10px}
  .lg i{width:14px;height:14px;border-radius:50%;grid-column:1;grid-row:1/3}
  .lg .nm{font-weight:800;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;grid-column:2;grid-row:1}
  .lg .sh{font-size:.72rem;color:var(--muted);grid-column:2;grid-row:2}
  .lg b{font-size:1rem;color:var(--gold);grid-column:3;grid-row:1/3}
  .ih{display:flex;flex-direction:column;gap:14px;min-height:0}
  .ih-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .ih-stats{display:flex;gap:8px;flex-wrap:wrap}
  .ih-stat{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:.85rem;color:var(--muted);white-space:nowrap}
  .ih-stat b{color:var(--text);font-size:1.05rem;margin-left:4px}
  .ih-sess{display:grid;grid-template-columns:repeat(10,minmax(0,1fr)) 6px repeat(2,minmax(0,1fr));gap:6px}
  .ih-sess .slot,.ih-sess .ih-sep{grid-row:2}
  .ih-sess .slot{padding:5px 0}
  .ih-sess .slot .n{font-size:.66rem}
  .ih-sep{border-left:2px dashed var(--line);justify-self:center;width:0}
  .ih-main-wrap{display:flex;flex-direction:column;gap:8px;min-height:0}
  .ih-main{display:flex;justify-content:center;gap:10px;min-height:0;height:360px;container-type:size}
  .ih-target{width:min(100cqh,calc(100cqw - 86px));height:min(100cqh,calc(100cqw - 86px));flex:none}
  .ih-main.noshots .ih-target{width:min(100cqh,100cqw);height:min(100cqh,100cqw);margin:0 auto}
  .ih-target .canvas-box{width:100%;height:100%}
  .ih-shots{display:flex;flex-direction:column;gap:4px;width:76px;flex:none}
  .ih-shots .shot-cell{flex:1;min-height:0;max-height:52px;display:grid;grid-template-columns:1fr 1fr;align-items:center;justify-items:center;padding:0;font-size:1rem}
  .ih-shots .shot-cell .n{display:inline;font-size:.78rem;opacity:.85}
  .tb{display:flex;flex-direction:column;gap:14px;min-height:0}
  /* 넓은 화면(크롬북 등)에서는 시작 전 화면도 스크롤 없이 한 화면에 들어오게 한다 */
  @media(min-width:860px){
    body.setup-mode .wrap{height:100vh;height:100dvh;display:flex;flex-direction:column;padding-bottom:12px}
    body.setup-mode header{flex:none}
    body.setup-mode #setupView{flex:1;min-height:0;align-items:stretch}
    body.setup-mode #setupView > .panel{min-height:0;overflow-y:auto}
    body.setup-mode #histPanel{overflow:hidden}
    body.setup-mode #dupWarn{display:none}   /* 시작 전 화면에서는 시작 버튼 위 경고(startWarn)로 충분 */
    body.setup-mode .ih,body.setup-mode .tb{flex:1}
    body.setup-mode .start-row{margin-top:auto}
    /* 개인전: 남는 높이에 맞춰 크게(최대 크기 있음), 그래도 남으면 위아래 같게 → 가운데 */
    body.setup-mode .setup-right.ind{justify-content:center}
    body.setup-mode .setup-right.ind .start-row{margin-top:0}
    body.setup-mode .setup-right.ind .seg button{min-height:clamp(48px,8.9vh,64px)}
    body.setup-mode .setup-right.ind select{min-height:clamp(46px,8.25vh,60px);font-size:1rem}
    body.setup-mode .setup-right.ind .start-row .summary{min-height:clamp(54px,9.5vh,72px)}
    body.setup-mode .setup-right.ind .start-row .btn-start{min-height:clamp(54px,9.5vh,72px)}
    /* 같은 사로 경고가 떠 있으면 그만큼 버튼·칸을 조금 줄인다 */
    body.setup-mode .setup-right.ind:has(#startWarn:not([hidden])) .seg button{min-height:clamp(44px,7.8vh,64px)}
    body.setup-mode .setup-right.ind:has(#startWarn:not([hidden])) select{min-height:clamp(42px,7.4vh,60px)}
    body.setup-mode .setup-right.ind:has(#startWarn:not([hidden])) .start-row .summary,
    body.setup-mode .setup-right.ind:has(#startWarn:not([hidden])) .start-row .btn-start{min-height:clamp(50px,8.6vh,72px)}
    body.setup-mode #rowOrder{flex:1 1 auto;min-height:0}
    body.setup-mode .order-list{flex:1;min-height:0}
    body.setup-mode .order-row{flex:1 1 0;min-height:40px;max-height:52px;padding:4px 8px}
    body.setup-mode .order-row .icon-btn,body.setup-mode .order-row .tog-btn{height:100%;min-height:0;max-height:44px}
    body.setup-mode .order-row .icon-btn{width:40px}
    body.setup-mode .ih-main-wrap{flex:1}
    body.setup-mode .ih-main{flex:1;height:auto}
  }
  @media(min-width:860px) and (max-height:700px){
    body.setup-mode .setup-right{gap:10px}
    body.setup-mode .setup-right .seg button{min-height:42px}
    body.setup-mode .setup-right select{min-height:42px}
    body.setup-mode .setup-right .start-row .btn-start{min-height:54px}
    body.setup-mode #histPanel,body.setup-mode .ih,body.setup-mode .tb{gap:10px}
  }
  /* ===== 경기 화면 배치 ===== */
  .live-left{display:flex;flex-direction:column;gap:12px;min-width:0}
  .live-target{container-type:size;aspect-ratio:1;display:flex;align-items:center;justify-content:center;min-height:0}
  .live-target .canvas-box{width:min(100cqw,100cqh);height:min(100cqw,100cqh)}
  .live-right{gap:10px}
  .live-right h2{font-size:.95rem}
  .live-right .metric{padding:8px 6px}
  .live-right .metric strong{font-size:1.35rem}
  .live-right .metric:first-child strong{font-size:1.7rem}
  .live-right .live-slots .lslot{aspect-ratio:auto;height:52px}
  .live-right .member-box{flex-direction:row;align-items:center;gap:10px;padding:6px 10px}
  .live-right .member-box .mh{flex-direction:column;align-items:flex-start;gap:0;min-width:104px;max-width:150px}
  .live-right .member-box .mn{font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
  .live-right .member-box .ms{font-size:.8rem}
  .live-right .mslots{flex:1;min-width:0}
  .live-right .ms-slot{padding:4px 0}
  .live-right .keys button{min-height:42px}
  .live-right .btn-start{min-height:48px}
  .live-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .live-actions button{width:100%}
  .live-actions[data-n="1"]{grid-template-columns:1fr}
  .live-actions[data-n="3"]{grid-template-columns:1fr 1fr 1fr}
  /* 확인 팝업 (화면 디자인과 같은 어두운 카드) */
  .modal-bg{position:fixed;inset:0;z-index:50;background:rgba(3,8,16,.72);display:flex;align-items:center;justify-content:center;padding:20px}
  .modal-card{width:min(440px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 20px 60px #000a;display:flex;flex-direction:column;gap:12px}
  .modal-card h3{margin:0;font-size:1.2rem;font-weight:900}
  .modal-card p{margin:0;color:var(--muted);line-height:1.6;font-size:.92rem}
  .modal-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
  .modal-btns button{min-height:52px;border-radius:12px;font-weight:900;font-size:1rem}
  .modal-cancel{border:1px solid #5b6f86;background:transparent;color:var(--text)}
  .modal-ok{border:0;background:var(--red);color:#fff}
  /* 넓은 화면(크롬북 등)에서는 경기 화면이 스크롤 없이 한 화면에 들어오게 한다 */
  @media(min-width:860px){
    body.live-mode .wrap{height:100vh;height:100dvh;display:flex;flex-direction:column;padding-bottom:12px}
    body.live-mode header{flex:none}
    body.live-mode .wrap{max-width:1420px}
    /* 왼쪽 과녁: 화면 높이에 맞춘 정사각형, 최대 720px, 오른쪽이 최소 460px은 남도록 / 오른쪽: 460~640px, 둘을 묶어 가운데 */
    body.live-mode #liveView{flex:1;min-height:0;container-type:size;grid-template-columns:auto minmax(460px,640px);justify-content:center;align-items:stretch}
    body.live-mode .live-left{align-self:center;width:min(100cqh,calc(100cqw - 476px),720px);aspect-ratio:1}

  @media(min-width:860px) and (max-height:700px){
    body.live-mode .live-right h2,body.live-mode #manualArea .sec-title{display:none}

  /* 세로가 아주 낮은 화면(예: 1280×720 크롬북)에서만 간격을 줄여 넘치지 않게 한다 */
  @media(min-width:860px) and (max-height:620px){
    body.live-mode .live-right{gap:6px;padding:10px}

  /* ===== 글자 크기: 칸 크기에 비례 (칸 높이의 약 35~45%, 최소·최대 있음) ===== */

  @media(min-width:860px){
    /* 시작 전 화면 - 오른쪽(개인전): 칸 높이와 같은 기준(vh)으로 비례 */
    body.setup-mode .setup-right.ind .seg button{font-size:clamp(15px,2.85vh,20.5px)}

  /* ===== 통일된 글자·칸 크기 체계 (시작 전 화면, 폭 860px 이상) =====

     그래서 화면이 커지거나 작아져도 글자끼리, 칸끼리의 크기 관계가 그대로 유지된다. */

      --fs-sec:calc(var(--fs)*.9);     /* 섹션 제목: 연습 1~10차시, 사격 순서 */

      --fs-cta:calc(var(--fs)*1.15);   /* 요약 상자·시작 버튼 */
      --h-ctl:calc(var(--fs)*3.2);     /* 버튼·선택 칸 높이 */

      --h-slot:calc(var(--fs)*3);      /* 차시 칸 높이 */
      --fs-key:calc(var(--fs)*1.3);    /* 경기 화면: 수동 점수 버튼 숫자 */
      --fs-big:calc(var(--fs)*1.8);    /* 경기 화면: 개인전 점수 칸 큰 숫자 */
    }

    body.setup-mode #setupView #setupRight .start-row .summary{min-height:var(--h-cta)}

    body.setup-mode #setupView #setupRight .startwarn,body.setup-mode #setupView #setupRight .msg{font-size:var(--fs-label)}
    body.setup-mode #setupView #setupRight .order-row{flex:none;height:var(--h-row);min-height:0;max-height:none}
    body.setup-mode #setupView #setupRight .order-row .nm,body.setup-mode #setupView #setupRight .order-row .rank,body.setup-mode #setupView #setupRight .order-row .sh{font-size:var(--fs)}
    body.setup-mode #setupView #setupRight .order-row .icon-btn{width:calc(var(--h-row) - 10px);height:calc(var(--h-row) - 10px);max-height:none}
    body.setup-mode #setupView #setupRight .order-row .tog-btn{height:calc(var(--h-row) - 10px);max-height:none;font-size:var(--fs-label)}
    /* 왼쪽 */
    body.setup-mode #setupView #histPanel .hint{font-size:var(--fs)}
    body.setup-mode #setupView #histPanel .ih-top h2{font-size:var(--fs-title)}
    body.setup-mode #setupView #histPanel .ih-stat{font-size:var(--fs-label)}
    body.setup-mode #setupView #histPanel .ih-stat b{font-size:var(--fs-num)}
    body.setup-mode #setupView #histPanel .sec-title{font-size:var(--fs-sec)}
    body.setup-mode #setupView #histPanel .sec-title .small,body.setup-mode #setupView #histPanel #teamPast{font-size:var(--fs-label)}
    body.setup-mode #setupView #histPanel .ih-sess .slot{min-height:var(--h-slot);display:flex;flex-direction:column;justify-content:center}
    body.setup-mode #setupView #histPanel .ih-sess .slot .n{font-size:var(--fs-label)}
    body.setup-mode #setupView #histPanel .ih-sess .slot .s{font-size:var(--fs-num)}
    body.setup-mode #setupView #histPanel .ih-shots .shot-cell .v{font-size:var(--fs-num)}
    body.setup-mode #setupView #histPanel .ih-shots .shot-cell .n{font-size:var(--fs-label)}
    body.setup-mode #setupView #histPanel .lg .nm{font-size:var(--fs)}
    body.setup-mode #setupView #histPanel .lg b{font-size:var(--fs-num)}
    body.setup-mode #setupView #histPanel .lg .sh{font-size:var(--fs-label)}
    /* 경기 화면 (같은 기준) */
    body.live-mode #liveView .banner .sub{font-size:var(--fs-label)}
    body.live-mode #liveView .banner .who,body.live-mode #liveView .banner .cnt{font-size:var(--fs-title)}
    body.live-mode #liveView .metric small{font-size:var(--fs-label)}
    body.live-mode #liveView .metric strong{font-size:var(--fs-num)}
    body.live-mode #liveView .metric:first-child strong{font-size:var(--fs-title)}
    body.live-mode #liveView .live-right h2,body.live-mode #liveView .sec-title{font-size:var(--fs-sec)}
    body.live-mode #liveView .lslot .n{font-size:var(--fs-label)}
    body.live-mode #liveView .lslot .v{font-size:var(--fs-big)}
    body.live-mode #liveView .member-box .mn{font-size:var(--fs)}
    body.live-mode #liveView .member-box .ms{font-size:var(--fs-label)}
    body.live-mode #liveView .ms-slot{font-size:var(--fs-num)}
    body.live-mode #liveView .keys button{font-size:var(--fs-key)}
    body.live-mode #liveView .savebox,body.live-mode #liveView .live-actions button{font-size:var(--fs)}
    body.live-mode #liveView .msg{font-size:var(--fs-label)}
  }
  [hidden]{display:none!important}
</style>

<body>
<div class="wrap">
  <header>
    <h1>LASER MATCH · <span id="hdrLane">1</span>사로</h1>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <span class="pill" id="phonePill">사대 폰 확인 중…</span>
      <span class="pill" id="connPill">연결 중…</span>
    </div>
  </header>
  <div class="dupwarn" id="dupWarn" hidden></div>

  <!-- ===== 시작 전 화면 ===== -->
  <div class="layout" id="setupView">
    <section class="panel" id="histPanel">
      <div class="hint" id="histHint">오른쪽에서 학생 또는 조를 고르면 지난 기록이 여기에 보여요.</div>
      <div id="histBody" class="ih" hidden></div>
      <!-- 단체전: 팀 정보 · 지난 기록 · 최근 경기 탄착군(팀원별 색) -->
      <div id="teamBox" class="tb" hidden>
        <div class="ih-top" id="teamTop"></div>
        <div class="small muted" id="teamPast" style="line-height:1.6"></div>
        <div class="ih-main-wrap">
          <div class="sec-title" id="teamShotTitle">최근 경기 탄착군</div>
          <div class="ih-main legend" id="teamMain">
            <div class="ih-target"><div class="canvas-box"><canvas id="cvTeam" width="600" height="600"></canvas></div></div>
            <div class="ih-legend" id="teamLegend"></div>
          </div>
        </div>
      </div>
    </section>

    <section class="panel setup-right" id="setupRight">
      <div class="lbl">구분
        <div class="seg" style="grid-template-columns:repeat(3,minmax(0,1fr))" id="segType">
          <button type="button" data-v="check">영점 조준</button>
          <button type="button" data-v="practice">연습</button>
          <button type="button" data-v="eval">수행</button>
        </div>
      </div>
      <div class="lbl">방식
        <div class="seg" style="grid-template-columns:repeat(2,minmax(0,1fr))" id="segMode">
          <button type="button" data-v="individual">개인전 10발</button>
          <button type="button" data-v="team">단체전 20발</button>
        </div>
      </div>
      <div class="sel3">
        <label class="lbl">사로<select id="selLane"></select></label>
        <label class="lbl">반<select id="selClass"><option value="">불러오는 중…</option></select></label>
        <label class="lbl" id="rowStudent">학생<select id="selStudent"><option value="">-- 반을 먼저 고르세요 --</option></select></label>
        <label class="lbl" id="rowTeam" hidden>조 (드래프트)<select id="selTeam"><option value="">-- 반을 먼저 고르세요 --</option></select></label>
      </div>
      <div class="lbl" id="rowOrder" hidden>
        <span>사격 순서 <span class="small muted">(▲▼로 바꾸기, 결석은 빼기)</span></span>
        <div id="orderList" class="order-list"></div>
      </div>
      <div class="startwarn" id="startWarn" hidden></div>
      <div class="start-row">
        <div class="summary" id="summaryBox">
          <div class="big" id="sumBig">-</div>
          <div class="small muted" id="sumSub" hidden></div>
        </div>
        <button type="button" class="btn-start" id="btnStart" disabled>경기 시작</button>
      </div>
      <p class="msg" id="setupMsg"></p>
    </section>
  </div>

  <!-- ===== 경기 화면 ===== -->
  <div class="layout" id="liveView" hidden>
    <section class="live-left">
      <div class="live-target"><div class="canvas-box"><canvas id="cvLive" width="600" height="600"></canvas></div></div>
    </section>
    <section class="panel live-right">
      <div class="banner" id="banner">
        <div><div class="sub" id="banSub">-</div><div class="who" id="banWho">-</div></div>
        <div><div class="cnt" id="banCnt">-</div><div class="sub" id="banNext" style="text-align:right"></div></div>
      </div>
      <div class="scoreboard">
        <div class="metric"><small id="totLabel">총점</small><strong id="mTotal">0</strong></div>
        <div class="metric"><small>발수</small><strong><span id="mCnt">0</span>/<span id="mMax">10</span></strong></div>
        <div class="metric"><small>평균</small><strong id="mAvg">0.0</strong></div>
      </div>
      <h2 id="scoreTitle">획득 점수</h2>
      <div id="scoreArea"></div>
      <div id="manualArea" style="display:flex;flex-direction:column;gap:8px">
        <div class="sec-title muted">수동 점수 입력 (누르면 바로 1발 기록)</div>
        <div class="keys" id="keys"></div>
      </div>
      <div class="savebox" id="saveBox" hidden></div>
      <div class="live-actions" id="runActions" data-n="3">
        <button type="button" class="btn-line gray" id="btnUndo">마지막 발 취소</button>
        <button type="button" class="btn-line gray" id="btnRetrySave" hidden>저장 다시 시도</button>
        <button type="button" class="btn-line" id="btnRestart">다시 시작</button>
        <button type="button" class="btn-line" id="btnAbort">경기 중단</button>
      </div>
      <div class="live-actions" id="doneActions" hidden>
        <button type="button" class="btn-start" id="btnNextMatch">바로 다음 경기</button>
        <button type="button" class="btn-line gray" id="btnHome">처음 화면으로</button>
      </div>
      <p class="msg" id="liveMsg"></p>
    </section>
  </div>
</div>

<div class="modal-bg" id="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h3 id="modalTitle">-</h3>
    <p id="modalText"></p>
    <div class="modal-btns">
      <button type="button" class="modal-cancel" id="modalCancel">취소</button>
      <button type="button" class="modal-ok" id="modalOk">확인</button>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';
  // 주소와 Firebase 설정은 config.js 파일에서 읽어 온다(이 파일을 고쳐도 다시 넣을 필요 없음).
  const LASER_CONFIG = window.LASER_CONFIG || {};
  const APPS_SCRIPT_URL = String(LASER_CONFIG.APPS_SCRIPT_URL || '').trim();
  const FIREBASE_CONFIG = LASER_CONFIG.FIREBASE || null;
  const LANE_COUNT = 7;
  const LANE_SHOTS = { individual: 10, team: 20 };   // index.html과 같은 값
  const TYPE_LABEL = { check: '영점 조준', practice: '연습', eval: '수행' };

  const $ = id => document.getElementById(id);
  const esc = v => String(v === undefined || v === null ? '' : v).replace(/[&<>'"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[c]));

  const S = {
    lane: 1, type: 'practice', mode: 'individual',
    classes: [], students: [], byId: {},
    cls: '', studentId: '',
    drafts: [], teamIdx: '', order: [],          // order: [{id, name, absent}]
    hist: null, histReq: 0, histLoading: false, histError: '',
    laneState: null, dismissedMatch: '', db: null, fbReady: false,
    offset: 0, otherViewers: 0,
    viewerId: 'v_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8)
  };

  /* ---------- Apps Script 호출 (JSONP) ---------- */
  function serverReady() { return /^https:\/\/script\.google\.com\/(a\/[^/]+\/)?macros\/s\/.+\/exec$/.test(APPS_SCRIPT_URL); }
  function jsonp(action, params, timeoutMs) {
    return new Promise((resolve, reject) => {
      if (!window.LASER_CONFIG) { reject(new Error('config.js 설정 파일을 찾을 수 없어요. live.html과 같은 폴더에 올렸는지 확인하세요.')); return; }
      if (!serverReady()) { reject(new Error('config.js에 Apps Script 주소를 넣어 주세요.')); return; }
      const cb = 'lvCb_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
      const script = document.createElement('script'); let done = false;
      const timer = setTimeout(() => finish(new Error('응답 시간 초과')), timeoutMs || 25000);
      function finish(err, res) { if (done) return; done = true; clearTimeout(timer); window[cb] = function () {}; script.remove(); err ? reject(err) : resolve(res); }
      window[cb] = res => finish(null, res);
      script.onerror = () => finish(new Error('네트워크 오류'));
      script.src = `${APPS_SCRIPT_URL}?${new URLSearchParams(Object.assign({ action, callback: cb }, params || {})).toString()}`;
      document.head.appendChild(script);
    });
  }

  /* ---------- 공통 계산 ---------- */
  function nameOf(id) { const s = S.byId[id]; return s ? s.name : (id || ''); }
  function labelOfStudent(id) { const s = S.byId[id]; return s ? `${s.cls}반 ${s.number}번 ${s.name}` : (id || ''); }
  function presentMembers() { return S.order.filter(m => !m.absent); }
  // 발수 자동 배분: 20발을 출석 인원으로 나누고, 남는 발은 앞 순서부터 1발씩 더 (4명 5-5-5-5, 3명 7-7-6)
  function splitShots(n) {
    if (!n) return [];
    const base = Math.floor(LANE_SHOTS.team / n), rem = LANE_SHOTS.team % n;
    return Array.from({ length: n }, (_, i) => base + (i < rem ? 1 : 0));
  }
  function teamKey() {
    const team = S.drafts[S.teamIdx];
    if (!team) return '';
    const ids = (team.members || []).map(m => String(m.studentId)).filter(Boolean).sort();
    return S.cls + ':' + ids.join(',');
  }
  function shotsArr(v) { return Array.isArray(v) ? v.filter(Boolean) : (v && typeof v === 'object' ? Object.keys(v).sort((a, b) => a - b).map(k => v[k]) : []); }
  function membersArr(v) { return Array.isArray(v) ? v.filter(Boolean) : (v && typeof v === 'object' ? Object.keys(v).sort((a, b) => a - b).map(k => v[k]) : []); }
  // 몇 번째 발이 몇 번째 팀원의 것인지 (사격 순서·발수 기준)
  function memberIndexOf(shotIndex, members) {
    let acc = 0;
    for (let i = 0; i < members.length; i++) { acc += Number(members[i].shots) || 0; if (shotIndex < acc) return i; }
    return members.length - 1;
  }

  /* ---------- 과녁 그리기 ---------- */
  // opts.fit: 탄착 위치에 맞춰 과녁을 확대해서 그린다(지난 기록용). 모든 발이 과녁 안이면 상자를 거의 꽉 채운다.
  function drawTarget(canvas, shots, colorOf, opts) {
    const ctx = canvas.getContext('2d');
    const W = canvas.width, cx = W / 2, cy = W / 2;
    let R = W * 0.28;
    if (opts && opts.fit) {
      let far = 1;
      shots.forEach(s => { if (s && s.k !== 'manual') far = Math.max(far, Math.hypot(Number(s.u) || 0, Number(s.v) || 0)); });
      R = Math.min(W * 0.46, (W * 0.47) / (far + 0.04));
    }
    ctx.clearRect(0, 0, W, W);
    ctx.beginPath(); ctx.arc(cx, cy, R * 0.4, 0, Math.PI * 2); ctx.fillStyle = '#1d3550'; ctx.fill();
    for (let i = 10; i >= 1; i--) {
      ctx.beginPath(); ctx.arc(cx, cy, R * i / 10, 0, Math.PI * 2);
      ctx.strokeStyle = i === 10 ? '#b7ff3ccc' : '#b7ff3c55'; ctx.lineWidth = i === 10 ? W / 240 : W / 430; ctx.stroke();
    }
    const dot = (opts && opts.dot) || W / 60;
    shots.forEach((s, i) => {
      if (!s || s.k === 'manual') return;   // 수동 입력 발은 위치가 없음
      const px = cx + (Number(s.u) || 0) * R, py = cy + (Number(s.v) || 0) * R;
      const c = colorOf(s, i);
      ctx.beginPath();
      if (s.k === 'object') { ctx.moveTo(px, py - dot * 1.1); ctx.lineTo(px + dot * 1.1, py); ctx.lineTo(px, py + dot * 1.1); ctx.lineTo(px - dot * 1.1, py); ctx.closePath(); }
      else ctx.arc(px, py, dot, 0, Math.PI * 2);
      ctx.fillStyle = c.fill; ctx.fill();
      if (c.ring) { ctx.lineWidth = W / 200; ctx.strokeStyle = c.ring; ctx.stroke(); }
      if (c.label) { ctx.fillStyle = '#07111f'; ctx.font = `bold ${Math.round(dot * 1.1)}px system-ui`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(String(i + 1), px, py); }
    });
  }

  // 지금 고른 내용으로 무엇이 저장될지, 시작해도 되는지 판단한다.
  function evaluateSetup() {
    const r = { ok: false, big: '-', sub: '', cls: S.type, reason: '' };
    const typeLabel = TYPE_LABEL[S.type];
    if (S.mode === 'individual') {
      if (S.type !== 'check' && !S.studentId) { r.reason = '학생을 선택하세요.'; r.big = '학생을 선택하세요'; return r; }
      const who = S.studentId ? labelOfStudent(S.studentId) : '학생 선택 안 함';
      if (S.type === 'check') { r.ok = true; r.big = `${who} · ${TYPE_LABEL.check}`; r.sub = '저장 안 함'; return r; }
      if (S.histLoading) { r.big = `${who}`; r.sub = '지난 기록을 불러오는 중…'; r.reason = '기록을 불러오는 중이에요.'; return r; }
      if (!S.hist || S.hist.kind !== 'student' || S.hist.id !== S.studentId) { r.big = who; r.sub = S.histError || '지난 기록을 불러오지 못했어요'; r.reason = '지난 기록 확인이 필요해요.'; return r; }
      const next = S.hist.data.next[S.type];
      if (!next) { r.cls = 'warn'; r.big = `${typeLabel} 차시가 모두 찼어요`; r.sub = '선생님께 기록 정리를 요청하세요'; r.reason = '차시가 모두 찼어요.'; return r; }
      r.ok = true; r.big = `${who} · ${typeLabel} ${next}차시 · 개인전`; r.sub = ''; r.label = `${typeLabel} ${next}차시`;
      return r;
    }
    const team = S.drafts[S.teamIdx];
    if (!S.cls || !team) { r.reason = '반과 조를 선택하세요.'; r.big = '반과 조를 선택하세요'; return r; }
    const n = presentMembers().length;
    if (n < 3 || n > 5) { r.cls = 'warn'; r.big = `출석 ${n}명`; r.sub = '단체전은 3~5명이 쏴야 해요'; r.reason = '출석 인원을 확인하세요.'; return r; }
    if (S.type === 'check') { r.ok = true; r.big = `${S.cls}반 ${team.teamName} · ${TYPE_LABEL.check}`; r.sub = '저장 안 함'; return r; }
    if (S.histLoading) { r.big = `${S.cls}반 ${team.teamName}`; r.sub = '지난 기록을 불러오는 중…'; r.reason = '기록을 불러오는 중이에요.'; return r; }
    if (!S.hist || S.hist.kind !== 'team' || S.hist.id !== teamKey()) { r.big = `${S.cls}반 ${team.teamName}`; r.sub = S.histError || '지난 기록을 불러오지 못했어요'; r.reason = '지난 기록 확인이 필요해요.'; return r; }
    const nth = S.hist.data.next[S.type];
    r.ok = true; r.big = `${S.cls}반 ${team.teamName} · ${typeLabel} ${nth}번째 · 단체전`; r.sub = ''; r.label = `${typeLabel} ${nth}번째`;
    return r;
  }
  function laneBusy() { const ls = S.laneState; return !!(ls && ls.running && ls.online); }
  function renderSummary() {
    const r = evaluateSetup();
    $('summaryBox').className = 'summary ' + (r.cls === 'warn' ? 'warn' : S.type === 'eval' ? 'eval' : S.type === 'check' ? 'check' : '');
    $('sumBig').textContent = r.big; $('sumSub').textContent = r.sub; $('sumSub').hidden = !r.sub;
    const btn = $('btnStart');
    btn.textContent = `${S.lane}사로 경기 시작`;
    btn.disabled = !r.ok || !S.fbReady || laneBusy();
    btn.title = !S.fbReady ? '실시간 연결 중이에요' : laneBusy() ? '이 사로는 사격 중이에요' : (r.reason || '');
    return r;
  }

  /* ---------- 시작 전: 지난 기록 ---------- */
  function loadHistory() {
    const req = ++S.histReq;
    S.hist = null; S.histError = '';
    let action, params, kind, id;
    if (S.mode === 'individual') {
      if (!S.studentId) { S.histLoading = false; renderHistory(); renderSummary(); return; }
      action = 'studentHistory'; params = { studentId: S.studentId }; kind = 'student'; id = S.studentId;
    } else {
      const key = teamKey();
      if (!key) { S.histLoading = false; renderHistory(); renderSummary(); return; }
      action = 'teamHistory'; params = { cls: S.cls, teamKey: key }; kind = 'team'; id = key;
    }
    S.histLoading = true; renderHistory(); renderSummary();
    jsonp(action, params).then(res => {
      if (req !== S.histReq) return;   // 그사이 다른 학생/조를 골랐으면 버림
      if (!res || !res.ok) throw new Error((res && res.error) || '불러오기 실패');
      S.hist = { kind, id, data: res };
    }).catch(err => {
      if (req !== S.histReq) return;
      S.histError = '지난 기록을 불러오지 못했어요: ' + err.message;
    }).then(() => {
      if (req !== S.histReq) return;
      S.histLoading = false; renderHistory(); renderSummary();
    });
  }
  function renderHistory() {
    const hint = $('histHint'), body = $('histBody'), tb = $('teamBox');
    const showHint = t => { hint.textContent = t; hint.hidden = false; body.hidden = true; tb.hidden = true; };
    if (S.mode === 'team') {
      body.hidden = true;
      if (!teamKey()) return showHint('오른쪽에서 반과 조를 고르면 사격 순서와 이 팀의 지난 기록이 여기에 보여요.');
      hint.hidden = true; tb.hidden = false;
      if (S.histLoading || !S.hist || S.hist.kind !== 'team') {
        const team = S.drafts[S.teamIdx] || {};
        $('teamTop').innerHTML = `<h2>${esc(S.cls)}반 ${esc(team.teamName)}</h2><span class="small muted">${S.histLoading ? '지난 기록을 불러오는 중…' : esc(S.histError || '지난 기록이 없어요.')}</span>`;
        $('teamPast').innerHTML = ''; $('teamLegend').innerHTML = '';
        $('teamShotTitle').textContent = '최근 경기 탄착군';
        drawTarget($('cvTeam'), [], () => ({ fill: '#b7ff3c' }), { fit: true });
        return;
      }
      return renderTeamHistory(S.hist.data);
    }
    tb.hidden = true;
    if (!S.studentId) return showHint('오른쪽에서 학생을 고르면 지난 기록이 여기에 보여요.');
    if (S.histLoading) return showHint('지난 기록을 불러오는 중…');
    if (!S.hist || S.hist.kind !== 'student') return showHint(S.histError || '지난 기록이 없어요.');
    hint.hidden = true; body.hidden = false;
    renderStudentHistory(S.hist.data);
  }
  function slotHtml(n, v, next) {
    const filled = v !== '' && v !== null && v !== undefined;
    const cls = filled ? 'filled' : (next ? 'next' : '');
    return `<div class="slot ${cls}"><div class="n">${n}</div><div class="s">${filled ? esc(v) : (next ? '다음' : '-')}</div></div>`;
  }

    const st = d.student || {};

    const last = d.lastShots || [];
    const cells = last.map((x, i) => `<div class="shot-cell ${Number(x.s) ? 'hit' : 'miss'}"><span class="n">${i + 1}</span><span class="v">${esc(x.s)}</span></div>`).join('');
    $('histBody').innerHTML = `
      <div class="ih-top">

    // 점에 발 번호를 적어서, 옆의 발별 점수 칸과 맞춰 볼 수 있게 한다.
    drawTarget($('cvHist'), last, (x, i) => ({ fill: Number(x.s) ? '#b7ff3c' : '#ff4d66', label: true, ring: i === last.length - 1 ? '#ffc940' : '' }), { fit: true, dot: 600 / 40 });
  }
  // 단체전 탄착군에서 팀원을 구분하는 색 (사격 순서대로)
  const MEMBER_COLORS = ['#29e7d6', '#ffc940', '#c78bff', '#ff8a3d', '#7aa2ff'];
  function renderTeamHistory(d) {

    $('teamTop').innerHTML = `
      <h2>${esc(S.cls)}반 ${esc(team.teamName)}</h2>

        <span class="ih-stat">수행 다음<b style="color:var(--red2)">${esc(d.next.eval)}번째</b></span>
      </div>`;
    $('teamPast').innerHTML = `<b style="color:var(--cyan)">연습</b> ${list(d.practice || [])} &nbsp;·&nbsp; <b style="color:var(--red2)">수행</b> ${list(d.eval || [])}`;
    const shots = d.lastShots || [], members = d.lastMembers || [];
    const colorOf = {}; members.forEach((m, i) => { colorOf[m.id] = MEMBER_COLORS[i % MEMBER_COLORS.length]; });
    $('teamShotTitle').textContent = shots.length ? '최근 레이저 경기 탄착군 (팀원별 색)' : '최근 레이저 경기 탄착군 · 기록 없음';
    $('teamMain').className = 'ih-main legend' + (shots.length ? '' : ' noshots');

    // 팀원별 색으로 칠하고, 0점은 빨간 점에 팀원 색 테두리

      const c = colorOf[x.who] || '#b7ff3c';

  /* ---------- 명령 보내기 (Firebase) ---------- */
  function cmdRef(path) { return S.db.ref('cmds/' + S.lane + (path ? '/' + path : '')); }
  // 같은 사로에서 '아직 사대가 처리하지 않은' 다른 시작 명령이 있으면 덮어쓰지 않는다(동시에 눌러도 한 쪽만 성공).
  const START_PENDING_MS = 15000;
  let ackRef = null, ackTimer = 0;
  function sendStart() {
    const r = renderSummary();
    if (!r.ok || !S.fbReady || laneBusy()) return;
    const cmd = { lane: S.lane, evalType: S.type, mode: S.mode, label: r.label || '', studentId: '', cls: S.cls || '', teamName: '', teamKey: '', members: [] };
    if (S.mode === 'individual') {
      cmd.studentId = S.studentId || '';
    } else {
      const team = S.drafts[S.teamIdx];
      const split = splitShots(presentMembers().length);
      cmd.teamName = team.teamName || '';
      cmd.teamKey = teamKey();
      cmd.members = presentMembers().map((m, i) => ({ id: m.id, shots: split[i] }));
    }
    $('btnStart').disabled = true;
    startWithCmd(cmd, $('setupMsg'));
  }
  // 시작 명령을 보낸다. 같은 사로에 '아직 사대가 처리하지 않은' 다른 시작 명령이 있으면 덮어쓰지 않는다.
  function startWithCmd(fields, msgEl) {
    const lane = S.lane;
    const cmd = Object.assign({
      cmdId: 'cmd_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8),
      issuedAt: Date.now() + S.offset, by: S.viewerId
    }, fields);
    msgEl.textContent = '📡 시작 명령을 보내는 중…';
    // start로 통째로 덮어써서, 이전 경기의 취소·수동입력·종료 신호도 함께 비운다.
    S.db.ref('cmds/' + lane).transaction(cur => {
      const p = cur && cur.start;
      const pending = p && p.cmdId && p.cmdId !== cmd.cmdId && !(p.ack && p.ack.cmdId === p.cmdId) &&
        (Date.now() + S.offset - Number(p.issuedAt || 0)) < START_PENDING_MS;
      if (pending) return;   // 다른 크롬북의 시작 명령이 처리 대기 중 → 이번 시도는 취소
      return { start: cmd };
    }).then(res => {
      if (!res || !res.committed) {
        msgEl.textContent = `⚠ 다른 크롬북이 방금 ${lane}사로에 시작 명령을 보냈어요. 사로 번호를 확인하세요.`;
        renderSummary(); return;
      }
      msgEl.textContent = '📡 보냈어요 - 사대 태블릿 확인 중…';
      watchAck(lane, cmd.cmdId, msgEl);
    }).catch(err => {
      msgEl.textContent = '⚠️ 전송 실패: ' + err.message; renderSummary();
    });
  }
  // 사대 태블릿이 이 시작 명령을 받아들였는지(또는 왜 거절했는지) 확인해서 보여준다.
  function watchAck(lane, cmdId, msgEl) {
    if (ackRef) ackRef.off();
    clearTimeout(ackTimer);
    ackRef = S.db.ref('cmds/' + lane + '/start/ack');
    const ref = ackRef;
    ackTimer = setTimeout(() => {
      ref.off();
      if (S.lane === lane) msgEl.textContent = `⚠ ${lane}사로 사대 태블릿이 응답하지 않아요. 태블릿이 켜져 있고 ${lane}사로로 연결됐는지 확인하세요.`;
    }, 8000);
    ref.on('value', snap => {
      const a = snap.val();
      if (!a || a.cmdId !== cmdId) return;
      clearTimeout(ackTimer); ref.off();
      if (a.result === 'started') { msgEl.textContent = '✅ 사대에서 경기를 시작했어요.'; }
      else { msgEl.textContent = '⚠ 시작되지 않았어요: ' + (a.reason || '알 수 없는 이유'); renderSummary(); }
    });
  }

  // 바로 다음 경기: 방금 경기와 같은 학생(팀)·같은 구분으로 다음 차시를 곧바로 시작한다.
  function nextMatch() {
    const ls = S.laneState;
    if (!ls || ls.running || !S.fbReady) return;
    const msg = $('liveMsg'), btn = $('btnNextMatch');
    const mode = ls.mode === 'team' ? 'team' : 'individual';
    const type = ['check', 'practice', 'eval'].includes(ls.evalType) ? ls.evalType : 'check';
    const fields = {
      lane: S.lane, evalType: type, mode, label: '',
      studentId: ls.studentId || '', cls: ls.cls || '', teamName: ls.teamName || '', teamKey: ls.teamKey || '',
      members: membersArr(ls.members).map(m => ({ id: String(m.id), shots: Number(m.shots) || 0 }))
    };
    if (type === 'check' || (mode === 'individual' && !fields.studentId)) { startWithCmd(fields, msg); return; }
    btn.disabled = true; msg.textContent = '다음 차시를 확인하는 중…';
    const req = mode === 'individual' ? jsonp('studentHistory', { studentId: fields.studentId }) : jsonp('teamHistory', { cls: fields.cls, teamKey: fields.teamKey });
    req.then(res => {
      if (!res || !res.ok) throw new Error((res && res.error) || '기록 확인 실패');
      const nx = res.next[type];
      if (!nx) { msg.textContent = `⚠ ${TYPE_LABEL[type]} 차시가 모두 찼어요. 처음 화면에서 다른 구분을 골라 주세요.`; return; }
      fields.label = mode === 'individual' ? `${TYPE_LABEL[type]} ${nx}차시` : `${TYPE_LABEL[type]} ${nx}번째`;
      startWithCmd(fields, msg);
    }).catch(err => { msg.textContent = '⚠ ' + err.message; })
      .then(() => { btn.disabled = false; });
  }

  function sendEvent(ev, msgEl) {
    if (!S.fbReady) return;
    ev.at = firebase.database.ServerValue.TIMESTAMP;
    cmdRef('events').push(ev).then(() => { if (msgEl) msgEl.textContent = ''; })
      .catch(err => { if (msgEl) msgEl.textContent = '⚠️ 전송 실패: ' + err.message; });
  }
  // 화면 디자인에 맞춘 확인 팝업. 확인을 누르면 true, 취소·바깥 클릭·Esc는 false.
  function askConfirm(title, text, okLabel) {
    return new Promise(resolve => {
      const m = $('modal');
      $('modalTitle').textContent = title; $('modalText').textContent = text; $('modalOk').textContent = okLabel;
      m.hidden = false; $('modalCancel').focus();
      const done = v => { m.hidden = true; m.onclick = null; $('modalOk').onclick = null; $('modalCancel').onclick = null; document.removeEventListener('keydown', onKey); resolve(v); };
      const onKey = e => { if (e.key === 'Escape') done(false); };
      $('modalOk').onclick = () => done(true);
      $('modalCancel').onclick = () => done(false);
      m.onclick = e => { if (e.target === m) done(false); };
      document.addEventListener('keydown', onKey);
    });
  }
  function abortMatch() {
    if (!S.fbReady) return;
    askConfirm(`${S.lane}사로 경기를 중단할까요?`, '사대 태블릿의 점수와 탄착군이 지워지고 처음 화면으로 돌아가요. 이 경기는 저장되지 않아요.', '경기 중단').then(ok => {
      if (!ok) return;
      cmdRef('end').set({ endId: 'end_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6), at: firebase.database.ServerValue.TIMESTAMP })
        .then(() => { S.dismissedMatch = (S.laneState && S.laneState.matchId) || ''; $('setupMsg').textContent = '✅ 경기를 중단했어요.'; $('liveMsg').textContent = ''; render(); })
        .catch(err => { $('liveMsg').textContent = '⚠️ 전송 실패: ' + err.message; });
    });
  }
  function restartMatch() {
    if (!S.fbReady) return;
    askConfirm('처음부터 다시 시작할까요?', '지금까지의 점수가 모두 지워지고, 같은 학생·같은 차시로 카운트다운부터 다시 시작해요. 이 경기는 저장되지 않아요.', '다시 시작').then(ok => {
      if (ok) sendEvent({ type: 'restart' }, $('liveMsg'));
    });
  }

  /* ---------- 같은 사로를 연 크롬북 확인 (Firebase viewers/{사로}) ---------- */
  let viewerRef = null, viewersRef = null;
  function registerViewer() {
    if (!S.fbReady) return;
    if (viewerRef) { viewerRef.onDisconnect().cancel(); viewerRef.remove().catch(() => {}); }
    if (viewersRef) viewersRef.off();
    const lane = S.lane;
    viewerRef = S.db.ref('viewers/' + lane + '/' + S.viewerId);
    viewerRef.onDisconnect().remove();
    viewerRef.set({ at: firebase.database.ServerValue.TIMESTAMP }).catch(() => {});
    S.otherViewers = 0; renderDup();
    viewersRef = S.db.ref('viewers/' + lane);
    viewersRef.on('value', snap => {
      if (lane !== S.lane) return;
      const v = snap.val() || {};
      S.otherViewers = Object.keys(v).filter(k => k !== S.viewerId).length;
      renderDup();
    }, () => {});
  }
  function renderDup() {
    const el = $('dupWarn'), sw = $('startWarn');
    if (S.otherViewers > 0) {
      el.hidden = false; sw.hidden = false;
      el.textContent = `⚠ 지금 ${S.lane}사로를 다른 크롬북 ${S.otherViewers}대도 열고 있어요. 내 사로 번호가 맞는지 확인하세요.`;
      sw.textContent = `⚠ ${S.lane}사로를 다른 크롬북도 열고 있어요. 사로 번호를 확인한 뒤 시작하세요.`;
    } else { el.hidden = true; sw.hidden = true; }
  }

  /* ---------- 사로 상태 구독 (Firebase) ---------- */
  let laneRefCur = null, lastSaveStatus = '';
  function subscribeLane() {
    if (!S.fbReady) return;
    if (laneRefCur) laneRefCur.off();
    S.laneState = null;
    laneRefCur = S.db.ref('lanes/' + S.lane);
    const lane = S.lane;
    laneRefCur.on('value', snap => {
      if (lane !== S.lane) return;
      const prev = S.laneState;
      S.laneState = snap.val();
      const ls = S.laneState;
      // 이 화면에서 고른 학생/팀의 저장이 끝나면 지난 기록을 다시 불러와 다음 차시를 갱신한다.
      const st = ls && ls.save && ls.save.status;
      if (st === 'ok' && lastSaveStatus !== 'ok') loadHistory();
      lastSaveStatus = st || '';
      if (prev && ls && prev.matchId !== ls.matchId) S.dismissedMatch = '';
      render();
    }, err => { $('connPill').textContent = '실시간 읽기 오류'; $('connPill').className = 'pill bad'; console.error(err); });
  }

  /* ---------- 경기 화면 ---------- */
  function inMatchView() {
    const ls = S.laneState;
    if (!ls || !ls.matchId) return false;
    if (ls.running) return true;
    return shotsArr(ls.shots).length > 0 && S.dismissedMatch !== ls.matchId;
  }
  function renderLive() {
    const ls = S.laneState || {};
    const shots = shotsArr(ls.shots);
    const members = membersArr(ls.members);
    const isTeam = ls.mode === 'team' && members.length > 0;
    const max = Number(ls.maxShots) || (isTeam ? LANE_SHOTS.team : LANE_SHOTS.individual);
    const total = shots.reduce((a, s) => a + (Number(s.s) || 0), 0);
    const typeLabel = TYPE_LABEL[ls.evalType] || '';
    const curIdx = isTeam ? memberIndexOf(Math.min(shots.length, max - 1), members) : -1;

    // 상단 배너
    const statusText = ls.running ? (ls.phase === 'ready' ? '준비 중 · 카운트다운' : '사격 중') : '경기 완료';
    if (isTeam) {
      const m = members[curIdx] || {};
      let before = 0; for (let i = 0; i < curIdx; i++) before += Number(members[i].shots) || 0;
      const doneInMember = Math.max(0, shots.length - before);
      const finished = shots.length >= max;
      $('banSub').textContent = `${ls.cls ? ls.cls + '반 ' : ''}${ls.teamName || ''} · ${ls.label || typeLabel} · ${statusText}`;
      $('banWho').textContent = finished ? '팀 경기 완료' : `현재 사수 ${nameOf(m.id)}`;
      $('banCnt').textContent = finished ? `${shots.length} / ${max}발` : `${doneInMember} / ${m.shots}발`;
      $('banNext').textContent = finished ? '' : (members[curIdx + 1] ? `다음: ${nameOf(members[curIdx + 1].id)}` : '마지막 사수');
    } else {
      $('banSub').textContent = `${ls.label || typeLabel} · 개인전 · ${statusText}`;
      $('banWho').textContent = ls.studentId ? labelOfStudent(ls.studentId) : TYPE_LABEL.check;
      $('banCnt').textContent = `${shots.length} / ${max}발`;
      $('banNext').textContent = '';
    }

    // 과녁: 단체전은 지금 사수의 탄착만 밝게, 앞 사람들은 회색. 가장 최근 발은 노란 테두리.
    drawTarget($('cvLive'), shots, (s, i) => {
      const latest = i === shots.length - 1;
      let fill = Number(s.s) ? '#b7ff3c' : '#ff4d66';
      if (isTeam && ls.running && shots.length < max && memberIndexOf(i, members) !== curIdx) fill = '#7d8b99';
      return { fill, ring: latest ? '#ffc940' : '', label: true };
    });

    // 점수판
    $('totLabel').textContent = isTeam ? '팀 총점' : '총점';
    $('mTotal').textContent = total; $('mCnt').textContent = shots.length; $('mMax').textContent = max;
    $('mAvg').textContent = shots.length ? (total / shots.length).toFixed(1) : '0.0';

    // 오른쪽: 발별 점수 (점수 영역의 최대 높이 - 개인전 2줄, 단체전은 팀원 수만큼)
    $('scoreArea').style.setProperty('--score-max', isTeam ? (members.length * 54 + (members.length - 1) * 6) + 'px' : '190px');
    const slotCls = (s, isNow) => s ? (Number(s.s) ? 'hit' : 'miss') : (isNow ? 'now' : '');
    if (isTeam) {
      $('scoreTitle').textContent = '팀원별 점수';
      let cursor = 0;
      $('scoreArea').innerHTML = members.map((m, mi) => {
        const n = Number(m.shots) || 0;
        const own = shots.slice(cursor, cursor + n);
        const sub = own.reduce((a, s) => a + (Number(s.s) || 0), 0);
        let cells = '';
        for (let k = 0; k < n; k++) {
          const s = own[k];
          cells += `<div class="ms-slot ${slotCls(s, cursor + k === shots.length && ls.running)}">${s ? esc(s.s) : '-'}</div>`;
        }
        cursor += n;
        const cur = mi === curIdx && ls.running && shots.length < max;
        const state = own.length >= n ? `${sub}점` : (cur ? '사격 중' : (own.length ? `${sub}점…` : '대기'));
        return `<div class="member-box${cur ? ' cur' : ''}"><div class="mh"><span class="mn">${mi + 1}. ${esc(nameOf(m.id))} · ${n}발</span><span class="ms">${state}</span></div><div class="mslots">${cells}</div></div>`;
      }).join('');
    } else {
      $('scoreTitle').textContent = '획득 점수';
      let cells = '';
      for (let i = 0; i < max; i++) {
        const s = shots[i];
        cells += `<div class="lslot ${slotCls(s, i === shots.length && ls.running)}"><span class="n">${i + 1}발</span><span class="v">${s ? esc(s.s) : '–'}</span></div>`;
      }
      $('scoreArea').innerHTML = `<div class="live-slots">${cells}</div>`;
    }

    // 수동 입력·취소 가능 여부
    const canManual = !!(ls.running && ls.online && shots.length < max);
    document.querySelectorAll('#keys button').forEach(b => { b.disabled = !canManual; });
    $('btnUndo').disabled = !(ls.online && shots.length);

    // 저장 상태 (경기 완료 후)
    const sv = ls.save || null;
    const box = $('saveBox');
    if (!ls.running && sv && sv.status) {
      box.hidden = false;
      box.className = 'savebox ' + (sv.status === 'ok' ? 'ok' : sv.status === 'fail' ? 'fail' : sv.status === 'saving' ? 'saving' : '');
      box.textContent = sv.status === 'ok' ? '✅ ' + sv.msg : sv.status === 'fail' ? '⚠️ 저장 실패 · ' + sv.msg : sv.status === 'saving' ? '⏳ ' + sv.msg : sv.msg;
    } else { box.hidden = true; box.textContent = ''; box.className = 'savebox'; }
    // 사격 중: [마지막 발 취소][다시 시작][경기 중단] / 경기 끝: [마지막 발 취소](+저장 실패 시 [저장 다시 시도]) 그리고 맨 아래 [바로 다음 경기][처음 화면으로]
    const showRetry = !ls.running && sv && sv.status === 'fail' && ls.online;
    $('btnRestart').hidden = !ls.running;
    $('btnAbort').hidden = !ls.running;
    $('btnRestart').disabled = $('btnAbort').disabled = !ls.online;
    $('btnRetrySave').hidden = !showRetry;
    $('runActions').dataset.n = ls.running ? '3' : (showRetry ? '2' : '1');
    $('doneActions').hidden = !!ls.running;
    $('doneActions').dataset.n = '2';
    $('btnNextMatch').disabled = !ls.online || (sv && sv.status === 'saving');
    $('manualArea').hidden = !ls.running;   // 경기가 끝나면 수동 입력 자리에 저장 상태와 다음 경기 버튼을 보여 준다
  }

  /* ---------- 전체 그리기 ---------- */
  function renderPills() {
    const ls = S.laneState;
    const pp = $('phonePill');
    if (!S.fbReady) { pp.textContent = '사대 폰 확인 중…'; pp.className = 'pill'; }
    else if (!ls || !ls.online) { pp.textContent = `${S.lane}사로 사대 폰 연결 안 됨`; pp.className = 'pill bad'; }
    else if (ls.running) { pp.textContent = `${S.lane}사로 사격 중`; pp.className = 'pill ok'; }
    else { pp.textContent = `${S.lane}사로 사대 폰 대기 중`; pp.className = 'pill ok'; }
  }
  function render() {
    renderPills();
    const live = inMatchView();
    $('setupView').hidden = live; $('liveView').hidden = !live;
    document.body.classList.toggle('live-mode', live);
    document.body.classList.toggle('setup-mode', !live);
    if (live) renderLive(); else renderSummary();
  }

  /* ---------- 이벤트 연결 ---------- */
  $('segType').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (S.type === b.dataset.v) return;
    S.type = b.dataset.v;
    try { localStorage.setItem('lm_type', S.type); } catch (e2) {}
    renderSeg(); renderStudentOptions(); renderHistory(); renderSummary();
  });
  $('segMode').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (S.mode === b.dataset.v) return;
    S.mode = b.dataset.v;
    renderSeg(); loadHistory();
  });
  $('selLane').addEventListener('change', e => {
    S.lane = Number(e.target.value) || 1;
    try { localStorage.setItem('lm_lane', String(S.lane)); } catch (e2) {}
    S.dismissedMatch = ''; lastSaveStatus = '';
    $('setupMsg').textContent = ''; $('liveMsg').textContent = '';
    renderLaneOptions(); subscribeLane(); registerViewer(); render();
  });
  $('selClass').addEventListener('change', e => {
    S.cls = e.target.value; S.studentId = ''; S.teamIdx = ''; S.order = []; S.drafts = [];
    renderStudentOptions(); renderTeamOptions(); renderOrder(); loadHistory();
    if (S.cls) {
      $('selTeam').innerHTML = '<option value="">불러오는 중…</option>';
      const cls = S.cls;
      jsonp('drafts', { cls }).then(res => {
        if (cls !== S.cls) return;
        S.drafts = (res && res.teams) || [];
        renderTeamOptions();
      }).catch(err => { if (cls === S.cls) $('selTeam').innerHTML = `<option value="">불러오기 실패: ${esc(err.message)}</option>`; });
    }
  });
  $('selStudent').addEventListener('change', e => { S.studentId = e.target.value; loadHistory(); });
  $('selTeam').addEventListener('change', e => {
    S.teamIdx = e.target.value === '' ? '' : Number(e.target.value);
    const team = S.drafts[S.teamIdx];
    S.order = team ? (team.members || []).map(m => ({ id: String(m.studentId), name: m.name || nameOf(m.studentId), absent: false })) : [];
    renderOrder(); loadHistory();
  });
  $('orderList').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const i = Number(b.dataset.i);
    if (b.dataset.act === 'up' && i > 0) [S.order[i - 1], S.order[i]] = [S.order[i], S.order[i - 1]];
    else if (b.dataset.act === 'down' && i < S.order.length - 1) [S.order[i + 1], S.order[i]] = [S.order[i], S.order[i + 1]];
    else if (b.dataset.act === 'abs') S.order[i].absent = !S.order[i].absent;
    renderOrder(); renderSummary();
  });
  $('btnStart').addEventListener('click', sendStart);
  $('btnAbort').addEventListener('click', abortMatch);
  $('btnRestart').addEventListener('click', restartMatch);
  $('btnNextMatch').addEventListener('click', nextMatch);
  $('btnUndo').addEventListener('click', () => sendEvent({ type: 'undo' }, $('liveMsg')));
  $('btnRetrySave').addEventListener('click', () => sendEvent({ type: 'retrySave' }, $('liveMsg')));
  $('btnHome').addEventListener('click', () => { S.dismissedMatch = (S.laneState && S.laneState.matchId) || ''; $('setupMsg').textContent = ''; $('liveMsg').textContent = ''; render(); });
  // 수동 점수 버튼(10~0): 확인 창 없이 바로 보낸다 - 잘못 눌렀으면 '마지막 발 취소' 후 다시 입력.
  $('keys').innerHTML = Array.from({ length: 11 }, (_, i) => 10 - i).map(v => `<button type="button" data-v="${v}" class="${v === 0 ? 'zero' : ''}">${v}</button>`).join('');
  $('keys').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || b.disabled) return;
    sendEvent({ type: 'manual', score: Number(b.dataset.v) }, $('liveMsg'));
  });

  /* ---------- 시작 ---------- */
  function init() {
    try {
      const savedLane = Number(localStorage.getItem('lm_lane'));
      if (savedLane >= 1 && savedLane <= LANE_COUNT) S.lane = savedLane;
      const savedType = localStorage.getItem('lm_type');
      if (savedType && TYPE_LABEL[savedType]) S.type = savedType;
    } catch (e) {}
    renderLaneOptions(); renderSeg(); renderOrder(); render();

    jsonp('roster').then(res => {
      if (!res || !res.ok) throw new Error((res && (res.error || res.message)) || '학생명단 없음');
      S.classes = res.classes || []; S.students = res.students || [];
      S.byId = {}; S.students.forEach(s => { S.byId[s.id] = s; });
      renderClassOptions(); renderStudentOptions(); render();
    }).catch(err => {
      $('selClass').innerHTML = `<option value="">학생명단 불러오기 실패</option>`;
      $('setupMsg').textContent = '⚠️ ' + err.message;
    });

    if (!FIREBASE_CONFIG) { $('connPill').textContent = 'config.js 설정 파일을 찾을 수 없어요'; $('connPill').className = 'pill bad'; return; }
    if (!window.firebase || !firebase.initializeApp) { $('connPill').textContent = '실시간 연결 실패(인터넷 확인)'; $('connPill').className = 'pill bad'; return; }
    try {
      firebase.initializeApp(FIREBASE_CONFIG);
      S.db = firebase.database();
      S.db.ref('.info/serverTimeOffset').on('value', s => { S.offset = Number(s.val()) || 0; });
      S.db.ref('.info/connected').on('value', s => {
        const on = s.val() === true;
        if (on && S.fbReady) registerViewer();   // 재연결되면 다시 등록
        $('connPill').textContent = on ? '실시간 연결됨' : '실시간 연결 끊김 · 재연결 중';
        $('connPill').className = 'pill ' + (on ? 'ok' : 'bad');
      });
      firebase.auth().signInAnonymously().then(() => {
        S.fbReady = true; subscribeLane(); registerViewer(); render();
      }).catch(err => { $('connPill').textContent = '실시간 로그인 실패: ' + err.message; $('connPill').className = 'pill bad'; });
    } catch (err) { $('connPill').textContent = '실시간 준비 오류: ' + err.message; $('connPill').className = 'pill bad'; }
  }
  init();
})();
</script>
</body>
</html>
