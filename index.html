    .shots{grid-area:shots;padding:14px;margin-bottom:12px}.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.section-title h2{font-size:.95rem;margin:0}.shot-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}.shot{aspect-ratio:1;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;font-size:.72rem;color:var(--muted);background:#091426}.shot.hit{color:#07111f;background:var(--lime);border-color:var(--lime);font-weight:900}.shot.miss{background:var(--red);border-color:var(--red);color:white}.shot.obj{box-shadow:inset 0 0 0 2px var(--gold)}.hint{font-size:.76rem;line-height:1.6;color:var(--muted);margin-top:12px}.toggle{display:flex;gap:6px}.toggle button{min-height:38px;padding:7px 9px;border-radius:9px;border:1px solid var(--line);background:#091426;color:var(--muted);font-size:.7rem}.toggle button.active{border-color:var(--cyan);color:var(--cyan)}

    @media(orientation:landscape) and (max-height:700px){:root{font-size:16px}html,body{height:100%;overflow:hidden}.app{display:grid;width:100%;height:100svh;min-height:0;max-width:none;overflow:hidden;grid-template-columns:minmax(0,1.72fr) minmax(300px,.78fr);grid-template-rows:minmax(0,1fr);grid-template-areas:"camera side";gap:0;padding:0}.camera{height:100%;min-height:0;position:relative;top:auto;border-radius:0}.side-panel{grid-area:side;display:block;min-height:0;height:100%;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:0 0 18px;scrollbar-gutter:stable}.setup{margin:0;padding:10px}.setup .grid{grid-template-columns:1fr 1fr;gap:7px}.field label{font-size:.66rem;margin-bottom:3px}.field input,.field select{min-height:40px;padding:6px 9px;font-size:.82rem}.controls{margin:0;padding:7px;gap:6px}.btn{min-height:43px;padding:6px;font-size:.78rem}.scoreboard{margin:0}.metric{padding:9px 3px}.metric strong{font-size:1.2rem}.metric:first-child strong{font-size:1.75rem}.shots{margin:0;padding:9px}.section-title{margin-bottom:6px}.shot-grid{grid-template-columns:repeat(10,1fr);gap:3px}.shot{font-size:.6rem}.hint{display:block;font-size:.65rem;line-height:1.35;margin-top:7px}.footer-controls{margin-bottom:10px}.zoom-controls{top:50px;grid-template-columns:40px 52px 40px}.zoom-controls button{width:40px;height:40px}.guide{font-size:.67rem;bottom:8px}}

    /* LaserHIT 경기 화면에서 영감을 받은 고대비 사격장 UI */
    :root{--bg:#050505;--panel:#151515;--line:#383838;--text:#fff;--muted:#b8b8b8;--cyan:#21dc63;--lime:#20e66d;--red:#d51b24;--gold:#ffd441}
    html,body{background:#050505}
    .camera{background:#000;border-color:#343434;box-shadow:inset 0 0 0 1px #000}
    .camera-msg{background:radial-gradient(circle,#242424,#050505)}
    .panel,.setup{background:#171717;border-color:#383838;box-shadow:none}
    .mini-brand{padding:4px 2px 8px;border-bottom:3px solid #20d95d}
    .brand-mark{border-color:#20d95d;box-shadow:0 0 16px #20d95d55}.brand-mark:before{border-color:#e3272f;box-shadow:inset 0 0 0 4px #111}
    .status{color:#23e466}.dot{box-shadow:0 0 9px currentColor}
    .field input,.field select{background:#0b0b0b;border-color:#4b4b4b;border-radius:4px}.field input:focus,.field select:focus{border-color:#20df62}
    .fullscreen-btn{background:#222;border-color:#555;border-radius:4px}
    .btn{border-radius:3px;background:#20db5e;color:#041408;text-transform:none;box-shadow:inset 0 -2px 0 #0b8d36}

    #learnBtn{background:#383018;color:#ffe05a;border-color:#806e25}

    .scoreboard{background:#760b10;border:1px solid #ee3740;border-radius:0;gap:1px}

<body>
<main class="app">
  <section class="camera" id="cameraBox">
    <video id="video" playsinline muted></video>
    <canvas id="overlay" class="overlay"></canvas>
    <div class="camera-msg" id="cameraMsg"><b>카메라를 시작하세요</b><span>표적지가 화면 중앙에 오도록<br>휴대폰을 단단히 고정합니다.</span></div>
    <div class="hud"><span class="pill live" id="livePill">● OFF</span><span class="pill" id="fpsPill">레이저 감도 98</span></div>
    <div class="zoom-controls" aria-label="카메라 확대 축소">
      <button id="zoomOut" type="button" disabled aria-label="축소">−</button>
      <span id="zoomValue">1.0×</span>
      <button id="zoomIn" type="button" disabled aria-label="확대">＋</button>
    </div>
    <div class="guide" id="guide">① 카메라 → ② 표적 보정 → ③ 레이저 3발 학습 → ④ 경기</div>
    <div class="match-countdown" id="matchCountdown" hidden>5</div>
    <div class="pill" id="clrPill" style="position:absolute;left:9px;bottom:9px;font-size:.66rem;opacity:.9">–</div>
    <div class="pill" id="liveStatus" style="position:absolute;left:9px;bottom:34px;font-size:.66rem;opacity:.9">📡 관전 연결 안 됨</div>
    <div class="flash" id="flash"><div class="score-pop" id="scorePop">10</div></div>
  </section>

  <div class="side-panel" id="sidePanel">

  <section class="panel setup">
    <div class="mini-brand">
      <div class="brand"><div class="brand-mark"></div><h1>LASER MATCH</h1></div>
      <div class="status" id="status"><i class="dot"></i><span>준비</span></div>
      <button class="fullscreen-btn" id="fullscreenBtn" type="button" aria-label="전체화면 켜기">⛶</button>
    </div>
    <div class="grid">
      <div class="field"><label>사로 지정</label><select id="firingLane"><option value="1">1사로</option><option value="2">2사로</option><option value="3">3사로</option><option value="4">4사로</option><option value="5">5사로</option><option value="6">6사로</option><option value="7">7사로</option><option value="8">8사로</option></select></div>
    </div>
    <p class="hint" id="calibrationInfo">표적 보정 전입니다. 표적 전체가 화면에 보이도록 휴대폰을 정면으로 고정하세요.</p>
    <div class="field" style="display:none">
      <input id="eventName" value="교내 레이저 사격대회" maxlength="80">
      <input id="player" placeholder="선수 이름" maxlength="40">
      <select id="laserColor"><option value="red">빨간색</option><option value="green">초록색</option></select>
      <select id="detectKind"><option value="laser" selected>레이저만 (권장)</option><option value="both">레이저 + 물체·자국</option><option value="object">물체·자국만</option></select>
      <select id="maxShots"><option>5</option><option selected>10</option><option>20</option></select>
    </div>
  </section>

  <div class="controls match-controls">
    <button class="btn" id="cameraBtn">카메라 시작</button>
    <button class="btn secondary" id="calibrateBtn" disabled>표적 자동 보정</button>
    <button class="btn secondary wide" id="learnBtn" disabled>레이저 3발 학습</button>
    <button class="btn wide" id="matchBtn" disabled>경기 시작</button>
  </div>

  <section class="panel scoreboard">
    <div class="metric"><small>총점</small><strong id="totalScore">0</strong></div>
    <div class="metric"><small>발수</small><strong><span id="shotCount">0</span>/<span id="shotMax">10</span></strong></div>
    <div class="metric"><small>평균</small><strong id="average">0.0</strong></div>
  </section>

  <div style="display:none">
    <button id="manualBtn">수동 명중 입력</button>
    <button id="undoBtn">마지막 발 취소</button>
    <div class="shot-grid" id="shotGrid"></div>
    <button id="sensitivityDown">감도−</button>
    <button id="sensitivityUp">감도＋</button>
    <button id="leaderBtn">순위표</button>
    <button id="resetBtn">새 경기</button>
  </div>
  </div>
</main>

<dialog id="leaderDialog"><div class="modal"><h3>🏆 경기 순위표</h3><div id="leaderList" class="empty">기록을 불러오는 중입니다.</div><div class="footer-actions"><button class="btn secondary" onclick="leaderDialog.close()">닫기</button></div></div></dialog>
<dialog id="manualDialog"><div class="modal"><h3>수동 점수 입력</h3><div class="field"><label>심판 판정 점수</label><select id="manualScore"><option value="10">10점</option><option value="9">9점</option><option value="8">8점</option><option value="7">7점</option><option value="6">6점</option><option value="5">5점</option><option value="4">4점</option><option value="3">3점</option><option value="2">2점</option><option value="1">1점</option><option value="0">0점 / 표적 밖</option></select></div><div class="footer-actions"><button class="btn secondary" onclick="manualDialog.close()">취소</button><button class="btn" id="manualConfirm">기록</button></div></div></dialog>
<div class="toast" id="toast"></div>
<canvas id="work" hidden></canvas>

<script>
(() => {
  'use strict';
  // Apps Script를 웹 앱으로 배포한 뒤 아래 따옴표 안에 /exec 주소를 넣으세요.
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyZrVEhkDw7Q4DEjA_uKP-eJrINC7mJ5LrwkP8QOBQV1gBRqGFD-ScU7r6ipQ-QyjEz9Q/exec';
  const $ = id => document.getElementById(id);
  const els = Object.fromEntries(['video','overlay','work','cameraMsg','cameraBtn','calibrateBtn','learnBtn','matchBtn','manualBtn','undoBtn','guide','matchCountdown','livePill','fpsPill','zoomOut','zoomIn','zoomValue','flash','scorePop','clrPill','liveStatus','eventName','player','firingLane','laserColor','detectKind','maxShots','totalScore','shotCount','shotMax','average','shotGrid','calibrationInfo','leaderBtn','leaderDialog','leaderList','manualDialog','manualScore','manualConfirm','resetBtn','sensitivityDown','sensitivityUp','toast','status','fullscreenBtn'].map(id => [id,$(id)]));
  const ctx = els.overlay.getContext('2d');
  const wctx = els.work.getContext('2d',{willReadFrequently:true});
  const state = {stream:null,videoTrack:null,running:false,laserLearning:false,learningArmed:false,learningCaptureUntil:0,learningCaptureBest:null,laserSamples:[],laserProfile:null,learningBest:null,learningNextAllowed:0,calibrationMode:0,center:null,radius:0,radiusX:0,radiusY:0,targetAngle:0,targetVideo:null,shots:[],maxShots:10,matchId:null,matchArmAt:0,countdownTimer:0,lastHit:0,candidate:null,candidateFrames:0,spotLatched:false,missingFrames:0,sensitivity:98,raf:0,frameLoopToken:0,processing:false,background:null,backgroundR:null,backgroundG:null,backgroundB:null,prevLum:null,pendingLaser:null,haloCandidate:null,laserBlocked:false,releaseFrames:0,stableFrames:0,warmupFrames:0,detectorReady:false,autoCalibrating:false,zoom:1,zoomMin:1,zoomMax:1,zoomStep:.1,actualFps:0,detectKind:'laser',objRef:null,objTracks:[],objKnown:[],objBusy:false,objBusySince:0,objMask:null,objDil:null,objTmp:null,objSeen:null,objStack:null,dbgTick:0,workSH:null,paperMultiple:null};

  function toast(msg){els.toast.textContent=msg;els.toast.classList.add('show');setTimeout(()=>els.toast.classList.remove('show'),2200)}
  function setStatus(text,color='var(--cyan)'){els.status.querySelector('span').textContent=text;els.status.style.color=color}
  function uid(){return 'M-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7)}
  function clearDetectorBackground(){state.background=null;state.backgroundR=null;state.backgroundG=null;state.backgroundB=null;state.prevLum=null;state.pendingLaser=null;state.haloCandidate=null;state.pulseV2=null;state.laserBlocked=false;state.releaseFrames=0;state.stableFrames=0;state.objRef=null;state.objTracks=[];state.objKnown=[];state.objBusy=false;state.objBusySince=0;state.workSH=null}
  function blendBackground(data,lum,sw,x0,x1,y0,y1,alpha){if(!state.backgroundR)return;for(let y=y0;y<=y1;y++){const row=y*sw;for(let x=x0;x<=x1;x++){const p=row+x,i=p*4;state.background[p]=state.background[p]*(1-alpha)+lum[p]*alpha;state.backgroundR[p]=state.backgroundR[p]*(1-alpha)+data[i]*alpha;state.backgroundG[p]=state.backgroundG[p]*(1-alpha)+data[i+1]*alpha;state.backgroundB[p]=state.backgroundB[p]*(1-alpha)+data[i+2]*alpha}}}
  function resize(){const r=els.overlay.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);els.overlay.width=Math.round(r.width*d);els.overlay.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0);restoreTargetFromVideo();drawOverlay()}

  async function startCamera(){
    try{
      if(state.stream) state.stream.getTracks().forEach(t=>t.stop());
      // 카메라를 다시 시작하면 예전 보정값을 확실히 비운다 - 그래야 매번 새로 보정해야 하고,
      // 낡은(어쩌면 지금 화면과 안 맞는) 보정 상태 때문에 미리 와있던 원격 명령이 갑자기 실행되는 일이 없다.
      state.center=null;state.radius=state.radiusX=state.radiusY=0;state.targetVideo=null;state.paperMultiple=null;state.running=false;lastCmdId=null;lastNotifiedCmdId=null;
      clearInterval(state.countdownTimer);state.countdownTimer=0;state.matchArmAt=0;els.matchCountdown.hidden=true;
      document.body.classList.remove('match-live');
      els.learnBtn.disabled=true;els.matchBtn.disabled=true;els.matchBtn.textContent='경기 시작';
      try{state.stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280,min:640},height:{ideal:720,min:480},frameRate:{ideal:60,min:30,max:60}}})}
      catch(fastError){console.warn('60fps unavailable, retrying at standard speed',fastError);state.stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30}}})}
      els.video.srcObject=state.stream;await els.video.play();state.videoTrack=state.stream.getVideoTracks()[0];await setupCameraZoom();els.cameraMsg.style.display='none';
      els.cameraBtn.textContent='카메라 다시 시작';els.calibrateBtn.disabled=false;els.livePill.textContent='● CAMERA';setStatus('카메라 연결');els.guide.textContent='표적을 화면 중앙에 맞추면 자동으로 인식합니다.';resize();processFrames();ensureRemotePolling();setTimeout(()=>{if(state.stream&&!state.center&&!state.running)beginCalibration()},900);
    }catch(e){console.error(e);toast('카메라 권한을 허용해 주세요.');els.guide.textContent='브라우저 설정에서 카메라 권한을 허용한 뒤 다시 시도하세요.'}
  }

  async function setupCameraZoom(){
    const track=state.videoTrack;if(!track)return;
    let caps={},settings={};try{caps=track.getCapabilities?track.getCapabilities():{};settings=track.getSettings?track.getSettings():{};state.actualFps=Number(settings.frameRate)||0}catch(e){console.warn(e)}
    const advanced=[];if(Array.isArray(caps.focusMode)&&caps.focusMode.includes('continuous'))advanced.push({focusMode:'continuous'});if(Array.isArray(caps.exposureMode)&&caps.exposureMode.includes('continuous'))advanced.push({exposureMode:'continuous'});if(caps.exposureCompensation&&Number.isFinite(caps.exposureCompensation.min)&&Number.isFinite(caps.exposureCompensation.max)){
      // 레이저히트 앱과 실제 촬영본을 비교해보니, 노출을 살짝만 낮추는 정도로는 부족했다(표적 검정부 밝기가 약 2배 차이).
      // 지원 범위의 어두운 쪽(최소값에서 15%만 올라온 지점)까지 적극적으로 낮춰서, 레이저가 하얗게 포화되기 전 여유를 더 확보한다.
      const min=caps.exposureCompensation.min,max=caps.exposureCompensation.max;
      const exposure=Math.max(min,Math.min(max,min+(max-min)*.15));
      advanced.push({exposureCompensation:exposure});
    }if(advanced.length){try{await track.applyConstraints({advanced})}catch(e){console.warn('camera tuning skipped',e)}}if(caps.frameRate&&Number.isFinite(caps.frameRate.max)){try{await track.applyConstraints({frameRate:{ideal:Math.min(60,caps.frameRate.max),min:Math.min(30,caps.frameRate.max)}})}catch(e){console.warn('high fps skipped',e)}settings=track.getSettings?track.getSettings():settings;state.actualFps=Number(settings.frameRate)||state.actualFps}
    if(caps.zoom&&Number.isFinite(caps.zoom.min)&&Number.isFinite(caps.zoom.max)&&caps.zoom.max>caps.zoom.min){
      state.zoomMin=Number(caps.zoom.min);state.zoomMax=Number(caps.zoom.max);state.zoomStep=Math.max(.1,Number(caps.zoom.step)||.1);state.zoom=Math.min(state.zoomMax,Math.max(state.zoomMin,Number(settings.zoom)||state.zoomMin));els.zoomOut.disabled=false;els.zoomIn.disabled=false;updateZoomUI();
    }else{state.zoom=1;state.zoomMin=1;state.zoomMax=1;els.zoomOut.disabled=true;els.zoomIn.disabled=true;els.zoomValue.textContent='미지원'}
    showDetectorInfo();
  }

  function updateZoomUI(){els.zoomValue.textContent=state.zoom.toFixed(1)+'×';els.zoomOut.disabled=state.zoom<=state.zoomMin+.001;els.zoomIn.disabled=state.zoom>=state.zoomMax-.001}

  async function changeZoom(direction){
    if(!state.videoTrack||state.zoomMax<=state.zoomMin){toast('이 브라우저에서는 카메라 줌을 지원하지 않습니다.');return}
    const next=Math.min(state.zoomMax,Math.max(state.zoomMin,state.zoom+direction*state.zoomStep));if(Math.abs(next-state.zoom)<.001)return;
    try{await state.videoTrack.applyConstraints({advanced:[{zoom:next}]});state.zoom=next;updateZoomUI();state.center=null;state.radius=state.radiusX=state.radiusY=0;state.targetVideo=null;clearDetectorBackground();els.matchBtn.disabled=true;drawOverlay();els.guide.textContent='배율이 변경되었습니다 · 표적을 다시 자동 보정합니다.';setTimeout(()=>beginCalibration(),450)}catch(e){console.error(e);toast('카메라 배율을 변경하지 못했습니다.')}
  }

  async function beginCalibration(){
    if(!state.stream||els.video.readyState<2||state.autoCalibrating)return;state.autoCalibrating=true;
    state.running=false;state.laserLearning=false;state.laserProfile=null;state.laserSamples=[];state.center=null;state.radius=state.radiusX=state.radiusY=0;state.targetAngle=0;state.targetVideo=null;state.paperMultiple=null;state.shots=[];state.calibrationMode=0;clearDetectorBackground();updateScore();drawOverlay();
    els.calibrateBtn.disabled=true;els.matchBtn.disabled=true;els.guide.textContent='표적의 동심원과 중심을 분석하고 있습니다…';setStatus('자동 보정 중','#ffc940');
    // 카메라 초점·노출이 막 켜진 직후엔 아직 안 안정된 경우가 많아, 한 번에 실패로 끝내지 않고
    // 짧은 간격을 두고 몇 번 더 시도해서 그사이 안정된 화면으로 다시 인식을 시도한다.
    let target=null;
    for(let attempt=0;attempt<4&&!target;attempt++){
      await new Promise(resolve=>setTimeout(resolve,attempt===0?350:450));
      target=detectTarget();
    }
    els.calibrateBtn.disabled=false;state.autoCalibrating=false;
    if(target){
      state.center={x:target.x,y:target.y};state.radiusX=target.radiusX;state.radiusY=target.radiusY;state.radius=Math.max(target.radiusX,target.radiusY);state.targetAngle=target.angle;state.calibrationMode=0;state.calibratedAt=performance.now();saveTargetToVideo();
      els.guide.textContent='표적 자동 보정 완료 · 라이브 페이지에서 경기 시작을 누르세요.';
      els.calibrationInfo.textContent=`자동 보정 완료: 카메라 표적 형태 ${Math.round(target.radiusX)}×${Math.round(target.radiusY)}px · 기울기 ${Math.round(target.angle*180/Math.PI)}°`;
      els.learnBtn.disabled=false;els.learnBtn.textContent='레이저 3발 학습';els.matchBtn.disabled=true;els.matchBtn.textContent='레이저 학습 후 경기 시작';setStatus('레이저 학습 대기','#ffc940');drawOverlay();toast('표적을 인식했습니다. 레이저 3발을 먼저 학습해 주세요.');
    }else{
      els.guide.textContent='표적 자동 인식 실패 · 표적 자동 보정을 다시 눌러 주세요.';
      els.calibrationInfo.textContent='표적을 화면 중앙에 더 크게, 정면으로 맞춘 뒤 표적 자동 보정을 다시 눌러 보세요.';
      setStatus('인식 실패','#ff4d66');toast('표적을 더 크게, 정면으로 맞춘 뒤 표적 자동 보정을 다시 눌러 주세요.');
    }
  }

  function videoGeometry(){
    const vw=els.video.videoWidth,vh=els.video.videoHeight,box=els.overlay.getBoundingClientRect();
    const scale=Math.max(box.width/vw,box.height/vh);   // cover: 화면을 꽉 채우고(잘림 있음), contain이면 Math.min
    return{vw,vh,box,scale,offX:(box.width-vw*scale)/2,offY:(box.height-vh*scale)/2};
  }

  function videoToScreen(vx,vy){const g=videoGeometry();return{x:g.offX+vx*g.scale,y:g.offY+vy*g.scale,scale:g.scale}}

  function saveTargetToVideo(){if(!state.center||!state.radius||!els.video.videoWidth)return;const g=videoGeometry(),vx=(state.center.x-g.offX)/g.scale,vy=(state.center.y-g.offY)/g.scale;state.targetVideo={x:vx/g.vw,y:vy/g.vh,rx:state.radiusX/g.scale/g.vw,ry:state.radiusY/g.scale/g.vw,a:state.targetAngle,pm:state.paperMultiple||null}}

  function restoreTargetFromVideo(){if(!state.targetVideo||!els.video.videoWidth)return;const g=videoGeometry(),mapped=videoToScreen(state.targetVideo.x*g.vw,state.targetVideo.y*g.vh);state.center={x:mapped.x,y:mapped.y};state.radiusX=(state.targetVideo.rx||state.targetVideo.r)*g.vw*g.scale;state.radiusY=(state.targetVideo.ry||state.targetVideo.r)*g.vw*g.scale;state.radius=Math.max(state.radiusX,state.radiusY);state.targetAngle=state.targetVideo.a||0;state.paperMultiple=state.targetVideo.pm||null}

  function screenTargetToWork(sw,sh){
    const g=videoGeometry();
    return{x:(state.center.x-g.offX)/g.scale/g.vw*sw,y:(state.center.y-g.offY)/g.scale/g.vh*sh,rx:state.radiusX/g.scale/g.vw*sw,ry:state.radiusY/g.scale/g.vw*sw,r:state.radius/g.scale/g.vw*sw,a:state.targetAngle};
  }

  /* 현재 표적의 검은 중앙부를 기준으로 중심을 조금씩 따라간다. 새 표적을 만들어내지 않고,
     최초 동심원 보정값에서 벗어나지 않는 작은 이동만 허용한다. */
  function trackTargetCenter(data,sw,sh,t,roi){
    if(!state.targetVideo)return;
    const x0=Math.max(1,Math.floor(t.x-t.rx*.48)),x1=Math.min(sw-2,Math.ceil(t.x+t.rx*.48)),y0=Math.max(1,Math.floor(t.y-t.ry*.48)),y1=Math.min(sh-2,Math.ceil(t.y+t.ry*.48));
    let mean=0,n=0;for(let y=y0;y<=y1;y+=2)for(let x=x0;x<=x1;x+=2){const dx=(x-t.x)/(t.rx*.48),dy=(y-t.y)/(t.ry*.48);if(dx*dx+dy*dy>1)continue;const i=(y*sw+x)*4;mean+=(data[i]+data[i+1]*2+data[i+2])*.25;n++}if(!n)return;mean/=n;
    const threshold=Math.min(112,mean-18);let sx=0,sy=0,wSum=0,count=0;
    for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const dx=(x-t.x)/(t.rx*.48),dy=(y-t.y)/(t.ry*.48);if(dx*dx+dy*dy>1)continue;const i=(y*sw+x)*4,l=(data[i]+data[i+1]*2+data[i+2])*.25;if(l>=threshold)continue;const w=threshold-l+1;sx+=x*w;sy+=y*w;wSum+=w;count++}
    if(!wSum||count<20)return;const cx=sx/wSum,cy=sy/wSum,dx=cx-t.x,dy=cy-t.y;
    if(Math.hypot(dx/Math.max(1,t.rx),dy/Math.max(1,t.ry))>.10)return;
    const stepX=Math.max(-1,Math.min(1,dx)),stepY=Math.max(-1,Math.min(1,dy));if(Math.hypot(stepX,stepY)<.2)return;
    state.targetVideo.x+=roi?stepX/sw*roi.sWidth/roi.vw:stepX/sw;state.targetVideo.y+=roi?stepY/sh*roi.sHeight/roi.vh:stepY/sh;restoreTargetFromVideo();drawOverlay();
  }

  function detectTarget(){
    const vw=els.video.videoWidth,vh=els.video.videoHeight;if(!vw||!vh)return null;
    const sw=360,sh=Math.max(200,Math.round(sw*vh/vw));els.work.width=sw;els.work.height=sh;wctx.drawImage(els.video,0,0,sw,sh);
    const data=wctx.getImageData(0,0,sw,sh).data,gray=new Uint8Array(sw*sh);let mean=0;
    for(let p=0,i=0;p<gray.length;p++,i+=4){const v=Math.round(data[i]*.299+data[i+1]*.587+data[i+2]*.114);gray[p]=v;mean+=v}mean/=gray.length;

    const thrCandidates=[Math.max(45,Math.min(150,mean-38)),Math.max(35,mean-60),Math.min(175,mean-15),90,120];
    let best=null,mask=null;
    for(const threshold of thrCandidates){
      const m=new Uint8Array(sw*sh),seen=new Uint8Array(sw*sh);
      for(let y=Math.round(sh*.08);y<sh*.92;y++)for(let x=Math.round(sw*.08);x<sw*.92;x++){const p=y*sw+x;if(gray[p]<threshold)m[p]=1}
      const stack=[];
      for(let y=2;y<sh-2;y+=2)for(let x=2;x<sw-2;x+=2){const start=y*sw+x;if(!m[start]||seen[start])continue;stack.length=0;stack.push(start);seen[start]=1;let area=0,sumX=0,sumY=0,minX=x,maxX=x,minY=y,maxY=y;
        while(stack.length&&area<12000){const p=stack.pop(),px=p%sw,py=(p/sw)|0;area++;sumX+=px;sumY+=py;if(px<minX)minX=px;if(px>maxX)maxX=px;if(py<minY)minY=py;if(py>maxY)maxY=py;const n=[p-1,p+1,p-sw,p+sw];for(const q of n){if(q>0&&q<m.length&&m[q]&&!seen[q]){seen[q]=1;stack.push(q)}}}
        const bw=maxX-minX+1,bh=maxY-minY+1,ratio=bw/bh;if(area<25||ratio<.4||ratio>2.5||bw>sw*.58||bh>sh*.72)continue;const cx=sumX/area,cy=sumY/area,dist=Math.hypot(cx-sw/2,cy-sh/2),fill=area/(bw*bh),score=area*(.4+fill)/(1+dist*.025);if(!best||score>best.score){best={cx,cy,bw,bh,fill,score};mask=m}

    }

    const startR=5,maxR=Math.floor(Math.min(sw,sh)*.46),profile=[];
    for(let r=startR;r<=maxR;r++){let sum=0,covered=0;const samples=120;for(let a=0;a<samples;a++){const t=a*Math.PI*2/samples,cs=Math.cos(t),sn=Math.sin(t),x1=Math.round(cx+cs*(r-2)),y1=Math.round(cy+sn*(r-2)),x2=Math.round(cx+cs*(r+2)),y2=Math.round(cy+sn*(r+2));if(x1<1||x1>=sw-1||y1<1||y1>=sh-1||x2<1||x2>=sw-1||y2<1||y2>=sh-1)continue;const d=Math.abs(gray[y2*sw+x2]-gray[y1*sw+x1]);sum+=d;if(d>18)covered++}profile.push({r,score:sum/samples,coverage:covered/samples})}
    const smooth=profile.map((v,i)=>{let score=0,coverage=0,n=0;for(let j=Math.max(0,i-1);j<=Math.min(profile.length-1,i+1);j++){score+=profile[j].score;coverage+=profile[j].coverage;n++}return{r:v.r,score:score/n,coverage:coverage/n}});
    const avg=smooth.reduce((s,v)=>s+v.score,0)/Math.max(1,smooth.length);
    const rawPeaks=smooth.filter((v,i)=>i>1&&i<smooth.length-2&&v.coverage>.07&&v.score>avg*1.03&&v.score>=smooth[i-1].score&&v.score>=smooth[i+1].score).map(v=>({...v,strength:v.score*(.55+v.coverage)}));
    const ringPeaks=[];for(const peak of [...rawPeaks].sort((a,b)=>b.strength-a.strength)){if(ringPeaks.every(p=>Math.abs(p.r-peak.r)>3))ringPeaks.push(peak)}ringPeaks.sort((a,b)=>a.r-b.r);
    let fit=null;const fits=[];
    /* 서로 다른 선만 한 번씩 사용하고, 바깥쪽 원까지 맞는 후보 중 큰 표적을 우선한다. */
    for(let step=4;step<=maxR/10;step+=.25){let strength=0,hits=0,outerHits=0,error=0;const used=new Set(),tolerance=Math.max(2,step*.18);for(let ring=1;ring<=10;ring++){let pick=-1,pickError=Infinity;for(let i=0;i<ringPeaks.length;i++){if(used.has(i))continue;const e=Math.abs(ringPeaks[i].r-step*ring);if(e<=tolerance&&e<pickError){pick=i;pickError=e}}if(pick<0)continue;used.add(pick);hits++;if(ring>=8)outerHits++;error+=pickError/tolerance;strength+=ringPeaks[pick].strength*(ring>=8?1.25:1)}if(hits>=4&&outerHits>=1){const quality=hits*12+outerHits*5+strength/Math.max(1,avg)-error*2;fits.push({step,hits,outerHits,quality})}}
    if(fits.length){const bestQuality=Math.max(...fits.map(v=>v.quality)),bestHits=Math.max(...fits.filter(v=>v.quality>=bestQuality*.82).map(v=>v.hits));fit=fits.filter(v=>v.quality>=bestQuality*.82&&v.hits>=bestHits-1).sort((a,b)=>b.step-a.step)[0]}
    let outerR=fit?fit.step*10:0,rings=fit?fit.hits:0;
    if(!fit){const peaks=smooth.filter((v,i)=>i>1&&i<smooth.length-2&&v.coverage>.08&&v.score>avg*1.12&&v.score>=smooth[i-1].score&&v.score>=smooth[i+1].score);if(peaks.length<3)return null;const outer=peaks.sort((a,b)=>b.r-a.r)[0];outerR=outer.r;rings=peaks.length}
    /* 실제 표적 사진(25M PRECISION 표적)에서 직접 측정: 바깥 반지름은 검은 중심부 지름의 약 1.06배였다.
       (예전 추정치는 이보다 약 18% 크게 잡고 있어서 바로잡음) 여러 개의 링을 하나하나 맞추는 것보다, 뚜렷한
       검은 중심 하나를 찾아 이 비율을 적용하는 쪽이 훨씬 안정적이라, 검은 중심이 뚜렷할 땐 이 값을 우선한다. */
    if(best&&best.fill>.28){const blackAnchor=Math.max(best.bw,best.bh)*1.06;if(blackAnchor>=38&&blackAnchor<=maxR*1.08)outerR=outerR?(best.fill>.4?blackAnchor:Math.max(outerR,blackAnchor)):blackAnchor}
    const edge=new Uint8Array(sw*sh);for(let y=1;y<sh-1;y++)for(let x=1;x<sw-1;x++){const p=y*sw+x;edge[p]=Math.min(255,Math.abs(gray[p+1]-gray[p-1])+Math.abs(gray[p+sw]-gray[p-sw]))}
    let ellipse=null;const majorMin=Math.max(38,outerR*.82),majorMax=Math.min(Math.min(sw,sh)*.49,outerR*1.38);
    for(let major=majorMin;major<=majorMax;major+=3)for(let ratio=.58;ratio<=1.001;ratio+=.06)for(let deg=0;deg<180;deg+=15){const minor=major*ratio,a=deg*Math.PI/180,ca=Math.cos(a),sa=Math.sin(a);let sum=0,covered=0,n=0;for(let ring=4;ring<=10;ring++){const k=ring/10,ringWeight=ring>=8?1.25:1;for(let j=0;j<48;j++){const t=j*Math.PI*2/48,ex=major*k*Math.cos(t),ey=minor*k*Math.sin(t),x=Math.round(cx+ex*ca-ey*sa),y=Math.round(cy+ex*sa+ey*ca);if(x<2||x>=sw-2||y<2||y>=sh-2)continue;const e=edge[y*sw+x];sum+=Math.min(100,e)*ringWeight;if(e>24)covered+=ringWeight;n+=ringWeight}}const coverage=covered/Math.max(1,n),score=sum/Math.max(1,n)+coverage*34+major*.015;if(coverage>.1&&(!ellipse||score>ellipse.score))ellipse={major,minor,a,score,coverage}}
    if(!ellipse)ellipse={major:outerR,minor:outerR,a:0};
    const mapped=videoToScreen(cx/sw*vw,cy/sh*vh),screenRadiusX=ellipse.major/sw*vw*mapped.scale,screenRadiusY=ellipse.minor/sw*vw*mapped.scale;
    if(screenRadiusX<45||screenRadiusX>Math.min(els.overlay.clientWidth,els.overlay.clientHeight)*.55||screenRadiusY<32)return null;
    return{x:mapped.x,y:mapped.y,radius:screenRadiusX,radiusX:screenRadiusX,radiusY:screenRadiusY,angle:ellipse.a,rings:Math.min(10,rings)};
  }

  function canvasPoint(ev){const r=els.overlay.getBoundingClientRect();return{x:ev.clientX-r.left,y:ev.clientY-r.top}}
  function drawOverlay(){
    const width=els.overlay.clientWidth,height=els.overlay.clientHeight;ctx.clearRect(0,0,width,height);
    if(!state.center)return;
    ctx.save();ctx.lineWidth=1.2;

  let lastCmdId=null,lastNotifiedCmdId=null,remotePollOn=false;
  const REMOTE_POLL_MS=900;
  function applyRemoteCmd(cmd){
    if(cmd.cmdId===lastCmdId)return;   // 이미 그 명령으로 경기를 시작한 뒤라면 더 이상 아무것도 안 함
    const myLane=Number(els.firingLane.value);
    if(myLane!==cmd.firingLane){
      // 사로가 다르면 폰의 아무 값도 건드리지 않는다 - 사람이 폰에서 직접 사로를 맞춰야 연결된다.
      if(lastNotifiedCmdId!==cmd.cmdId){lastNotifiedCmdId=cmd.cmdId;toast(`📡 ${cmd.firingLane}사로 시작 명령이 왔어요 - 사로를 ${cmd.firingLane}로 바꾸면 연결돼요.`)}
      return;
    }
    // 사로는 맞아도 아직 표적 보정 전이면, 이 명령은 그냥 소비(무시)하고 끝낸다 - 나중에 보정이 끝나도 자동으로 시작되지 않는다.
    // 보정을 마친 뒤엔 라이브에서 "경기 시작"을 다시 눌러야 한다.
    if(!(state.center&&state.radius)){
      lastCmdId=cmd.cmdId;
      toast(`📡 ${cmd.firingLane}사로 명령을 받았지만 아직 표적 보정 전이에요 - 보정 후 라이브에서 다시 눌러주세요.`);
      return;
    }
    if(state.running)return;   // 이미 사격 중이면 무시
    // 학습탄 저장은 경기 시작 명령이 아니므로, 보정 직후의 경기 시작 안전 대기와 관계없이 즉시 처리한다.
    if(cmd.mode==='confirmLearn'){
      const ok=confirmLaserLearningSample();lastCmdId=cmd.cmdId;if(ok)toast('📡 감지 준비 완료 · 4초 안에 한 발 쏘세요.');return;
    }
    // 보정이 끝난 직후(3초 이내)에는 어떤 명령이 와도 시작하지 않는다 - 보정 결과를 눈으로 확인할 최소한의 시간을 보장해서,
    // "카메라를 켜자마자/보정하자마자 바로 경기가 시작돼버린다"는 상황 자체가 구조적으로 생기지 않게 한다.
    if(state.calibratedAt&&performance.now()-state.calibratedAt<3000){
      lastCmdId=cmd.cmdId;
      toast(`📡 ${cmd.firingLane}사로 명령을 받았지만 방금 보정이 끝나서 안전을 위해 대기 중이에요 - 라이브에서 다시 눌러주세요.`);
      return;
    }
    if(cmd.mode==='learn'){
      if(cmd.laserColor&&cmd.laserColor!==els.laserColor.value){els.laserColor.value=cmd.laserColor;clearDetectorBackground();showDetectorInfo()}
      els.detectKind.value='laser';beginLaserLearning();lastCmdId=cmd.cmdId;toast(`📡 ${cmd.firingLane}사로 · 레이저 3발 학습을 시작합니다.`);return;
    }
    if(!state.laserProfile){lastCmdId=cmd.cmdId;toast('📡 경기 시작 전에 라이브에서 레이저 3발 학습을 먼저 눌러 주세요.');return}
    if(cmd.eventName!=null&&cmd.eventName!=='')els.eventName.value=cmd.eventName;
    if(cmd.player)els.player.value=cmd.player;
    if(cmd.laserColor&&cmd.laserColor!==els.laserColor.value){els.laserColor.value=cmd.laserColor;clearDetectorBackground();showDetectorInfo()}
    if(cmd.detectKind)els.detectKind.value=cmd.detectKind;
    if(cmd.maxShots){els.maxShots.value=String(cmd.maxShots);updateScore()}
    startMatch();lastCmdId=cmd.cmdId;toast(`📡 ${cmd.firingLane}사로 연결됨 - 경기를 시작했어요: `+(cmd.player||''));
  }
  function pollRemoteCmd(){
    if(!isServerConfigured()){setTimeout(pollRemoteCmd,3000);return}
    if(state.running){setTimeout(pollRemoteCmd,REMOTE_POLL_MS);return}
    const cbName='cmdCb_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
    const script=document.createElement('script');
    const timer=setTimeout(()=>{cleanup();setTimeout(pollRemoteCmd,REMOTE_POLL_MS)},6000);
    function cleanup(){clearTimeout(timer);window[cbName]=function(){};script.remove()}
    window[cbName]=cmd=>{
      cleanup();
      if(cmd&&cmd.cmdId)applyRemoteCmd(cmd);
      setTimeout(pollRemoteCmd,REMOTE_POLL_MS);
    };
    script.onerror=()=>{cleanup();setTimeout(pollRemoteCmd,REMOTE_POLL_MS)};
    script.src=`${APPS_SCRIPT_URL}?action=remoteCmd&callback=${cbName}&t=${Date.now()}`;
    document.head.appendChild(script);
  }

  function recordShot(x,y,manualScore=null,kind){
    if(!state.running||state.shots.length>=state.maxShots)return;
    const dx=x==null?0:x-state.center.x,dy=y==null?0:y-state.center.y,ca=Math.cos(state.targetAngle),sa=Math.sin(state.targetAngle),ex=dx*ca+dy*sa,ey=-dx*sa+dy*ca,nr=manualScore==null?Math.hypot(ex/state.radiusX,ey/state.radiusY):0;

    if(state.laserBlocked){state.releaseFrames++;if(state.releaseFrames<2)return;state.laserBlocked=false;state.releaseFrames=0;state.pendingLaser=null}

    const points=[];let strongest=null;const signalThreshold=Math.max(7,30-state.sensitivity*.22);
    for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
      if(!insideScan(x,y))continue;
      const p=y*sw+x,i=p*4,r=data[i],g=data[i+1],b=data[i+2],baseLum=state.background[p],blackSurface=baseLum<125,dr=r-state.backgroundR[p],dg=g-state.backgroundG[p],db=b-state.backgroundB[p],lumRise=lum[p]-baseLum,maxRise=Math.max(dr,dg,db);
      const currentWarm=r-Math.max(g,b),baseWarm=state.backgroundR[p]-Math.max(state.backgroundG[p],state.backgroundB[p]),warmBoost=currentWarm-baseWarm;
      const warmMixed=dr>5&&dr>=dg-8&&dr>=db-8,redHalo=currentWarm>9&&warmBoost>3&&dr>5,whitePink=r>180&&dr>8&&dr>=dg-10&&dr>=db-10;
      const greenMixed=dg>7&&dg>=dr-6&&dg>=db-6;
      const blackRed=blackSurface&&dr>5&&dr>=dg-10&&dr>=db-10;
      const colorMargin=Math.max(1,5-state.sensitivity/25);   // 감도가 높을수록(기본 98) 거의 통과, 감도를 낮출수록 회색 밝기변화를 더 엄격히 거름
      const redDominant=dr>dg+colorMargin&&dr>db+colorMargin,greenDominant=dg>dr+colorMargin&&dg>db+colorMargin;
      const colorMatch=color==='green'?(greenDominant&&greenMixed):(redDominant&&(warmMixed||redHalo||whitePink||blackRed));
      if(!colorMatch||maxRise<(blackSurface?Math.max(6,signalThreshold-1):signalThreshold)||lumRise<(blackSurface?1:2))continue;
      const colorBoost=color==='green'?dg-Math.max(dr,db):Math.max(warmBoost,dr-Math.max(dg,db)),signal=maxRise+Math.max(0,lumRise)*(blackSurface?.8:1.15)+Math.max(0,colorBoost)*.65,point={x,y,wt:signal,delta:signal,bright:Math.max(r,g,b),redRise:dr,colorBoost,lumRise,blackSurface};points.push(point);if(!strongest||signal>strongest.wt)strongest=point;

      if(state.pendingLaser){const pending=state.pendingLaser;state.pendingLaser=null;const colorOrWhite=pending.maxColorBoost>=2||(pending.maxBright>=195&&pending.maxRedRise>=8),confirmed=pending.frames>=2&&pending.frames<=20&&pending.maxSignal>=20&&pending.maxContrast>=6&&colorOrWhite;if(confirmed)tryRecordLaser(pending.x,pending.y,sw,sh,vw,vh)}

    if(points.length>2500){state.pendingLaser=null;state.laserBlocked=true;blendBackground(data,lum,sw,x0,x1,y0,y1,.16);return}
    let sx=0,sy=0,weight=0,localCount=0,clusterColorBoost=strongest.colorBoost,minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;for(const point of points){if(Math.hypot(point.x-strongest.x,point.y-strongest.y)<=9){sx+=point.x*point.wt;sy+=point.y*point.wt;weight+=point.wt;localCount++;clusterColorBoost=Math.max(clusterColorBoost,point.colorBoost);if(point.x<minX)minX=point.x;if(point.x>maxX)maxX=point.x;if(point.y<minY)minY=point.y;if(point.y>maxY)maxY=point.y}}
    const clusterW=maxX-minX+1,clusterH=maxY-minY+1,shape=clusterW/Math.max(1,clusterH);let surround=0,surroundN=0;for(let oy=-10;oy<=10;oy++)for(let ox=-10;ox<=10;ox++){const distance=Math.hypot(ox,oy);if(distance<6||distance>10)continue;const nx=strongest.x+ox,ny=strongest.y+oy;if(nx<0||nx>=sw||ny<0||ny>=sh)continue;surround+=lum[ny*sw+nx];surroundN++}const localContrast=strongest.bright-surround/Math.max(1,surroundN);
    if(localCount>220||shape<.2||shape>5||(localCount<2&&strongest.delta<25)||localContrast<4){state.pendingLaser=null;state.laserBlocked=true;blendBackground(data,lum,sw,x0,x1,y0,y1,.04);return}
    if(state.laserBlocked)return;
    const px=weight?sx/weight:strongest.x,py=weight?sy/weight:strongest.y;
    if(state.pendingLaser&&Math.hypot(px-state.pendingLaser.x,py-state.pendingLaser.y)<12){const n=state.pendingLaser.frames;state.pendingLaser.x=(state.pendingLaser.x*n+px)/(n+1);state.pendingLaser.y=(state.pendingLaser.y*n+py)/(n+1);state.pendingLaser.frames++;state.pendingLaser.maxSignal=Math.max(state.pendingLaser.maxSignal,strongest.delta);state.pendingLaser.maxContrast=Math.max(state.pendingLaser.maxContrast,localContrast);state.pendingLaser.maxColorBoost=Math.max(state.pendingLaser.maxColorBoost,clusterColorBoost);state.pendingLaser.maxBright=Math.max(state.pendingLaser.maxBright,strongest.bright);state.pendingLaser.maxRedRise=Math.max(state.pendingLaser.maxRedRise,strongest.redRise);if(state.pendingLaser.frames>=2&&state.pendingLaser.maxSignal>=20&&state.pendingLaser.maxContrast>=6&&(state.pendingLaser.maxColorBoost>=2||state.pendingLaser.maxRedRise>=8)&&tryRecordLaser(state.pendingLaser.x,state.pendingLaser.y,sw,sh,vw,vh)){state.pendingLaser=null;state.laserBlocked=true;state.releaseFrames=0;return}if(state.pendingLaser.frames>20){state.pendingLaser=null;state.laserBlocked=true;state.releaseFrames=0}}

  }

  function undo(){if(!state.shots.length)return;state.shots.pop();state.running=true;els.manualBtn.disabled=false;els.matchBtn.textContent='경기 진행 중';els.undoBtn.disabled=!state.shots.length;els.guide.textContent='마지막 기록을 취소했습니다. 계속 사격하세요.';setStatus('경기 진행','#ff4d66');updateScore();drawOverlay();pushLive(true)}
  function reset(){state.running=false;state.shots=[];state.matchId=null;state.spotLatched=false;state.missingFrames=0;clearDetectorBackground();state.detectorReady=false;els.player.disabled=false;els.firingLane.disabled=false;els.maxShots.disabled=false;els.eventName.disabled=false;els.detectKind.disabled=false;els.manualBtn.disabled=true;els.undoBtn.disabled=true;els.matchBtn.textContent=state.center?'경기 시작 대기 중':'경기 시작';els.matchBtn.disabled=!(state.center&&state.radius);els.livePill.textContent=state.stream?'● CAMERA':'● OFF';els.guide.textContent=state.center?'라이브 페이지에서 경기 시작을 누르세요.':'카메라 시작 후 표적을 자동 보정하세요.';setStatus(state.center?'경기 시작 대기 중':'준비');document.body.classList.remove('match-live');setTimeout(resize,60);updateScore();drawOverlay()}
  function loadLeaderboard(){
    els.leaderDialog.showModal();els.leaderList.className='empty';els.leaderList.textContent='기록을 불러오는 중입니다.';
    if(!isServerConfigured()){els.leaderList.textContent='index.html에 Apps Script /exec 주소를 먼저 넣어 주세요.';return}
    const callback='laserLeaderboard_'+Date.now();const script=document.createElement('script');const timer=setTimeout(()=>finish(new Error('시간 초과')),10000);
    function finish(error,rows){clearTimeout(timer);delete window[callback];script.remove();if(error){els.leaderList.className='empty';els.leaderList.textContent='순위표를 불러오지 못했습니다.';return}if(!rows.length){els.leaderList.className='empty';els.leaderList.textContent='아직 저장된 경기 기록이 없습니다.';return}els.leaderList.className='';els.leaderList.innerHTML=rows.map((r,i)=>`<div class="leader-row"><span class="rank">${i+1}</span><span>${escapeHtml(r.player)} <small>· ${r.firingLane||'-'}사로</small></span><strong>${r.totalScore}점</strong><small>10점 ${r.tens}</small></div>`).join('')}
    window[callback]=rows=>finish(null,rows);script.onerror=()=>finish(new Error('network'));script.src=`${APPS_SCRIPT_URL}?action=leaderboard&eventName=${encodeURIComponent(els.eventName.value.trim())}&callback=${callback}&t=${Date.now()}`;document.head.appendChild(script);
  }
  function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}

  async function toggleFullscreen(){
    try{
      if(document.fullscreenElement){await document.exitFullscreen()}
      else{const root=document.documentElement,request=root.requestFullscreen||root.webkitRequestFullscreen;if(!request)return;await request.call(root,{navigationUI:'hide'})}
    }catch(e){console.warn(e)}
  }
  function updateFullscreenButton(){const active=!!document.fullscreenElement;els.fullscreenBtn.textContent=active?'⛶ 전체화면 종료':'⛶ 전체화면';els.fullscreenBtn.setAttribute('aria-label',active?'전체화면 종료':'전체화면 켜기');setTimeout(resize,120)}

  els.cameraBtn.onclick=startCamera;els.calibrateBtn.onclick=beginCalibration;els.learnBtn.onclick=beginLaserLearning;els.matchBtn.title='레이저 3발 학습 후 라이브 관전 페이지에서 경기를 시작하세요.';els.undoBtn.onclick=undo;els.resetBtn.onclick=reset;els.leaderBtn.onclick=loadLeaderboard;els.fullscreenBtn.onclick=toggleFullscreen;els.zoomOut.onclick=()=>changeZoom(-1);els.zoomIn.onclick=()=>changeZoom(1);els.manualBtn.onclick=()=>els.manualDialog.showModal();els.manualConfirm.onclick=()=>{recordShot(null,null,els.manualScore.value);els.manualDialog.close()};els.maxShots.onchange=updateScore;

  els.sensitivityDown.onclick=()=>{state.sensitivity=Math.max(35,state.sensitivity-3);showDetectorInfo();toast('감도를 낮췄습니다.')};els.sensitivityUp.onclick=()=>{state.sensitivity=Math.min(98,state.sensitivity+3);showDetectorInfo();toast('감도를 높였습니다.')};els.laserColor.onchange=()=>{showDetectorInfo();clearDetectorBackground()};
