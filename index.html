<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="theme-color" content="#07111f">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover">
  <title>LASER MATCH</title>
  <style>
    :root{--bg:#07111f;--panel:#101d30;--line:#29415e;--text:#f5f8ff;--muted:#b9c7d8;--cyan:#29e7d6;--lime:#b7ff3c;--red:#ff4d66;--gold:#ffc940;font-size:clamp(20px,5.2vw,23px)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{width:100%;max-width:100%;margin:0;min-height:100%;overflow-x:hidden;background:radial-gradient(circle at 50% -15%,#17375a 0,var(--bg) 45%);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;-webkit-text-size-adjust:100%;text-size-adjust:100%}button,input,select{font:inherit}button{cursor:pointer}
    .app{display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:"header" "setup" "camera" "match" "score" "shots" "footer";width:100vw;max-width:none;margin:0;min-height:100svh;padding:max(env(safe-area-inset-top),4px) max(env(safe-area-inset-left),6px) calc(26px + env(safe-area-inset-bottom)) max(env(safe-area-inset-right),6px)}
    header{grid-area:header;min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:8px}.brand{display:flex;align-items:center;gap:10px;min-width:0}.brand-mark{flex:0 0 auto;width:clamp(38px,10vw,46px);height:clamp(38px,10vw,46px);border:2px solid var(--cyan);border-radius:50%;display:grid;place-items:center;box-shadow:0 0 22px #29e7d655}.brand-mark:before{content:"";width:42%;height:42%;border:2px solid var(--red);border-radius:50%;box-shadow:inset 0 0 0 4px var(--bg)}h1{font-size:clamp(1.05rem,5vw,1.35rem);letter-spacing:.08em;margin:0;white-space:nowrap}.sub{font-size:.72rem;color:var(--muted);margin-top:2px}.header-actions{display:flex;align-items:center;gap:7px}.status{font-size:.75rem;color:var(--cyan);display:flex;gap:6px;align-items:center;white-space:nowrap}.dot{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor}.fullscreen-btn{min-height:44px;border:1px solid #3b5877;border-radius:11px;background:#142941;color:white;padding:8px 11px;font-size:.72rem;font-weight:800;white-space:nowrap}.fullscreen-btn:active{background:var(--cyan);color:#07111f}:fullscreen .app{min-height:100vh}
    .panel{background:linear-gradient(160deg,#14243aee,#0c1728ee);border:1px solid var(--line);border-radius:16px;box-shadow:0 16px 40px #0005;overflow:hidden}.setup{grid-area:setup;padding:14px 12px;margin-bottom:10px}.grid{display:grid;grid-template-columns:1fr;gap:11px}.field label{display:block;color:var(--muted);font-size:.78rem;margin:0 0 7px 3px;font-weight:700}.field input,.field select{width:100%;min-height:58px;border:1px solid var(--line);border-radius:12px;background:#091426;color:white;padding:12px 14px;outline:none;font-size:1rem}.field input:focus,.field select:focus{border-color:var(--cyan)}
    .camera{grid-area:camera;position:relative;width:100%;height:clamp(440px,68svh,780px);background:#02060c;border-radius:14px;overflow:hidden;border:1px solid var(--line)}video,.overlay{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.overlay{touch-action:none}.camera-msg{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:22px;color:var(--muted);background:radial-gradient(circle,#10243a,#050a12);font-size:1rem;line-height:1.6}.camera-msg b{color:white;font-size:1.25rem;margin-bottom:8px}.hud{position:absolute;left:9px;right:9px;top:9px;display:flex;justify-content:space-between;pointer-events:none}.pill{border:1px solid #ffffff28;background:#06101dcc;backdrop-filter:blur(9px);border-radius:999px;padding:9px 12px;font-size:.78rem}.live{color:var(--red)}
    .zoom-controls{position:absolute;z-index:5;right:10px;top:56px;display:grid;grid-template-columns:46px 58px 46px;align-items:center;border:1px solid #ffffff32;border-radius:14px;overflow:hidden;background:#06101de8;backdrop-filter:blur(10px)}.zoom-controls button{width:46px;height:46px;border:0;background:#142941;color:white;font-size:1.45rem;font-weight:800}.zoom-controls button:active{background:var(--cyan);color:#07111f}.zoom-controls button:disabled{opacity:.35}.zoom-controls span{font-size:.72rem;text-align:center;color:var(--cyan);font-weight:800}
    .guide{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:max-content;max-width:94%;padding:9px 12px;border-radius:10px;background:#06101dee;color:white;text-align:center;font-size:.75rem;line-height:1.35;pointer-events:none}.flash{position:absolute;inset:0;display:grid;place-items:center;background:#07111faa;opacity:0;pointer-events:none;transition:.15s}.flash.show{opacity:1}.score-pop{font-size:clamp(4.5rem,25vw,7rem);font-weight:900;color:var(--lime);text-shadow:0 0 30px #b7ff3c99}.miss{color:var(--red)}
    .controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:11px 0}.btn{min-height:62px;border:0;border-radius:14px;padding:13px 9px;font-size:1rem;font-weight:850;color:#08111d;background:var(--cyan)}.btn.secondary{background:#1b2c43;color:white;border:1px solid #34506f}.btn.danger{background:#ff526a;color:white}.btn:disabled{opacity:.45;cursor:not-allowed}.wide{grid-column:1/-1}
    .scoreboard{grid-area:score;display:grid;grid-template-columns:1.2fr .8fr .8fr;gap:1px;background:var(--line);margin-bottom:12px}.metric{background:#0e1b2d;padding:14px 6px;text-align:center}.metric small{display:block;color:var(--muted);font-size:.7rem;margin-bottom:5px}.metric strong{font-size:1.5rem}.metric:first-child strong{color:var(--lime);font-size:1.9rem}
    .shots{grid-area:shots;padding:14px;margin-bottom:12px}.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.section-title h2{font-size:.95rem;margin:0}.shot-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}.shot{aspect-ratio:1;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;font-size:.72rem;color:var(--muted);background:#091426}.shot.hit{color:#07111f;background:var(--lime);border-color:var(--lime);font-weight:900}.shot.miss{background:var(--red);border-color:var(--red);color:white}.hint{font-size:.76rem;line-height:1.6;color:var(--muted);margin-top:12px}.toggle{display:flex;gap:6px}.toggle button{min-height:38px;padding:7px 9px;border-radius:9px;border:1px solid var(--line);background:#091426;color:var(--muted);font-size:.7rem}.toggle button.active{border-color:var(--cyan);color:var(--cyan)}
    .match-controls{grid-area:match}.footer-controls{grid-area:footer}
    .side-panel{display:contents}
    dialog{border:1px solid var(--line);border-radius:20px;padding:0;background:#0c1728;color:white;width:min(92%,560px);box-shadow:0 25px 80px #000b}dialog::backdrop{background:#020712cc}.modal{padding:20px}.modal h3{margin:0 0 15px}.leader-row{display:grid;grid-template-columns:34px 1fr 60px 55px;gap:8px;padding:11px 4px;border-bottom:1px solid #263a53;align-items:center}.rank{color:var(--gold);font-weight:900}.empty{color:var(--muted);text-align:center;padding:30px}.footer-actions{display:flex;gap:8px;margin-top:16px}.footer-actions .btn{flex:1}.toast{position:fixed;z-index:20;left:50%;bottom:28px;transform:translate(-50%,120px);background:#effffb;color:#07111f;padding:11px 16px;border-radius:12px;font-weight:700;box-shadow:0 10px 35px #0009;transition:.25s}.toast.show{transform:translate(-50%,0)}
    @media(min-width:700px){.app{max-width:760px;margin:auto}.grid{grid-template-columns:1fr 1fr}}
    @media(max-width:520px){.shot-grid{grid-template-columns:repeat(5,1fr)}}
    @media(max-width:420px){.status{display:none}.fullscreen-btn{padding:7px 9px;font-size:.68rem}}
    @media(max-width:380px){:root{font-size:19px}.camera{height:66svh}.btn{font-size:.96rem}}
    @media(orientation:landscape) and (max-height:700px){:root{font-size:16px}html,body{height:100%;overflow:hidden}.app{display:grid;width:100%;height:100svh;min-height:0;max-width:none;overflow:hidden;grid-template-columns:minmax(0,1.65fr) minmax(300px,.85fr);grid-template-rows:52px minmax(0,1fr);grid-template-areas:"header header" "camera side";gap:8px;padding:4px 8px 8px}.app>header{min-height:52px}.brand-mark{width:38px;height:38px}h1{font-size:1.08rem}.sub{font-size:.65rem}.camera{height:100%;min-height:0;position:relative;top:auto}.side-panel{grid-area:side;display:block;min-height:0;height:100%;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:0 3px 18px 0;scrollbar-gutter:stable}.setup{margin:0 0 7px;padding:9px}.setup .grid{grid-template-columns:1fr 1fr;gap:7px}.field label{font-size:.66rem;margin-bottom:3px}.field input,.field select{min-height:40px;padding:6px 9px;font-size:.82rem}.controls{margin:0 0 7px;gap:6px}.btn{min-height:43px;padding:6px;font-size:.78rem}.scoreboard{margin:0 0 7px}.metric{padding:7px 3px}.metric strong{font-size:1.1rem}.metric:first-child strong{font-size:1.35rem}.shots{margin:0 0 7px;padding:9px}.section-title{margin-bottom:6px}.shot-grid{grid-template-columns:repeat(10,1fr);gap:3px}.shot{font-size:.6rem}.hint{display:block;font-size:.65rem;line-height:1.35;margin-top:7px}.footer-controls{margin-bottom:10px}.zoom-controls{top:50px;grid-template-columns:40px 52px 40px}.zoom-controls button{width:40px;height:40px}.guide{font-size:.67rem;bottom:8px}}
  </style>
</head>
<body>
<main class="app">
  <header>
    <div class="brand"><div class="brand-mark"></div><div><h1>LASER MATCH</h1><div class="sub">모바일 자동채점 시스템</div></div></div>
    <div class="header-actions"><div class="status" id="status"><i class="dot"></i><span>준비</span></div><button class="fullscreen-btn" id="fullscreenBtn" type="button" aria-label="전체화면 켜기">⛶ 전체화면</button></div>
  </header>

  <section class="camera" id="cameraBox">
    <video id="video" playsinline muted></video>
    <canvas id="overlay" class="overlay"></canvas>
    <div class="camera-msg" id="cameraMsg"><b>카메라를 시작하세요</b><span>표적지가 화면 중앙에 오도록<br>휴대폰을 단단히 고정합니다.</span></div>
    <div class="hud"><span class="pill live" id="livePill">● OFF</span><span class="pill" id="fpsPill">레이저 감도 86</span></div>
    <div class="zoom-controls" aria-label="카메라 확대 축소">
      <button id="zoomOut" type="button" disabled aria-label="축소">−</button>
      <span id="zoomValue">1.0×</span>
      <button id="zoomIn" type="button" disabled aria-label="확대">＋</button>
    </div>
    <div class="guide" id="guide">① 카메라 시작 → ② 표적 자동 보정 → ③ 경기 시작</div>
    <div class="flash" id="flash"><div class="score-pop" id="scorePop">10</div></div>
  </section>

  <div class="side-panel" id="sidePanel">

  <section class="panel setup">
    <div class="grid">
      <div class="field"><label>대회명</label><input id="eventName" value="교내 레이저 사격대회" maxlength="80"></div>
      <div class="field"><label>선수명</label><input id="player" placeholder="선수 이름" maxlength="40"></div>
      <div class="field"><label>사로 지정</label><select id="firingLane"><option value="1">1사로</option><option value="2">2사로</option><option value="3">3사로</option><option value="4">4사로</option><option value="5">5사로</option><option value="6">6사로</option><option value="7">7사로</option><option value="8">8사로</option></select></div>
      <div class="field"><label>레이저 색상</label><select id="laserColor"><option value="red">빨간색</option><option value="green">초록색</option></select></div>
      <div class="field"><label>경기 발수</label><select id="maxShots"><option>5</option><option selected>10</option><option>20</option></select></div>
    </div>
  </section>

  <div class="controls match-controls">
    <button class="btn" id="cameraBtn">카메라 시작</button>
    <button class="btn secondary" id="calibrateBtn" disabled>표적 자동 보정</button>
    <button class="btn wide" id="matchBtn" disabled>경기 시작</button>
    <button class="btn secondary" id="manualBtn" disabled>수동 명중 입력</button>
    <button class="btn danger" id="undoBtn" disabled>마지막 발 취소</button>
  </div>

  <section class="panel scoreboard">
    <div class="metric"><small>총점</small><strong id="totalScore">0</strong></div>
    <div class="metric"><small>발수</small><strong><span id="shotCount">0</span>/<span id="shotMax">10</span></strong></div>
    <div class="metric"><small>평균</small><strong id="average">0.0</strong></div>
  </section>

  <section class="panel shots">
    <div class="section-title"><h2>탄착 기록</h2><div class="toggle"><button id="sensitivityDown">감도−</button><button id="sensitivityUp">감도＋</button></div></div>
    <div class="shot-grid" id="shotGrid"></div>
    <div class="hint" id="calibrationInfo">표적 보정 전입니다. 표적 전체가 화면에 보이도록 휴대폰을 정면으로 고정하세요.</div>
  </section>

  <div class="controls footer-controls">
    <button class="btn secondary" id="leaderBtn">순위표</button>
    <button class="btn secondary" id="resetBtn">새 경기</button>
  </div>
  </div>
</main>

<dialog id="leaderDialog"><div class="modal"><h3>🏆 경기 순위표</h3><div id="leaderList" class="empty">기록을 불러오는 중입니다.</div><div class="footer-actions"><button class="btn secondary" onclick="leaderDialog.close()">닫기</button></div></div></dialog>
<dialog id="manualDialog"><div class="modal"><h3>수동 점수 입력</h3><div class="field"><label>심판 판정 점수</label><select id="manualScore"><option value="10">10점</option><option value="9">9점</option><option value="8">8점</option><option value="7">7점</option><option value="6">6점</option><option value="5">5점</option><option value="4">4점</option><option value="3">3점</option><option value="2">2점</option><option value="1">1점</option><option value="0">0점 / 표적 밖</option></select></div><div class="footer-actions"><button class="btn secondary" onclick="manualDialog.close()">취소</button><button class="btn" id="manualConfirm">기록</button></div></div></dialog>
<div class="toast" id="toast"></div>
<canvas id="work" hidden></canvas>

<script>
(() => {
  'use strict';
  // Apps Script를 웹 앱으로 배포한 뒤 아래 따옴표 안에 /exec 주소를 넣으세요.
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyZrVEhkDw7Q4DEjA_uKP-eJrINC7mJ5LrwkP8QOBQV1gBRqGFD-ScU7r6ipQ-QyjEz9Q/exec';
  const $ = id => document.getElementById(id);
  const els = Object.fromEntries(['video','overlay','work','cameraMsg','cameraBtn','calibrateBtn','matchBtn','manualBtn','undoBtn','guide','livePill','fpsPill','zoomOut','zoomIn','zoomValue','flash','scorePop','eventName','player','firingLane','laserColor','maxShots','totalScore','shotCount','shotMax','average','shotGrid','calibrationInfo','leaderBtn','leaderDialog','leaderList','manualDialog','manualScore','manualConfirm','resetBtn','sensitivityDown','sensitivityUp','toast','status','fullscreenBtn'].map(id => [id,$(id)]));
  const ctx = els.overlay.getContext('2d');
  const wctx = els.work.getContext('2d',{willReadFrequently:true});
  const state = {stream:null,videoTrack:null,running:false,calibrationMode:0,center:null,radius:0,radiusX:0,radiusY:0,targetAngle:0,targetVideo:null,shots:[],maxShots:10,matchId:null,lastHit:0,candidate:null,candidateFrames:0,spotLatched:false,missingFrames:0,sensitivity:86,raf:0,frameLoopToken:0,processing:false,background:null,backgroundR:null,backgroundG:null,backgroundB:null,prevLum:null,pendingLaser:null,laserBlocked:false,stableFrames:0,warmupFrames:0,detectorReady:false,autoCalibrating:false,zoom:1,zoomMin:1,zoomMax:1,zoomStep:.1,actualFps:0};

  function toast(msg){els.toast.textContent=msg;els.toast.classList.add('show');setTimeout(()=>els.toast.classList.remove('show'),2200)}
  function setStatus(text,color='var(--cyan)'){els.status.querySelector('span').textContent=text;els.status.style.color=color}
  function uid(){return 'M-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7)}
  function clearDetectorBackground(){state.background=null;state.backgroundR=null;state.backgroundG=null;state.backgroundB=null;state.prevLum=null;state.pendingLaser=null;state.laserBlocked=false;state.stableFrames=0}
  function blendBackground(data,lum,total,alpha){if(!state.backgroundR)return;for(let p=0,i=0;p<total;p++,i+=4){state.background[p]=state.background[p]*(1-alpha)+lum[p]*alpha;state.backgroundR[p]=state.backgroundR[p]*(1-alpha)+data[i]*alpha;state.backgroundG[p]=state.backgroundG[p]*(1-alpha)+data[i+1]*alpha;state.backgroundB[p]=state.backgroundB[p]*(1-alpha)+data[i+2]*alpha}}
  function resize(){const r=els.overlay.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);els.overlay.width=Math.round(r.width*d);els.overlay.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0);restoreTargetFromVideo();drawOverlay()}

  async function startCamera(){
    try{
      if(state.stream) state.stream.getTracks().forEach(t=>t.stop());
      try{state.stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280,min:640},height:{ideal:720,min:480},frameRate:{ideal:60,min:30,max:60}}})}
      catch(fastError){console.warn('60fps unavailable, retrying at standard speed',fastError);state.stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30}}})}
      els.video.srcObject=state.stream;await els.video.play();state.videoTrack=state.stream.getVideoTracks()[0];await setupCameraZoom();els.cameraMsg.style.display='none';
      els.cameraBtn.textContent='카메라 다시 시작';els.calibrateBtn.disabled=false;els.livePill.textContent='● CAMERA';setStatus('카메라 연결');els.guide.textContent='표적을 화면 중앙에 맞추면 자동으로 인식합니다.';resize();processFrames();setTimeout(()=>{if(state.stream&&!state.center&&!state.running)beginCalibration()},900);
    }catch(e){console.error(e);toast('카메라 권한을 허용해 주세요.');els.guide.textContent='브라우저 설정에서 카메라 권한을 허용한 뒤 다시 시도하세요.'}
  }

  async function setupCameraZoom(){
    const track=state.videoTrack;if(!track)return;
    let caps={},settings={};try{caps=track.getCapabilities?track.getCapabilities():{};settings=track.getSettings?track.getSettings():{};state.actualFps=Number(settings.frameRate)||0}catch(e){console.warn(e)}
    const advanced=[];if(Array.isArray(caps.focusMode)&&caps.focusMode.includes('continuous'))advanced.push({focusMode:'continuous'});if(Array.isArray(caps.exposureMode)&&caps.exposureMode.includes('continuous'))advanced.push({exposureMode:'continuous'});if(advanced.length){try{await track.applyConstraints({advanced})}catch(e){console.warn('camera tuning skipped',e)}}
    if(caps.zoom&&Number.isFinite(caps.zoom.min)&&Number.isFinite(caps.zoom.max)&&caps.zoom.max>caps.zoom.min){
      state.zoomMin=Number(caps.zoom.min);state.zoomMax=Number(caps.zoom.max);state.zoomStep=Math.max(.1,Number(caps.zoom.step)||.1);state.zoom=Math.min(state.zoomMax,Math.max(state.zoomMin,Number(settings.zoom)||state.zoomMin));els.zoomOut.disabled=false;els.zoomIn.disabled=false;updateZoomUI();
    }else{state.zoom=1;state.zoomMin=1;state.zoomMax=1;els.zoomOut.disabled=true;els.zoomIn.disabled=true;els.zoomValue.textContent='미지원'}
    showDetectorInfo();
  }

  function updateZoomUI(){els.zoomValue.textContent=state.zoom.toFixed(1)+'×';els.zoomOut.disabled=state.zoom<=state.zoomMin+.001;els.zoomIn.disabled=state.zoom>=state.zoomMax-.001}

  async function changeZoom(direction){
    if(!state.videoTrack||state.zoomMax<=state.zoomMin){toast('이 브라우저에서는 카메라 줌을 지원하지 않습니다.');return}
    const next=Math.min(state.zoomMax,Math.max(state.zoomMin,state.zoom+direction*state.zoomStep));if(Math.abs(next-state.zoom)<.001)return;
    try{await state.videoTrack.applyConstraints({advanced:[{zoom:next}]});state.zoom=next;updateZoomUI();state.center=null;state.radius=state.radiusX=state.radiusY=0;state.targetVideo=null;clearDetectorBackground();els.matchBtn.disabled=true;drawOverlay();els.guide.textContent='배율이 변경되었습니다 · 표적을 다시 자동 보정합니다.';setTimeout(()=>beginCalibration(),450)}catch(e){console.error(e);toast('카메라 배율을 변경하지 못했습니다.')}
  }

  async function beginCalibration(){
    if(!state.stream||els.video.readyState<2||state.autoCalibrating)return;state.autoCalibrating=true;
    state.running=false;state.center=null;state.radius=state.radiusX=state.radiusY=0;state.targetAngle=0;state.targetVideo=null;state.shots=[];state.calibrationMode=0;clearDetectorBackground();updateScore();drawOverlay();
    els.calibrateBtn.disabled=true;els.matchBtn.disabled=true;els.guide.textContent='표적의 동심원과 중심을 분석하고 있습니다…';setStatus('자동 보정 중','#ffc940');
    await new Promise(resolve=>setTimeout(resolve,350));
    const target=detectTarget();
    els.calibrateBtn.disabled=false;state.autoCalibrating=false;

      state.center={x:target.x,y:target.y};state.radiusX=target.radiusX;state.radiusY=target.radiusY;state.radius=Math.max(target.radiusX,target.radiusY);state.targetAngle=target.angle;state.calibrationMode=0;saveTargetToVideo();

      if(!insideScan(x,y))continue;
      const p=y*sw+x,i=p*4,r=data[i],g=data[i+1],b=data[i+2],dr=r-state.backgroundR[p],dg=g-state.backgroundG[p],db=b-state.backgroundB[p],lumRise=lum[p]-state.background[p],maxRise=Math.max(dr,dg,db);
      const currentWarm=r-Math.max(g,b),baseWarm=state.backgroundR[p]-Math.max(state.backgroundG[p],state.backgroundB[p]),warmBoost=currentWarm-baseWarm;
      const warmMixed=dr>4&&dr>=dg-8&&dr>=db-8,redHalo=currentWarm>8&&warmBoost>2&&dr>4,whitePink=r>180&&dr>7&&dr>=dg-10&&dr>=db-10;
      const greenMixed=dg>5&&dg>=dr-6&&dg>=db-6;
      const colorMatch=color==='green'?greenMixed:(warmMixed||redHalo||whitePink);
      if(!colorMatch||maxRise<signalThreshold||lumRise<2)continue;
      const colorBoost=color==='green'?dg-Math.max(dr,db):Math.max(warmBoost,dr-Math.max(dg,db)),signal=maxRise+Math.max(0,lumRise)*1.15+Math.max(0,colorBoost)*.65,point={x,y,wt:signal,delta:signal,bright:Math.max(r,g,b),redRise:dr,colorBoost,lumRise};points.push(point);if(!strongest||signal>strongest.wt)strongest=point;
    }
    if(!points.length){
      state.laserBlocked=false;
      if(state.pendingLaser){const pending=state.pendingLaser;state.pendingLaser=null;const colorOrWhite=pending.maxColorBoost>=1||(pending.maxBright>=205&&pending.maxRedRise>=9),confirmed=(pending.frames>=2&&pending.frames<=9&&pending.maxSignal>=14&&pending.maxContrast>=6&&colorOrWhite)||(pending.frames===1&&pending.maxSignal>=25&&pending.maxContrast>=10&&colorOrWhite);if(confirmed)tryRecordLaser(pending.x,pending.y,sw,sh,vw,vh)}
      blendBackground(data,lum,total,.025);return;
    }
    if(points.length>650){state.pendingLaser=null;state.laserBlocked=true;blendBackground(data,lum,total,.16);return}
    let sx=0,sy=0,weight=0,localCount=0,clusterColorBoost=strongest.colorBoost,minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;for(const point of points){if(Math.hypot(point.x-strongest.x,point.y-strongest.y)<=9){sx+=point.x*point.wt;sy+=point.y*point.wt;weight+=point.wt;localCount++;clusterColorBoost=Math.max(clusterColorBoost,point.colorBoost);if(point.x<minX)minX=point.x;if(point.x>maxX)maxX=point.x;if(point.y<minY)minY=point.y;if(point.y>maxY)maxY=point.y}}
    const clusterW=maxX-minX+1,clusterH=maxY-minY+1,shape=clusterW/Math.max(1,clusterH);let surround=0,surroundN=0;for(let oy=-10;oy<=10;oy++)for(let ox=-10;ox<=10;ox++){const distance=Math.hypot(ox,oy);if(distance<6||distance>10)continue;const nx=strongest.x+ox,ny=strongest.y+oy;if(nx<0||nx>=sw||ny<0||ny>=sh)continue;surround+=lum[ny*sw+nx];surroundN++}const localContrast=strongest.bright-surround/Math.max(1,surroundN);
    if(localCount>140||shape<.25||shape>4||(localCount<2&&strongest.delta<25)||localContrast<4){state.pendingLaser=null;state.laserBlocked=true;blendBackground(data,lum,total,.04);return}
    if(state.laserBlocked)return;
    const px=weight?sx/weight:strongest.x,py=weight?sy/weight:strongest.y;
    const instant=strongest.delta>=28&&localContrast>=11&&localCount<=100&&(clusterColorBoost>=1||(strongest.bright>=205&&strongest.redRise>=9));if(instant&&tryRecordLaser(px,py,sw,sh,vw,vh)){state.pendingLaser=null;state.laserBlocked=true;return}
    if(state.pendingLaser&&Math.hypot(px-state.pendingLaser.x,py-state.pendingLaser.y)<12){const n=state.pendingLaser.frames;state.pendingLaser.x=(state.pendingLaser.x*n+px)/(n+1);state.pendingLaser.y=(state.pendingLaser.y*n+py)/(n+1);state.pendingLaser.frames++;state.pendingLaser.maxSignal=Math.max(state.pendingLaser.maxSignal,strongest.delta);state.pendingLaser.maxContrast=Math.max(state.pendingLaser.maxContrast,localContrast);state.pendingLaser.maxColorBoost=Math.max(state.pendingLaser.maxColorBoost,clusterColorBoost);state.pendingLaser.maxBright=Math.max(state.pendingLaser.maxBright,strongest.bright);state.pendingLaser.maxRedRise=Math.max(state.pendingLaser.maxRedRise,strongest.redRise);if(state.pendingLaser.frames>9){state.pendingLaser=null;state.laserBlocked=true}}
    else state.pendingLaser={x:px,y:py,frames:1,maxSignal:strongest.delta,maxContrast:localContrast,maxColorBoost:clusterColorBoost,maxBright:strongest.bright,maxRedRise:strongest.redRise};
  }

  function undo(){if(!state.shots.length)return;state.shots.pop();state.running=true;els.manualBtn.disabled=false;els.matchBtn.textContent='경기 진행 중';els.undoBtn.disabled=!state.shots.length;els.guide.textContent='마지막 기록을 취소했습니다. 계속 사격하세요.';setStatus('경기 진행','#ff4d66');updateScore();drawOverlay()}
  function reset(){state.running=false;state.shots=[];state.matchId=null;state.spotLatched=false;state.missingFrames=0;clearDetectorBackground();state.detectorReady=false;els.player.disabled=false;els.firingLane.disabled=false;els.maxShots.disabled=false;els.eventName.disabled=false;els.manualBtn.disabled=true;els.undoBtn.disabled=true;els.matchBtn.textContent='경기 시작';els.matchBtn.disabled=!(state.center&&state.radius);els.livePill.textContent=state.stream?'● CAMERA':'● OFF';els.guide.textContent=state.center?'새 선수를 입력하고 경기 시작을 누르세요.':'카메라 시작 후 표적을 자동 보정하세요.';setStatus('준비');updateScore();drawOverlay()}
  function loadLeaderboard(){
    els.leaderDialog.showModal();els.leaderList.className='empty';els.leaderList.textContent='기록을 불러오는 중입니다.';
    if(!isServerConfigured()){els.leaderList.textContent='index.html에 Apps Script /exec 주소를 먼저 넣어 주세요.';return}
    const callback='laserLeaderboard_'+Date.now();const script=document.createElement('script');const timer=setTimeout(()=>finish(new Error('시간 초과')),10000);
    function finish(error,rows){clearTimeout(timer);delete window[callback];script.remove();if(error){els.leaderList.className='empty';els.leaderList.textContent='순위표를 불러오지 못했습니다.';return}if(!rows.length){els.leaderList.className='empty';els.leaderList.textContent='아직 저장된 경기 기록이 없습니다.';return}els.leaderList.className='';els.leaderList.innerHTML=rows.map((r,i)=>`<div class="leader-row"><span class="rank">${i+1}</span><span>${escapeHtml(r.player)} <small>· ${r.firingLane||'-'}사로</small></span><strong>${r.totalScore}점</strong><small>10점 ${r.tens}</small></div>`).join('')}
    window[callback]=rows=>finish(null,rows);script.onerror=()=>finish(new Error('network'));script.src=`${APPS_SCRIPT_URL}?action=leaderboard&eventName=${encodeURIComponent(els.eventName.value.trim())}&callback=${callback}&t=${Date.now()}`;document.head.appendChild(script);
  }
  function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}

  async function toggleFullscreen(){
    try{
      if(document.fullscreenElement){await document.exitFullscreen()}
      else{const root=document.documentElement,request=root.requestFullscreen||root.webkitRequestFullscreen;if(!request){toast('Chrome 메뉴에서 홈 화면에 추가하면 더 크게 볼 수 있습니다.');return}await request.call(root,{navigationUI:'hide'})}
    }catch(e){console.warn(e);toast('브라우저 메뉴에서 Chrome으로 열고 다시 눌러 주세요.')}
  }
  function updateFullscreenButton(){const active=!!document.fullscreenElement;els.fullscreenBtn.textContent=active?'⛶ 전체화면 종료':'⛶ 전체화면';els.fullscreenBtn.setAttribute('aria-label',active?'전체화면 종료':'전체화면 켜기');setTimeout(resize,120)}

  els.cameraBtn.onclick=startCamera;els.calibrateBtn.onclick=beginCalibration;els.matchBtn.onclick=startMatch;els.undoBtn.onclick=undo;els.resetBtn.onclick=reset;els.leaderBtn.onclick=loadLeaderboard;els.fullscreenBtn.onclick=toggleFullscreen;els.zoomOut.onclick=()=>changeZoom(-1);els.zoomIn.onclick=()=>changeZoom(1);els.manualBtn.onclick=()=>els.manualDialog.showModal();els.manualConfirm.onclick=()=>{recordShot(null,null,els.manualScore.value);els.manualDialog.close()};els.maxShots.onchange=updateScore;
  function showDetectorInfo(){els.fpsPill.textContent='혼합광 감도 '+state.sensitivity+(state.actualFps?' · '+Math.round(state.actualFps)+'fps':'')}
  els.sensitivityDown.onclick=()=>{state.sensitivity=Math.max(35,state.sensitivity-3);showDetectorInfo();toast('감도를 낮췄습니다.')};els.sensitivityUp.onclick=()=>{state.sensitivity=Math.min(98,state.sensitivity+3);showDetectorInfo();toast('감도를 높였습니다.')};els.laserColor.onchange=()=>{showDetectorInfo();clearDetectorBackground()};
  window.addEventListener('resize',resize);window.addEventListener('orientationchange',()=>setTimeout(resize,280));document.addEventListener('fullscreenchange',updateFullscreenButton);document.addEventListener('webkitfullscreenchange',updateFullscreenButton);document.addEventListener('visibilitychange',()=>{if(document.hidden){state.candidate=null;state.candidateFrames=0}});updateScore();
})();
</script>
