<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="theme-color" content="#07111f">
  <title>LASER MATCH</title>
  <style>
    :root{--bg:#07111f;--panel:#101d30;--line:#29415e;--text:#f5f8ff;--muted:#aab9cc;--cyan:#29e7d6;--lime:#b7ff3c;--red:#ff4d66;--gold:#ffc940;font-size:clamp(16px,4.15vw,19px)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -15%,#17375a 0,var(--bg) 45%);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}button,input,select{font:inherit}button{cursor:pointer}
    .app{width:100%;max-width:680px;margin:auto;min-height:100svh;padding:max(env(safe-area-inset-top),8px) clamp(10px,3vw,18px) calc(40px + env(safe-area-inset-bottom))}
    header{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{display:flex;align-items:center;gap:10px;min-width:0}.brand-mark{flex:0 0 auto;width:clamp(38px,10vw,46px);height:clamp(38px,10vw,46px);border:2px solid var(--cyan);border-radius:50%;display:grid;place-items:center;box-shadow:0 0 22px #29e7d655}.brand-mark:before{content:"";width:42%;height:42%;border:2px solid var(--red);border-radius:50%;box-shadow:inset 0 0 0 4px var(--bg)}h1{font-size:clamp(1.05rem,5vw,1.35rem);letter-spacing:.08em;margin:0;white-space:nowrap}.sub{font-size:.72rem;color:var(--muted);margin-top:2px}.status{font-size:.75rem;color:var(--cyan);display:flex;gap:6px;align-items:center;white-space:nowrap}.dot{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor}
    .panel{background:linear-gradient(160deg,#14243aee,#0c1728ee);border:1px solid var(--line);border-radius:18px;box-shadow:0 16px 40px #0005;overflow:hidden}.setup{padding:clamp(12px,3.5vw,18px);margin-bottom:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;color:var(--muted);font-size:.74rem;margin:0 0 6px 3px}.field input,.field select{width:100%;min-height:48px;border:1px solid var(--line);border-radius:11px;background:#091426;color:white;padding:10px 12px;outline:none;font-size:.92rem}.field input:focus,.field select:focus{border-color:var(--cyan)}
    .camera{position:relative;width:100%;height:clamp(360px,61svh,680px);background:#02060c;border-radius:18px;overflow:hidden;border:1px solid var(--line)}video,.overlay{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.overlay{touch-action:none}.camera-msg{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:24px;color:var(--muted);background:radial-gradient(circle,#10243a,#050a12);font-size:.9rem;line-height:1.55}.camera-msg b{color:white;font-size:1.12rem;margin-bottom:7px}.hud{position:absolute;left:10px;right:10px;top:10px;display:flex;justify-content:space-between;pointer-events:none}.pill{border:1px solid #ffffff28;background:#06101dcc;backdrop-filter:blur(9px);border-radius:999px;padding:7px 10px;font-size:.72rem}.live{color:var(--red)}
    .guide{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:max-content;max-width:94%;padding:9px 12px;border-radius:10px;background:#06101dee;color:white;text-align:center;font-size:.75rem;line-height:1.35;pointer-events:none}.flash{position:absolute;inset:0;display:grid;place-items:center;background:#07111faa;opacity:0;pointer-events:none;transition:.15s}.flash.show{opacity:1}.score-pop{font-size:clamp(4.5rem,25vw,7rem);font-weight:900;color:var(--lime);text-shadow:0 0 30px #b7ff3c99}.miss{color:var(--red)}
    .controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.btn{min-height:52px;border:0;border-radius:13px;padding:12px 10px;font-size:.9rem;font-weight:850;color:#08111d;background:var(--cyan)}.btn.secondary{background:#1b2c43;color:white;border:1px solid #34506f}.btn.danger{background:#ff526a;color:white}.btn:disabled{opacity:.45;cursor:not-allowed}.wide{grid-column:1/-1}
    .scoreboard{display:grid;grid-template-columns:1.2fr .8fr .8fr;gap:1px;background:var(--line);margin-bottom:12px}.metric{background:#0e1b2d;padding:14px 6px;text-align:center}.metric small{display:block;color:var(--muted);font-size:.7rem;margin-bottom:5px}.metric strong{font-size:1.5rem}.metric:first-child strong{color:var(--lime);font-size:1.9rem}
    .shots{padding:14px;margin-bottom:12px}.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.section-title h2{font-size:.95rem;margin:0}.shot-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}.shot{aspect-ratio:1;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;font-size:.72rem;color:var(--muted);background:#091426}.shot.hit{color:#07111f;background:var(--lime);border-color:var(--lime);font-weight:900}.shot.miss{background:var(--red);border-color:var(--red);color:white}.hint{font-size:.76rem;line-height:1.6;color:var(--muted);margin-top:12px}.toggle{display:flex;gap:6px}.toggle button{min-height:38px;padding:7px 9px;border-radius:9px;border:1px solid var(--line);background:#091426;color:var(--muted);font-size:.7rem}.toggle button.active{border-color:var(--cyan);color:var(--cyan)}
    dialog{border:1px solid var(--line);border-radius:20px;padding:0;background:#0c1728;color:white;width:min(92%,560px);box-shadow:0 25px 80px #000b}dialog::backdrop{background:#020712cc}.modal{padding:20px}.modal h3{margin:0 0 15px}.leader-row{display:grid;grid-template-columns:34px 1fr 60px 55px;gap:8px;padding:11px 4px;border-bottom:1px solid #263a53;align-items:center}.rank{color:var(--gold);font-weight:900}.empty{color:var(--muted);text-align:center;padding:30px}.footer-actions{display:flex;gap:8px;margin-top:16px}.footer-actions .btn{flex:1}.toast{position:fixed;z-index:20;left:50%;bottom:28px;transform:translate(-50%,120px);background:#effffb;color:#07111f;padding:11px 16px;border-radius:12px;font-weight:700;box-shadow:0 10px 35px #0009;transition:.25s}.toast.show{transform:translate(-50%,0)}
    @media(max-width:520px){.grid{grid-template-columns:1fr 1fr}.shot-grid{grid-template-columns:repeat(5,1fr)}}
    @media(max-width:380px){:root{font-size:15px}.status span{display:none}.camera{height:58svh}.btn{font-size:.84rem}.grid{grid-template-columns:1fr}}
    @media(orientation:landscape) and (max-height:600px){.camera{height:78svh}.app{max-width:920px}.setup .grid{grid-template-columns:repeat(4,1fr)}}
  </style>
</head>
<body>
<main class="app">
  <header>
    <div class="brand"><div class="brand-mark"></div><div><h1>LASER MATCH</h1><div class="sub">모바일 자동채점 시스템</div></div></div>
    <div class="status" id="status"><i class="dot"></i><span>준비</span></div>
  </header>

  <section class="panel setup">
    <div class="grid">
      <div class="field"><label>대회명</label><input id="eventName" value="교내 레이저 사격대회" maxlength="80"></div>
      <div class="field"><label>선수명</label><input id="player" placeholder="선수 이름" maxlength="40"></div>
      <div class="field"><label>레이저 색상</label><select id="laserColor"><option value="red">빨간색</option><option value="green">초록색</option></select></div>
      <div class="field"><label>경기 발수</label><select id="maxShots"><option>5</option><option selected>10</option><option>20</option></select></div>
    </div>
  </section>

  <section class="camera" id="cameraBox">
    <video id="video" playsinline muted></video>
    <canvas id="overlay" class="overlay"></canvas>
    <div class="camera-msg" id="cameraMsg"><b>카메라를 시작하세요</b><span>표적지가 화면 중앙에 오도록<br>휴대폰을 단단히 고정합니다.</span></div>
    <div class="hud"><span class="pill live" id="livePill">● OFF</span><span class="pill" id="fpsPill">감도 70</span></div>
    <div class="guide" id="guide">① 카메라 시작 → ② 표적 자동 보정 → ③ 경기 시작</div>
    <div class="flash" id="flash"><div class="score-pop" id="scorePop">10</div></div>
  </section>

  <div class="controls">
    <button class="btn" id="cameraBtn">카메라 시작</button>
    <button class="btn secondary" id="calibrateBtn" disabled>표적 자동 보정</button>
    <button class="btn wide" id="matchBtn" disabled>경기 시작</button>
    <button class="btn secondary" id="manualBtn" disabled>수동 명중 입력</button>
    <button class="btn danger" id="undoBtn" disabled>마지막 발 취소</button>
  </div>

  <section class="panel scoreboard">
    <div class="metric"><small>총점</small><strong id="totalScore">0</strong></div>
    <div class="metric"><small>발수</small><strong><span id="shotCount">0</span>/<span id="shotMax">10</span></strong></div>
    <div class="metric"><small>평균</small><strong id="average">0.0</strong></div>
  </section>

  <section class="panel shots">
    <div class="section-title"><h2>탄착 기록</h2><div class="toggle"><button id="sensitivityDown">감도−</button><button id="sensitivityUp">감도＋</button></div></div>
    <div class="shot-grid" id="shotGrid"></div>
    <div class="hint" id="calibrationInfo">표적 보정 전입니다. 표적 전체가 화면에 보이도록 휴대폰을 정면으로 고정하세요.</div>
  </section>

  <div class="controls">
    <button class="btn secondary" id="leaderBtn">순위표</button>
    <button class="btn secondary" id="resetBtn">새 경기</button>
  </div>
</main>

<dialog id="leaderDialog"><div class="modal"><h3>🏆 경기 순위표</h3><div id="leaderList" class="empty">기록을 불러오는 중입니다.</div><div class="footer-actions"><button class="btn secondary" onclick="leaderDialog.close()">닫기</button></div></div></dialog>
<dialog id="manualDialog"><div class="modal"><h3>수동 점수 입력</h3><div class="field"><label>심판 판정 점수</label><select id="manualScore"><option value="10">10점</option><option value="9">9점</option><option value="8">8점</option><option value="7">7점</option><option value="6">6점</option><option value="5">5점</option><option value="4">4점</option><option value="3">3점</option><option value="2">2점</option><option value="1">1점</option><option value="0">0점 / 표적 밖</option></select></div><div class="footer-actions"><button class="btn secondary" onclick="manualDialog.close()">취소</button><button class="btn" id="manualConfirm">기록</button></div></div></dialog>
<div class="toast" id="toast"></div>
<canvas id="work" hidden></canvas>

<script>
(() => {
  'use strict';
  // Apps Script를 웹 앱으로 배포한 뒤 아래 따옴표 안에 /exec 주소를 넣으세요.
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyZrVEhkDw7Q4DEjA_uKP-eJrINC7mJ5LrwkP8QOBQV1gBRqGFD-ScU7r6ipQ-QyjEz9Q/exec';
  const $ = id => document.getElementById(id);
  const els = Object.fromEntries(['video','overlay','work','cameraMsg','cameraBtn','calibrateBtn','matchBtn','manualBtn','undoBtn','guide','livePill','fpsPill','flash','scorePop','eventName','player','laserColor','maxShots','totalScore','shotCount','shotMax','average','shotGrid','calibrationInfo','leaderBtn','leaderDialog','leaderList','manualDialog','manualScore','manualConfirm','resetBtn','sensitivityDown','sensitivityUp','toast','status'].map(id => [id,$(id)]));
  const ctx = els.overlay.getContext('2d');
  const wctx = els.work.getContext('2d',{willReadFrequently:true});
  const state = {stream:null,running:false,calibrationMode:0,center:null,radius:0,shots:[],maxShots:10,matchId:null,lastHit:0,candidate:null,candidateFrames:0,spotLatched:false,missingFrames:0,sensitivity:70,raf:0,processing:false,background:null,warmupFrames:0,detectorReady:false,autoCalibrating:false};

  function toast(msg){els.toast.textContent=msg;els.toast.classList.add('show');setTimeout(()=>els.toast.classList.remove('show'),2200)}
  function setStatus(text,color='var(--cyan)'){els.status.querySelector('span').textContent=text;els.status.style.color=color}
  function uid(){return 'M-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7)}
  function resize(){const r=els.overlay.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);els.overlay.width=Math.round(r.width*d);els.overlay.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0);drawOverlay()}

  async function startCamera(){
    try{
      if(state.stream) state.stream.getTracks().forEach(t=>t.stop());
      state.stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30,max:30}}});
      els.video.srcObject=state.stream;await els.video.play();els.cameraMsg.style.display='none';
      els.cameraBtn.textContent='카메라 다시 시작';els.calibrateBtn.disabled=false;els.livePill.textContent='● CAMERA';setStatus('카메라 연결');els.guide.textContent='표적을 화면 중앙에 맞추면 자동으로 인식합니다.';resize();processFrames();setTimeout(()=>{if(state.stream&&!state.center&&!state.running)beginCalibration()},900);
    }catch(e){console.error(e);toast('카메라 권한을 허용해 주세요.');els.guide.textContent='브라우저 설정에서 카메라 권한을 허용한 뒤 다시 시도하세요.'}
  }

  async function beginCalibration(){
    if(!state.stream||els.video.readyState<2||state.autoCalibrating)return;state.autoCalibrating=true;
    state.running=false;state.center=null;state.radius=0;state.shots=[];state.calibrationMode=0;state.background=null;updateScore();drawOverlay();
    els.calibrateBtn.disabled=true;els.matchBtn.disabled=true;els.guide.textContent='표적의 동심원과 중심을 분석하고 있습니다…';setStatus('자동 보정 중','#ffc940');
    await new Promise(resolve=>setTimeout(resolve,350));
    const target=detectTarget();
    els.calibrateBtn.disabled=false;state.autoCalibrating=false;
    if(target){
      state.center={x:target.x,y:target.y};state.radius=target.radius;state.calibrationMode=0;
      els.guide.textContent='표적 자동 보정 완료 · 경기 시작을 누르세요.';
      els.calibrationInfo.textContent=`자동 보정 완료: 중심 (${Math.round(target.x)}, ${Math.round(target.y)}), 외곽 반지름 ${Math.round(target.radius)}px`;
      els.matchBtn.disabled=false;setStatus('자동 보정 완료');drawOverlay();toast('표적을 자동으로 인식했습니다.');
    }else{
      state.calibrationMode=1;els.guide.textContent='자동 인식 실패 · 표적 중심을 한 번 눌러 수동 보정하세요.';
      els.calibrationInfo.textContent='자동 인식이 어려운 조명입니다. 표적 중심과 가장 바깥쪽 1점 원을 차례로 눌러 주세요.';
      setStatus('수동 보정','#ffc940');toast('표적을 더 크게, 정면으로 맞춘 뒤 다시 시도할 수 있습니다.');
    }
  }

  function videoGeometry(){
    const vw=els.video.videoWidth,vh=els.video.videoHeight,box=els.overlay.getBoundingClientRect();
    const scale=Math.min(box.width/vw,box.height/vh);
    return{vw,vh,box,scale,offX:(box.width-vw*scale)/2,offY:(box.height-vh*scale)/2};
  }

  function videoToScreen(vx,vy){const g=videoGeometry();return{x:g.offX+vx*g.scale,y:g.offY+vy*g.scale,scale:g.scale}}

  function screenTargetToWork(sw,sh){
    const g=videoGeometry();
    return{x:(state.center.x-g.offX)/g.scale/g.vw*sw,y:(state.center.y-g.offY)/g.scale/g.vh*sh,r:state.radius/g.scale/g.vw*sw};
  }

  function detectTarget(){
    const vw=els.video.videoWidth,vh=els.video.videoHeight;if(!vw||!vh)return null;
    const sw=360,sh=Math.max(200,Math.round(sw*vh/vw));els.work.width=sw;els.work.height=sh;wctx.drawImage(els.video,0,0,sw,sh);
    const data=wctx.getImageData(0,0,sw,sh).data,gray=new Uint8Array(sw*sh);let mean=0;
    for(let p=0,i=0;p<gray.length;p++,i+=4){const v=Math.round(data[i]*.299+data[i+1]*.587+data[i+2]*.114);gray[p]=v;mean+=v}mean/=gray.length;
    const threshold=Math.max(45,Math.min(150,mean-38)),mask=new Uint8Array(sw*sh),seen=new Uint8Array(sw*sh);
    for(let y=Math.round(sh*.08);y<sh*.92;y++)for(let x=Math.round(sw*.08);x<sw*.92;x++){const p=y*sw+x;if(gray[p]<threshold)mask[p]=1}
    let best=null;const stack=[];
    for(let y=2;y<sh-2;y+=2)for(let x=2;x<sw-2;x+=2){const start=y*sw+x;if(!mask[start]||seen[start])continue;stack.length=0;stack.push(start);seen[start]=1;let area=0,sumX=0,sumY=0,minX=x,maxX=x,minY=y,maxY=y;
      while(stack.length&&area<12000){const p=stack.pop(),px=p%sw,py=(p/sw)|0;area++;sumX+=px;sumY+=py;if(px<minX)minX=px;if(px>maxX)maxX=px;if(py<minY)minY=py;if(py>maxY)maxY=py;const n=[p-1,p+1,p-sw,p+sw];for(const q of n){if(q>0&&q<mask.length&&mask[q]&&!seen[q]){seen[q]=1;stack.push(q)}}}
      const bw=maxX-minX+1,bh=maxY-minY+1,ratio=bw/bh;if(area<25||ratio<.62||ratio>1.6||bw>sw*.5||bh>sh*.65)continue;const cx=sumX/area,cy=sumY/area,dist=Math.hypot(cx-sw/2,cy-sh/2),fill=area/(bw*bh),score=area*(.4+fill)/(1+dist*.025);if(!best||score>best.score)best={cx,cy,bw,bh,score};
    }
    let cx=best?best.cx:sw/2,cy=best?best.cy:sh/2;if(Math.hypot(cx-sw/2,cy-sh/2)>Math.min(sw,sh)*.32){cx=sw/2;cy=sh/2}
    const minR=Math.max(16,best?Math.max(best.bw,best.bh)*.7:18),maxR=Math.min(sw,sh)*.46,profile=[];
    for(let r=Math.round(minR);r<=maxR;r++){let sum=0,covered=0;const samples=96;for(let a=0;a<samples;a++){const t=a*Math.PI*2/samples,cs=Math.cos(t),sn=Math.sin(t),x1=Math.round(cx+cs*(r-2)),y1=Math.round(cy+sn*(r-2)),x2=Math.round(cx+cs*(r+2)),y2=Math.round(cy+sn*(r+2));if(x1<1||x1>=sw-1||y1<1||y1>=sh-1||x2<1||x2>=sw-1||y2<1||y2>=sh-1)continue;const d=Math.abs(gray[y2*sw+x2]-gray[y1*sw+x1]);sum+=d;if(d>22)covered++}profile.push({r,score:sum/samples,coverage:covered/samples})}
    const avg=profile.reduce((s,v)=>s+v.score,0)/Math.max(1,profile.length);const peaks=profile.filter((v,i)=>i>1&&i<profile.length-2&&v.coverage>.12&&v.score>avg*1.22&&v.score>=profile[i-1].score&&v.score>=profile[i+1].score);
    if(peaks.length<3)return null;
    const outer=peaks.filter(p=>p.r>minR*1.8).sort((a,b)=>b.r-a.r)[0];if(!outer)return null;
    const mapped=videoToScreen(cx/sw*vw,cy/sh*vh),screenRadius=outer.r/sw*vw*mapped.scale;
    if(screenRadius<45||screenRadius>Math.min(els.overlay.clientWidth,els.overlay.clientHeight)*.49)return null;
    return{x:mapped.x,y:mapped.y,radius:screenRadius};
  }

  function canvasPoint(ev){const r=els.overlay.getBoundingClientRect();return{x:ev.clientX-r.left,y:ev.clientY-r.top}}
  els.overlay.addEventListener('pointerdown',ev=>{
    const p=canvasPoint(ev);
    if(state.calibrationMode===1){state.center=p;state.calibrationMode=2;els.guide.textContent='가장 바깥쪽 1점 원의 테두리를 누르세요.';drawOverlay();return}
    if(state.calibrationMode===2){const d=Math.hypot(p.x-state.center.x,p.y-state.center.y);if(d<40){toast('중심에서 더 먼 바깥 원을 눌러 주세요.');return}state.radius=d;state.calibrationMode=0;els.guide.textContent='보정 완료 · 경기 시작을 누르세요.';els.calibrationInfo.textContent=`보정 완료: 외곽 반지름 ${Math.round(d)}px · 표적이 움직이면 다시 보정하세요.`;els.matchBtn.disabled=false;setStatus('보정 완료');drawOverlay();return}
  });

  function drawOverlay(){
    const width=els.overlay.clientWidth,height=els.overlay.clientHeight;ctx.clearRect(0,0,width,height);
    if(!state.center)return;
    ctx.save();ctx.lineWidth=1.2;
    if(state.radius){for(let i=10;i>=1;i--){ctx.beginPath();ctx.arc(state.center.x,state.center.y,state.radius*i/10,0,Math.PI*2);ctx.strokeStyle=i===10?'#29e7d6cc':'#ffffff55';ctx.stroke()}}
    ctx.beginPath();ctx.arc(state.center.x,state.center.y,6,0,Math.PI*2);ctx.strokeStyle='#ff4d66';ctx.lineWidth=2;ctx.stroke();
    state.shots.forEach((s,i)=>{if(s.manual||s.screenX==null)return;ctx.beginPath();ctx.arc(s.screenX,s.screenY,9,0,Math.PI*2);ctx.fillStyle=s.score?'#b7ff3c':'#ff4d66';ctx.fill();ctx.fillStyle='#07111f';ctx.font='bold 10px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(String(i+1),s.screenX,s.screenY)});ctx.restore();
  }

  function startMatch(){
    if(!state.center||!state.radius)return;if(!els.player.value.trim()){toast('선수 이름을 입력해 주세요.');els.player.focus();return}
    state.shots=[];state.maxShots=Number(els.maxShots.value);state.matchId=uid();state.running=true;state.lastHit=0;state.candidate=null;state.candidateFrames=0;state.spotLatched=false;state.missingFrames=0;state.background=null;state.warmupFrames=0;state.detectorReady=false;
    els.player.disabled=true;els.maxShots.disabled=true;els.eventName.disabled=true;els.manualBtn.disabled=false;els.undoBtn.disabled=true;els.matchBtn.textContent='기준 화면 설정 중';els.matchBtn.disabled=true;els.guide.textContent='2초 동안 레이저를 쏘지 마세요 · 표적 기준 화면을 저장합니다.';els.livePill.textContent='● READY';setStatus('감지 준비','#ffc940');updateScore();drawOverlay();
  }

  function finishMatch(){state.running=false;els.livePill.textContent='● COMPLETE';els.guide.textContent='경기 완료 · 기록을 저장하고 있습니다.';els.manualBtn.disabled=true;setStatus('저장 중','#ffc940');saveMatch()}
  async function saveMatch(){
    const payload={matchId:state.matchId,eventName:els.eventName.value.trim(),player:els.player.value.trim(),maxShots:state.maxShots,totalScore:state.shots.reduce((a,s)=>a+s.score,0),device:navigator.userAgent,shots:state.shots};
    localStorage.setItem('laserMatchLast',JSON.stringify(payload));
    if(!isServerConfigured()){setStatus('기기에 저장됨');els.guide.textContent='Apps Script 주소가 설정되지 않아 이 기기에만 기록했습니다.';toast('index.html에 Apps Script 주소를 넣어 주세요.');return}
    try{
      const body=new URLSearchParams({action:'saveMatch',payload:JSON.stringify(payload)});
      await fetch(APPS_SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body});
      setStatus('저장 요청 완료');els.guide.textContent=`${state.shots.length}발 저장 요청 완료 · 순위표에서 확인하세요.`;toast('구글 시트에 저장 요청을 보냈습니다.');
    }catch(err){console.error(err);setStatus('기기 저장');els.guide.textContent='서버 저장 실패 · 기록은 이 기기에 보관했습니다.';toast('서버 연결에 실패했습니다.')}
  }

  function isServerConfigured(){return /^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(APPS_SCRIPT_URL)}

  function recordShot(x,y,manualScore=null){
    if(!state.running||state.shots.length>=state.maxShots)return;
    const dx=x==null?0:x-state.center.x,dy=y==null?0:y-state.center.y,nr=manualScore==null?Math.hypot(dx,dy)/state.radius:0;
    const score=manualScore==null?(nr>1?0:Math.max(1,10-Math.floor(nr*10))):Number(manualScore);
    const mmScale=80/state.radius;
    state.shots.push({score,screenX:x,screenY:y,xMm:+(dx*mmScale).toFixed(1),yMm:+(dy*mmScale).toFixed(1),normalizedRadius:+nr.toFixed(4),manual:manualScore!=null,time:new Date().toLocaleTimeString('ko-KR',{hour12:false})});
    state.lastHit=performance.now();showScore(score);updateScore();drawOverlay();els.undoBtn.disabled=false;
    if(state.shots.length>=state.maxShots)setTimeout(finishMatch,650)
  }

  function showScore(score){els.scorePop.textContent=score?String(score):'MISS';els.scorePop.classList.toggle('miss',!score);els.flash.classList.add('show');setTimeout(()=>els.flash.classList.remove('show'),420)}
  function updateScore(){const total=state.shots.reduce((a,s)=>a+s.score,0);els.totalScore.textContent=total;els.shotCount.textContent=state.shots.length;els.shotMax.textContent=state.running?state.maxShots:Number(els.maxShots.value);els.average.textContent=state.shots.length?(total/state.shots.length).toFixed(1):'0.0';els.shotGrid.innerHTML='';const count=state.running?state.maxShots:Number(els.maxShots.value);for(let i=0;i<count;i++){const d=document.createElement('div'),s=state.shots[i];d.className='shot'+(s?(s.score?' hit':' miss'):'');d.textContent=s?s.score:(i+1);els.shotGrid.appendChild(d)}}

  function processFrames(){
    cancelAnimationFrame(state.raf);
    const loop=()=>{state.raf=requestAnimationFrame(loop);if(!state.running||state.processing||els.video.readyState<2)return;state.processing=true;try{detectLaser()}finally{state.processing=false}};loop();
  }

  function detectLaser(){
    const vw=els.video.videoWidth,vh=els.video.videoHeight;if(!vw||!vh)return;
    const sw=320,sh=Math.max(180,Math.round(sw*vh/vw));els.work.width=sw;els.work.height=sh;wctx.drawImage(els.video,0,0,sw,sh);const data=wctx.getImageData(0,0,sw,sh).data,total=sw*sh,lum=new Uint8Array(total);
    for(let p=0,i=0;p<total;p++,i+=4)lum[p]=Math.round(data[i]*.299+data[i+1]*.587+data[i+2]*.114);
    if(!state.background||state.background.length!==total){state.background=new Float32Array(lum);state.warmupFrames=0;return}
    if(state.warmupFrames<45){for(let p=0;p<total;p++)state.background[p]=state.background[p]*.8+lum[p]*.2;state.warmupFrames++;if(state.warmupFrames===45){state.detectorReady=true;els.matchBtn.textContent='경기 진행 중';els.guide.textContent='자동 감지 준비 완료 · 표적을 향해 발사하세요.';els.livePill.textContent='● LIVE';setStatus('자동 감지 중','#ff4d66');toast('레이저 자동 감지가 시작되었습니다.')}return}
    const t=screenTargetToWork(sw,sh),x0=Math.max(1,Math.floor(t.x-t.r*1.12)),x1=Math.min(sw-2,Math.ceil(t.x+t.r*1.12)),y0=Math.max(1,Math.floor(t.y-t.r*1.12)),y1=Math.min(sh-2,Math.ceil(t.y+t.r*1.12));
    let count=0,sx=0,sy=0,weight=0;const deltaThreshold=Math.max(18,62-state.sensitivity*.42),color=els.laserColor.value;
    for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){if(Math.hypot(x-t.x,y-t.y)>t.r*1.12)continue;const p=y*sw+x,i=p*4,r=data[i],g=data[i+1],b=data[i+2],bright=Math.max(r,g,b),delta=lum[p]-state.background[p];if(delta<deltaThreshold||bright<135)continue;const colored=color==='red'?(r>g+14&&r>b+14):(g>r+12&&g>b+10),whiteCore=bright>242&&Math.min(r,g,b)>185;if(!colored&&!whiteCore)continue;const wt=delta+Math.max(0,bright-180)*.35;sx+=x*wt;sy+=y*wt;weight+=wt;count++}
    if(count<1||count>260){state.candidateFrames=0;state.missingFrames++;if(state.missingFrames>=3)state.spotLatched=false;const alpha=count>260?.18:.035;for(let p=0;p<total;p++)state.background[p]=state.background[p]*(1-alpha)+lum[p]*alpha;return}
    state.missingFrames=0;const px=sx/weight,py=sy/weight,mapped=videoToScreen(px/sw*vw,py/sh*vh),screenX=mapped.x,screenY=mapped.y;
    if(Math.hypot(screenX-state.center.x,screenY-state.center.y)>state.radius*1.15)return;
    if(state.spotLatched)return;
    if(state.candidate&&Math.hypot(screenX-state.candidate.x,screenY-state.candidate.y)<18)state.candidateFrames++;else{state.candidate={x:screenX,y:screenY};state.candidateFrames=1}
    if(state.candidateFrames>=2&&performance.now()-state.lastHit>450){recordShot(screenX,screenY);state.spotLatched=true;state.candidateFrames=0}
  }

  function undo(){if(!state.shots.length)return;state.shots.pop();state.running=true;els.manualBtn.disabled=false;els.matchBtn.textContent='경기 진행 중';els.undoBtn.disabled=!state.shots.length;els.guide.textContent='마지막 기록을 취소했습니다. 계속 사격하세요.';setStatus('경기 진행','#ff4d66');updateScore();drawOverlay()}
  function reset(){state.running=false;state.shots=[];state.matchId=null;state.spotLatched=false;state.missingFrames=0;state.background=null;state.detectorReady=false;els.player.disabled=false;els.maxShots.disabled=false;els.eventName.disabled=false;els.manualBtn.disabled=true;els.undoBtn.disabled=true;els.matchBtn.textContent='경기 시작';els.matchBtn.disabled=!(state.center&&state.radius);els.livePill.textContent=state.stream?'● CAMERA':'● OFF';els.guide.textContent=state.center?'새 선수를 입력하고 경기 시작을 누르세요.':'카메라 시작 후 표적을 자동 보정하세요.';setStatus('준비');updateScore();drawOverlay()}
  function loadLeaderboard(){
    els.leaderDialog.showModal();els.leaderList.className='empty';els.leaderList.textContent='기록을 불러오는 중입니다.';
    if(!isServerConfigured()){els.leaderList.textContent='index.html에 Apps Script /exec 주소를 먼저 넣어 주세요.';return}
    const callback='laserLeaderboard_'+Date.now();const script=document.createElement('script');const timer=setTimeout(()=>finish(new Error('시간 초과')),10000);
    function finish(error,rows){clearTimeout(timer);delete window[callback];script.remove();if(error){els.leaderList.className='empty';els.leaderList.textContent='순위표를 불러오지 못했습니다.';return}if(!rows.length){els.leaderList.className='empty';els.leaderList.textContent='아직 저장된 경기 기록이 없습니다.';return}els.leaderList.className='';els.leaderList.innerHTML=rows.map((r,i)=>`<div class="leader-row"><span class="rank">${i+1}</span><span>${escapeHtml(r.player)}</span><strong>${r.totalScore}점</strong><small>10점 ${r.tens}</small></div>`).join('')}
    window[callback]=rows=>finish(null,rows);script.onerror=()=>finish(new Error('network'));script.src=`${APPS_SCRIPT_URL}?action=leaderboard&eventName=${encodeURIComponent(els.eventName.value.trim())}&callback=${callback}&t=${Date.now()}`;document.head.appendChild(script);
  }
  function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}

  els.cameraBtn.onclick=startCamera;els.calibrateBtn.onclick=beginCalibration;els.matchBtn.onclick=startMatch;els.undoBtn.onclick=undo;els.resetBtn.onclick=reset;els.leaderBtn.onclick=loadLeaderboard;els.manualBtn.onclick=()=>els.manualDialog.showModal();els.manualConfirm.onclick=()=>{recordShot(null,null,els.manualScore.value);els.manualDialog.close()};els.maxShots.onchange=updateScore;
  els.sensitivityDown.onclick=()=>{state.sensitivity=Math.max(35,state.sensitivity-5);els.fpsPill.textContent='감도 '+state.sensitivity;toast('감도를 낮췄습니다.')};els.sensitivityUp.onclick=()=>{state.sensitivity=Math.min(95,state.sensitivity+5);els.fpsPill.textContent='감도 '+state.sensitivity;toast('감도를 높였습니다.')};
  window.addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>{if(document.hidden){state.candidate=null;state.candidateFrames=0}});updateScore();
})();
</script>
</body>
