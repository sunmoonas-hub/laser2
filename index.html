<body>
<main class="app">
  <section class="camera" id="cameraBox">
    <video id="video" playsinline muted></video>
    <canvas id="overlay" class="overlay"></canvas>
    <div class="camera-msg" id="cameraMsg"><b>카메라를 시작하세요</b><span>표적지가 화면 중앙에 오도록<br>휴대폰을 단단히 고정합니다.</span></div>
    <div class="hud"><span class="pill live" id="livePill">● OFF</span><span class="pill" id="fpsPill">레이저 감도 98</span></div>
    <div class="zoom-controls" aria-label="카메라 확대 축소">
      <button id="zoomOut" type="button" disabled aria-label="축소">−</button>
      <span id="zoomValue">1.0×</span>
      <button id="zoomIn" type="button" disabled aria-label="확대">＋</button>
    </div>
    <div class="guide" id="guide">① 카메라 시작 → ② 표적 자동 보정 → ③ 경기 시작</div>
    <div class="pill" id="clrPill" style="position:absolute;left:9px;bottom:9px;font-size:.66rem;opacity:.9">–</div>
    <div class="pill" id="liveStatus" style="position:absolute;left:9px;bottom:34px;font-size:.66rem;opacity:.9">📡 관전 연결 안 됨</div>
    <div class="flash" id="flash"><div class="score-pop" id="scorePop">10</div></div>
    <div class="countdown" id="countdown"><b id="countdownText">5</b></div>
  </section>

  <div class="side-panel" id="sidePanel">

  <section class="panel setup">
    <div class="mini-brand">
      <div class="brand"><div class="brand-mark"></div><h1>LASER MATCH</h1></div>
      <div class="status" id="status"><i class="dot"></i><span>준비</span></div>
      <button class="fullscreen-btn" id="fullscreenBtn" type="button" aria-label="전체화면 켜기">⛶</button>
    </div>
    <div class="grid">
      <div class="field"><label>사로 지정</label><select id="firingLane"><option value="1">1사로</option><option value="2">2사로</option><option value="3">3사로</option><option value="4">4사로</option><option value="5">5사로</option><option value="6">6사로</option><option value="7">7사로</option><option value="8">8사로</option></select></div>
    </div>
    <p class="hint" id="calibrationInfo">표적 보정 전입니다. 표적 전체가 화면에 보이도록 휴대폰을 정면으로 고정하세요.</p>
    <div class="field" style="display:none">
      <input id="eventName" value="교내 레이저 사격대회" maxlength="80">
      <input id="player" placeholder="선수 이름" maxlength="40">
      <select id="laserColor"><option value="red">빨간색</option><option value="green">초록색</option></select>
      <select id="detectKind"><option value="both" selected>레이저 + 물체·자국</option><option value="laser">레이저만</option><option value="object">물체·자국만</option></select>
      <select id="maxShots"><option>5</option><option selected>10</option><option>20</option></select>
    </div>
  </section>

  <div class="controls match-controls">
    <button class="btn" id="cameraBtn">카메라 시작</button>
    <button class="btn secondary" id="calibrateBtn" disabled>표적 자동 보정</button>
    <button class="btn wide" id="matchBtn" disabled>경기 시작</button>
  </div>

  <section class="panel scoreboard">
    <div class="metric"><small>총점</small><strong id="totalScore">0</strong></div>
    <div class="metric"><small>발수</small><strong><span id="shotCount">0</span>/<span id="shotMax">10</span></strong></div>
    <div class="metric"><small>평균</small><strong id="average">0.0</strong></div>
  </section>

  <div style="display:none">
    <button id="manualBtn">수동 명중 입력</button>
    <button id="undoBtn">마지막 발 취소</button>
    <div class="shot-grid" id="shotGrid"></div>
    <button id="sensitivityDown">감도−</button>
    <button id="sensitivityUp">감도＋</button>
    <button id="leaderBtn">순위표</button>
    <button id="resetBtn">새 경기</button>
  </div>
  </div>
</main>

<dialog id="leaderDialog"><div class="modal"><h3>🏆 경기 순위표</h3><div id="leaderList" class="empty">기록을 불러오는 중입니다.</div><div class="footer-actions"><button class="btn secondary" onclick="leaderDialog.close()">닫기</button></div></div></dialog>
<dialog id="manualDialog"><div class="modal"><h3>수동 점수 입력</h3><div class="field"><label>심판 판정 점수</label><select id="manualScore"><option value="10">10점</option><option value="9">9점</option><option value="8">8점</option><option value="7">7점</option><option value="6">6점</option><option value="5">5점</option><option value="4">4점</option><option value="3">3점</option><option value="2">2점</option><option value="1">1점</option><option value="0">0점 / 표적 밖</option></select></div><div class="footer-actions"><button class="btn secondary" onclick="manualDialog.close()">취소</button><button class="btn" id="manualConfirm">기록</button></div></div></dialog>
<div class="toast" id="toast"></div>
<canvas id="work" hidden></canvas>

<script>
(() => {
  'use strict';
  // Apps Script를 웹 앱으로 배포한 뒤 아래 따옴표 안에 /exec 주소를 넣으세요.
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyZrVEhkDw7Q4DEjA_uKP-eJrINC7mJ5LrwkP8QOBQV1gBRqGFD-ScU7r6ipQ-QyjEz9Q/exec';
  const $ = id => document.getElementById(id);
  const els = Object.fromEntries(['video','overlay','work','cameraMsg','cameraBtn','calibrateBtn','matchBtn','manualBtn','undoBtn','guide','livePill','fpsPill','zoomOut','zoomIn','zoomValue','flash','scorePop','clrPill','liveStatus','eventName','player','firingLane','laserColor','detectKind','maxShots','totalScore','shotCount','shotMax','average','shotGrid','calibrationInfo','leaderBtn','leaderDialog','leaderList','manualDialog','manualScore','manualConfirm','resetBtn','sensitivityDown','sensitivityUp','toast','status','fullscreenBtn','countdown','countdownText'].map(id => [id,$(id)]));
  // 느슨한 기준의 '보조 경로'. 밝은 환경 오인식의 주범이라 기본은 끈다. 아주 어두운 곳에서 약한 레이저를 놓치면 true로.
  const USE_FALLBACK = false;
  // 진짜 레이저는 짧게 번쩍이고 사라진다. 이 시간(ms)보다 오래 켜져 있는 빛은 조명·그림자 같은 장면 변화로 보고 버린다.
  const LASER_MAX_MS = 400;
  // 레이저 분석용으로 줄인 화면의 가로 픽셀 수. 클수록 정밀하지만 느려진다.
  // 진단 결과 480에서는 한 장 분석에 약 49ms가 걸려(카메라는 33ms마다 한 장) 사진의 1/3을 건너뛰었다. 그래서 400으로 낮춘다.
  // 사대 화면 오른쪽 위 '분석 ○○%'가 95% 이상이면 충분히 빠른 것이다.
  const ANALYSIS_WIDTH = 400;
  // 진단 기록: 레이저 후보가 생길 때마다(기록/거부 모두) 구글 시트 '진단기록' 탭에 한 줄씩 저장한다. 조정이 끝나면 false로.
  const DIAG = true;
  const ctx = els.overlay.getContext('2d');
  const wctx = els.work.getContext('2d',{willReadFrequently:true});
  const state = {stream:null,videoTrack:null,running:false,calibrationMode:0,center:null,radius:0,radiusX:0,radiusY:0,targetAngle:0,targetVideo:null,shots:[],maxShots:10,matchId:null,lastHit:0,candidate:null,candidateFrames:0,spotLatched:false,missingFrames:0,sensitivity:98,raf:0,frameLoopToken:0,processing:false,background:null,backgroundR:null,backgroundG:null,backgroundB:null,prevLum:null,pendingLaser:null,haloCandidate:null,laserBlocked:false,releaseFrames:0,stableFrames:0,warmupFrames:0,detectorReady:false,autoCalibrating:false,zoom:1,zoomMin:1,zoomMax:1,zoomStep:.1,actualFps:0,detectKind:'both',objRef:null,objTracks:[],objKnown:[],objBusy:false,objBusySince:0,objMask:null,objDil:null,objTmp:null,objSeen:null,objStack:null,dbgTick:0,workSH:null,paperMultiple:null,countdownSec:5,countdownEnd:0,settleMs:700,readyAt:0,announced:false,bgRoi:null};

  /* ===== [R40에서 이식] 동심원 표적 자동 인식 =====
     검은 중심부 후보를 여러 임계값으로 모두 모은 뒤, 각 후보 중심에서 바깥으로 링 선(어두운 선)을 찾아
     10등분 간격에 맞는지 검사한다. 가장 바깥 원은 반드시 화면에서 실제로 관찰되어야 한다(비율로 추정하지 않음). */
  function findConcentricTarget(rgba,w,h) {
    const n=w*h,gray=new Float32Array(n),hist=new Uint32Array(256);
    for(let p=0;p<n;p++){const k=p*4,v=Math.round(.299*rgba[k]+.587*rgba[k+1]+.114*rgba[k+2]);gray[p]=v;hist[v]++;}
    let mean=0;for(let i=0;i<256;i++)mean+=hist[i]*i;mean/=n;
    const at=(x,y)=>{if(x<1||y<1||x>=w-2||y>=h-2)return NaN;const ix=x|0,iy=y|0,fx=x-ix,fy=y-iy,p=iy*w+ix;return (gray[p]*(1-fx)+gray[p+1]*fx)*(1-fy)+(gray[p+w]*(1-fx)+gray[p+w+1]*fx)*fy;};
    const smooth=new Float32Array(n),integral=new Float64Array((w+1)*(h+1));
    for(let y=0;y<h;y++){let row=0;for(let x=0;x<w;x++){row+=gray[y*w+x];integral[(y+1)*(w+1)+x+1]=integral[y*(w+1)+x+1]+row;}}
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){const x0=Math.max(0,x-2),x1=Math.min(w,x+3),y0=Math.max(0,y-2),y1=Math.min(h,y+3);smooth[y*w+x]=(integral[y1*(w+1)+x1]-integral[y0*(w+1)+x1]-integral[y1*(w+1)+x0]+integral[y0*(w+1)+x0])/((x1-x0)*(y1-y0));}
    const candidates=[],seen=new Uint8Array(n),queue=new Int32Array(n);
    // All thresholds contribute candidates; a first dark label must not hide the target.
    for(const threshold of [...new Set([mean*.48,mean*.65,mean*.8,mean-18].map(v=>Math.round(Math.max(20,Math.min(190,v)))))]){
      seen.fill(0);
      for(let sy=2;sy<h-2;sy+=2)for(let sx=2;sx<w-2;sx+=2){const start=sy*w+sx;if(seen[start]||smooth[start]>=threshold)continue;

  async function startCamera(){

      // 낡은(어쩌면 지금 화면과 안 맞는) 보정 상태 때문에 미리 와있던 원격 명령이 갑자기 실행되는 일이 없다.

  async function setupCameraZoom(){
    const track=state.videoTrack;if(!track)return;
    let caps={},settings={};try{caps=track.getCapabilities?track.getCapabilities():{};settings=track.getSettings?track.getSettings():{};state.actualFps=Number(settings.frameRate)||0}catch(e){console.warn(e)}
    const advanced=[];if(Array.isArray(caps.focusMode)&&caps.focusMode.includes('continuous'))advanced.push({focusMode:'continuous'});if(Array.isArray(caps.exposureMode)&&caps.exposureMode.includes('continuous'))advanced.push({exposureMode:'continuous'});if(caps.exposureCompensation&&Number.isFinite(caps.exposureCompensation.min)&&Number.isFinite(caps.exposureCompensation.max)){
      // 레이저히트 앱과 실제 촬영본을 비교해보니, 노출을 살짝만 낮추는 정도로는 부족했다(표적 검정부 밝기가 약 2배 차이).
      // 지원 범위의 어두운 쪽(최소값에서 15%만 올라온 지점)까지 적극적으로 낮춰서, 레이저가 하얗게 포화되기 전 여유를 더 확보한다.
      const min=caps.exposureCompensation.min,max=caps.exposureCompensation.max;
      const exposure=Math.max(min,Math.min(max,min+(max-min)*.15));
      advanced.push({exposureCompensation:exposure});
    }if(advanced.length){try{await track.applyConstraints({advanced})}catch(e){console.warn('camera tuning skipped',e)}}if(caps.frameRate&&Number.isFinite(caps.frameRate.max)){try{await track.applyConstraints({frameRate:{ideal:Math.min(60,caps.frameRate.max),min:Math.min(30,caps.frameRate.max)}})}catch(e){console.warn('high fps skipped',e)}settings=track.getSettings?track.getSettings():settings;state.actualFps=Number(settings.frameRate)||state.actualFps}
    if(caps.zoom&&Number.isFinite(caps.zoom.min)&&Number.isFinite(caps.zoom.max)&&caps.zoom.max>caps.zoom.min){
      state.zoomMin=Number(caps.zoom.min);state.zoomMax=Number(caps.zoom.max);state.zoomStep=Math.max(.1,Number(caps.zoom.step)||.1);state.zoom=Math.min(state.zoomMax,Math.max(state.zoomMin,Number(settings.zoom)||state.zoomMin));els.zoomOut.disabled=false;els.zoomIn.disabled=false;updateZoomUI();
    }else{state.zoom=1;state.zoomMin=1;state.zoomMax=1;els.zoomOut.disabled=true;els.zoomIn.disabled=true;els.zoomValue.textContent='미지원'}

  }

  /* 경기 중에는 노출·화이트밸런스·초점을 지금 값으로 고정한다. 밝은 곳에서는 자동 노출이 계속 미세하게 움직여
     인쇄물 전체가 조금씩 밝아졌다 어두워졌다 하는데, 이게 레이저로 오인되는 큰 원인이다. (지원하는 기기에서만 동작) */
  async function lockCamera(lock){
    const track=state.videoTrack;if(!track||!track.getCapabilities)return;
    try{
      const caps=track.getCapabilities(),s=track.getSettings?track.getSettings():{},adv=[];
      const has=(k,v)=>Array.isArray(caps[k])&&caps[k].includes(v);
      if(lock){
        if(has('exposureMode','manual')&&Number.isFinite(s.exposureTime))adv.push({exposureMode:'manual',exposureTime:s.exposureTime});
        if(has('whiteBalanceMode','manual')&&Number.isFinite(s.colorTemperature))adv.push({whiteBalanceMode:'manual',colorTemperature:s.colorTemperature});
        if(has('focusMode','manual')&&Number.isFinite(s.focusDistance))adv.push({focusMode:'manual',focusDistance:s.focusDistance});
      }else{
        if(has('exposureMode','continuous'))adv.push({exposureMode:'continuous'});
        if(has('whiteBalanceMode','continuous'))adv.push({whiteBalanceMode:'continuous'});
        if(has('focusMode','continuous'))adv.push({focusMode:'continuous'});
      }
      if(adv.length)await track.applyConstraints({advanced:adv});
      state.cameraLocked=!!(lock&&adv.length);showDetectorInfo();
    }catch(e){console.warn('camera lock skipped',e);state.cameraLocked=false}
  }

  async function beginCalibration(){

    state.running=false;state.center=null;state.radius=state.radiusX=state.radiusY=0;state.targetAngle=0;state.targetVideo=null;state.paperMultiple=null;state.shots=[];state.calibrationMode=0;clearDetectorBackground();updateScore();drawOverlay();

    // 짧은 간격을 두고 몇 번 더 시도해서 그사이 안정된 화면으로 다시 인식을 시도한다.

      setStatus('인식 실패','#ff4d66');toast('표적을 더 크게, 정면으로 맞춘 뒤 표적 자동 보정을 다시 눌러 주세요.');

  function videoGeometry(){
    const vw=els.video.videoWidth,vh=els.video.videoHeight,box=els.overlay.getBoundingClientRect();
    const scale=Math.max(box.width/vw,box.height/vh);   // cover: 화면을 꽉 채우고(잘림 있음), contain이면 Math.min

  function videoToScreen(vx,vy){const g=videoGeometry();return{x:g.offX+vx*g.scale,y:g.offY+vy*g.scale,scale:g.scale}}

  }

  // [R40에서 이식] 긴 변 640px로 줄인 화면에서 동심원 표적을 찾아 화면 좌표로 변환한다.
  function detectTarget(){
    const vw=els.video.videoWidth,vh=els.video.videoHeight;if(!vw||!vh)return null;
    const scale=Math.min(1,640/Math.max(vw,vh)),sw=Math.round(vw*scale),sh=Math.round(vh*scale);
    els.work.width=sw;els.work.height=sh;wctx.drawImage(els.video,0,0,sw,sh);
    const found=findConcentricTarget(wctx.getImageData(0,0,sw,sh).data,sw,sh);if(!found)return null;
    const mapped=videoToScreen(found.x*vw/sw,found.y*vh/sh);

  }

  function canvasPoint(ev){const r=els.overlay.getBoundingClientRect();return{x:ev.clientX-r.left,y:ev.clientY-r.top}}
  function drawOverlay(){
    const width=els.overlay.clientWidth,height=els.overlay.clientHeight;ctx.clearRect(0,0,width,height);
    if(!state.center)return;
    ctx.save();ctx.lineWidth=1.2;
    if(state.radius){ctx.translate(state.center.x,state.center.y);ctx.rotate(state.targetAngle);for(let i=10;i>=1;i--){ctx.beginPath();ctx.ellipse(0,0,state.radiusX*i/10,state.radiusY*i/10,0,0,Math.PI*2);ctx.strokeStyle=i===10?'#29e7d6cc':'#ffffff55';ctx.stroke()}ctx.rotate(-state.targetAngle);ctx.translate(-state.center.x,-state.center.y)}

    state.shots.forEach((s,i)=>{if(s.manual||s.screenX==null)return;let px=s.screenX,py=s.screenY;if(Number.isFinite(s.videoX)&&Number.isFinite(s.videoY)){const g=videoGeometry(),mapped=videoToScreen(s.videoX*g.vw,s.videoY*g.vh);px=mapped.x;py=mapped.y}s.screenX=px;s.screenY=py;ctx.beginPath();if(s.kind==='object'){ctx.moveTo(px,py-11);ctx.lineTo(px+11,py);ctx.lineTo(px,py+11);ctx.lineTo(px-11,py);ctx.closePath()}else ctx.arc(px,py,9,0,Math.PI*2);ctx.fillStyle=s.score?'#b7ff3c':'#ff4d66';ctx.fill();ctx.fillStyle='#07111f';ctx.font='bold 10px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(String(i+1),px,py)});ctx.restore();
  }

  /* 경기 시작 카운트다운(5,4,3,2,1 → 사격 시작). 그동안 기준 화면을 잡고, 끝나기 전에 쏜 레이저는 인식하지 않는다. */
  let countdownTimer=0,goTimer=0;
  function clearCountdown(){clearInterval(countdownTimer);clearTimeout(goTimer);countdownTimer=0;goTimer=0;state.countdownEnd=0;els.countdown.classList.remove('show')}
  function startCountdown(){
    clearCountdown();
    if(!(state.countdownSec>0))return;

  }

  }

  function startMatch(){

    state.shots=[];state.maxShots=Number(els.maxShots.value);state.matchId=uid();state.running=true;state.lastHit=0;state.candidate=null;state.candidateFrames=0;state.spotLatched=false;state.missingFrames=0;clearDetectorBackground();state.warmupFrames=0;state.warmupStart=performance.now();state.detectorReady=false;state.readyAt=0;state.announced=false;state.bgRoi=null;

    // 그 자리가 표적지 경계로 저장돼 스캔 범위가 잘못 좁아질 수 있어 여기서 확실히 종료한다.
    if(state.calibrationMode===3)state.calibrationMode=0;
    els.player.disabled=true;els.maxShots.disabled=true;els.eventName.disabled=true;els.detectKind.disabled=true;els.manualBtn.disabled=false;els.undoBtn.disabled=true;els.matchBtn.textContent='기준 화면 설정 중';els.matchBtn.disabled=true;els.guide.textContent=`${els.firingLane.value}사로 · 2초 동안 레이저를 쏘지 마세요`;els.livePill.textContent='● READY';setStatus('감지 준비','#ffc940');updateScore();drawOverlay();pushLive(true);lockCamera(true);startCountdown();
    document.body.classList.add('match-live');setTimeout(resize,60);

  }

  function finishMatch(){clearCountdown();lockCamera(false);state.running=false;els.livePill.textContent='● COMPLETE';els.guide.textContent='경기 완료 · 기록을 저장하고 있습니다.';els.manualBtn.disabled=true;setStatus('저장 중','#ffc940');document.body.classList.remove('match-live');setTimeout(resize,60);pushLive(true);saveMatch()}
  async function saveMatch(){
    const payload={matchId:state.matchId,eventName:els.eventName.value.trim(),player:els.player.value.trim(),firingLane:Number(els.firingLane.value),maxShots:state.maxShots,totalScore:state.shots.reduce((a,s)=>a+s.score,0),device:navigator.userAgent,shots:state.shots};

  }

  function isServerConfigured(){return /^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(APPS_SCRIPT_URL)}

  let lastPush=0;

    els.liveStatus.textContent='📡 전송 중…';

      const cbName='pushCb_'+now+'_'+Math.random().toString(36).slice(2,7);

        eventName:els.eventName.value.trim(),player:els.player.value.trim(),firingLane:Number(els.firingLane.value),
        maxShots:state.maxShots||Number(els.maxShots.value),running:state.running,

          if(s.screenX!=null&&s.screenY!=null&&state.radiusX&&state.radiusY){u=(s.screenX-state.center.x)/state.radiusX;v=(s.screenY-state.center.y)/state.radiusY}
          return{score:s.score,u:+u.toFixed(3),v:+v.toFixed(3),kind:s.manual?'manual':(s.kind||'laser')};
        })
      })});
      // 눈에 안 보이는 fetch() 요청만 걸러내는 환경이 있어, 순위표·관전 페이지가 이미 쓰고 있는
      // <script> 태그 삽입(JSONP) 방식으로 통일한다 - 이건 확실히 통과한다.
      const script=document.createElement('script');
      const timer=setTimeout(()=>{els.liveStatus.textContent='📡 응답 없음(시간 초과)';cleanup()},9000);
      function cleanup(){clearTimeout(timer);window[cbName]=function(){};script.remove()}
      window[cbName]=()=>{els.liveStatus.textContent='📡 전송됨 '+new Date().toLocaleTimeString('ko-KR',{hour12:false});cleanup()};
      script.onerror=()=>{els.liveStatus.textContent='📡 전송 실패(네트워크 차단)';cleanup()};

  }

  /* ===== 진단 기록 =====
     후보마다 한 줄씩 모아 두었다가 3초마다 최대 10줄씩 Apps Script로 보내 '진단기록' 시트에 쌓는다. */
  const diagSession=uid(),diagQueue=[];let diagBusy=false;
  const r1=v=>v==null||!Number.isFinite(v)?'':Math.round(v*10)/10;
  function diagPush(row){
    if(!DIAG||!isServerConfigured())return;
    let exposure='';try{const st=state.videoTrack&&state.videoTrack.getSettings?state.videoTrack.getSettings():{};if(Number.isFinite(st.exposureTime))exposure=st.exposureTime}catch(e){}
    const d=new Date();
    diagQueue.push(Object.assign({
      t:d.toLocaleTimeString('ko-KR',{hour12:false})+'.'+String(d.getMilliseconds()).padStart(3,'0'),
      session:diagSession,lane:Number(els.firingLane.value),player:els.player.value.trim(),
      ambient:r1(state.lastAmbient),exposure,locked:state.cameraLocked?'Y':'N',fps:r1(state.actualFps)
    },row,{margin:r1(row.margin),meanD:r1(row.meanD),stdD:r1(row.stdD)}));
    if(diagQueue.length>300)diagQueue.splice(0,diagQueue.length-300);
  }
  function diagCand(c,verdict,reason,pos){
    if(!DIAG)return;
    if(!pos){const d=c.dims;pos=workToTarget(c.x,c.y,d.sw,d.sh,d.vw,d.vh)}
    diagPush({kind:'후보',verdict,reason,ring:pos.ring,nr:r1(pos.nr*100)/100,u:Math.round(pos.u*100)/100,v:Math.round(pos.v*100)/100,
      dr:r1(c.mag),thr:r1(c.thr),margin:c.mag-c.thr,onset:r1(c.onset),near:c.near,dur:Math.round(c.lastSeen-c.t0),frames:c.frames,
      noise:r1(c.noise),meanD:c.meanD,stdD:c.stdD,bright:r1(c.bright),span:c.span||''});
  }
  /* 놓침 진단: 레이저처럼 '갑자기 나타난' 빛이 첫 관문(밝기·색·켜짐 조건)에서 떨어졌을 때 한 줄 남긴다.
     예전에는 첫 관문에서 떨어지면 기록이 전혀 안 남아서, 쏜 레이저를 왜 놓쳤는지 알 수 없었다. */
  function diagMiss(m,reason,dims,extra){
    if(!DIAG||!m)return;
    const pos=workToTarget(m.x,m.y,dims.sw,dims.sh,dims.vw,dims.vh);
    diagPush(Object.assign({kind:'놓침후보',verdict:'탈락',reason,ring:pos.ring,nr:r1(pos.nr*100)/100,u:Math.round(pos.u*100)/100,v:Math.round(pos.v*100)/100,
      dr:r1(m.mag),dg:r1(m.dg),db:r1(m.db),thr:r1(m.thr),margin:m.mag-m.thr,onset:r1(m.onset),noise:r1(m.noise),bright:r1(m.bright)},extra||{}));
  }
  function diagFlush(){
    if(diagBusy||!diagQueue.length||!isServerConfigured())return;
    diagBusy=true;const rows=diagQueue.splice(0,10);
    const cb='diagCb_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),script=document.createElement('script');
    const fail=()=>{diagQueue.unshift(...rows);done()};
    const timer=setTimeout(fail,9000);
    function done(){clearTimeout(timer);window[cb]=function(){};script.remove();diagBusy=false}
    window[cb]=res=>{if(res&&res.ok)done();else fail()};
    script.onerror=fail;
    script.src=`${APPS_SCRIPT_URL}?${new URLSearchParams({action:'diag',callback:cb,payload:JSON.stringify(rows)}).toString()}`;
    document.head.appendChild(script);
  }
  if(DIAG)setInterval(diagFlush,3000);

  /* ===== 원격 명령 수신 (사로별) =====
     폰은 자기 사로(firingLane)의 신호만 가져온다. 시작·취소·종료를 한 번의 요청으로 함께 확인한다. */
  let lastCmdId=null,lastNotifiedCmdId=null,remotePollOn=false;
  let lastUndoId=null,lastEndId=null,pollLane=null;
  const REMOTE_POLL_MS=900;
  const CMD_MAX_AGE_MS=30000;   // 30초보다 오래된 시작 명령은 실행하지 않는다(예전 명령이 갑자기 실행되는 사고 방지)
  function applyRemoteCmd(cmd){
    if(cmd.cmdId===lastCmdId)return;   // 이미 처리한 명령
    if(Number(els.firingLane.value)!==cmd.firingLane)return;   // 다른 사로의 명령(정상이라면 오지 않음)
    if(Number.isFinite(cmd.ageMs)&&cmd.ageMs>CMD_MAX_AGE_MS){lastCmdId=cmd.cmdId;return}   // 너무 오래된 명령은 조용히 소비
    // 아직 표적 보정 전이면 명령을 소비만 하고 끝낸다 - 보정 후 라이브에서 다시 눌러야 한다.
    if(!(state.center&&state.radius)){
      lastCmdId=cmd.cmdId;
      toast(`📡 ${cmd.firingLane}사로 명령을 받았지만 아직 표적 보정 전이에요 - 보정 후 라이브에서 다시 눌러주세요.`);
      return;
    }
    if(state.running)return;
    // 보정 직후 3초 안에는 시작하지 않는다 - 보정 결과를 눈으로 확인할 시간을 보장.
    if(state.calibratedAt&&performance.now()-state.calibratedAt<3000){
      lastCmdId=cmd.cmdId;
      toast(`📡 ${cmd.firingLane}사로 명령을 받았지만 방금 보정이 끝나서 안전을 위해 대기 중이에요 - 라이브에서 다시 눌러주세요.`);
      return;
    }
    if(cmd.eventName!=null&&cmd.eventName!=='')els.eventName.value=cmd.eventName;
    if(cmd.player)els.player.value=cmd.player;
    if(cmd.laserColor&&cmd.laserColor!==els.laserColor.value){els.laserColor.value=cmd.laserColor;clearDetectorBackground();showDetectorInfo()}
    if(cmd.detectKind)els.detectKind.value=cmd.detectKind;
    if(cmd.maxShots){els.maxShots.value=String(cmd.maxShots);updateScore()}
    startMatch();lastCmdId=cmd.cmdId;els.firingLane.disabled=true;
    toast(`📡 ${cmd.firingLane}사로 연결됨 - 경기를 시작했어요: `+(cmd.player||''));
  }
  function handlePoll(res,lane){
    if(!res||res.ok===false)return;
    // 사로를 바꾸면, 새 사로에 이미 남아 있던 취소·종료 신호는 과거 것이므로 무시하고 지금 값을 새 기준으로 삼는다.
    if(lane!==pollLane){pollLane=lane;lastUndoId=null;lastEndId=null}
    // 종료 신호
    if(lastEndId===null)lastEndId=res.endId||'';
    else if(res.endId&&res.endId!==lastEndId){
      lastEndId=res.endId;
      reset();pushLive(true);toast('📡 라이브에서 경기를 종료했어요 - 탄착군·점수가 초기화됐어요.');
    }
    // 마지막 발 취소 신호
    if(lastUndoId===null)lastUndoId=res.undoId||'';
    else if(res.undoId&&res.undoId!==lastUndoId){
      lastUndoId=res.undoId;
      if(state.shots.length){undo();toast('📡 라이브에서 마지막 발을 취소했어요.')}
    }
    // 시작 명령(사격 중에는 확인하지 않음)
    if(!state.running&&res.cmd&&res.cmd.cmdId)applyRemoteCmd(res.cmd);
  }
  function pollRemote(){
    if(!isServerConfigured()){setTimeout(pollRemote,3000);return}
    els.firingLane.disabled=!!state.running;   // 사격 중에는 사로를 못 바꾸게 잠근다
    const lane=Number(els.firingLane.value);
    const cbName='pollCb_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
    const script=document.createElement('script');
    let done=false;
    const timer=setTimeout(()=>finish(null),6000);
    function finish(res){
      if(done)return;done=true;
      clearTimeout(timer);window[cbName]=function(){};script.remove();
      if(res&&lane===Number(els.firingLane.value))handlePoll(res,lane);   // 그사이 사로가 바뀌었으면 버린다
      setTimeout(pollRemote,REMOTE_POLL_MS);
    }
    window[cbName]=res=>finish(res);
    script.onerror=()=>finish(null);
    script.src=`${APPS_SCRIPT_URL}?action=phonePoll&lane=${lane}&callback=${cbName}&t=${Date.now()}`;
    document.head.appendChild(script);
  }
  function ensureRemotePolling(){if(remotePollOn)return;remotePollOn=true;pollRemote()}
  // 경기 중에는 15초마다 현재 상태를 다시 보내 "이 사로는 아직 사격 중"임을 알린다.
  // (관전 화면은 60초 넘게 소식이 없으면 연결이 끊긴 것으로 보고 시작 버튼 잠금을 푼다.)
  setInterval(()=>{if(state.running)pushLive(true)},15000);

  function recordShot(x,y,manualScore=null,kind){
    if(!state.running||state.shots.length>=state.maxShots)return;
    const dx=x==null?0:x-state.center.x,dy=y==null?0:y-state.center.y,ca=Math.cos(state.targetAngle),sa=Math.sin(state.targetAngle),ex=dx*ca+dy*sa,ey=-dx*sa+dy*ca,nr=manualScore==null?Math.hypot(ex/state.radiusX,ey/state.radiusY):0;
    // 실제 사격 채점 규칙처럼, 링 경계선에 걸치면 더 높은 점수로 인정한다.
    // (경계선(예: 10점/9점 사이)에서 살짝 안쪽으로 기운 만큼은 위쪽 점수로 쳐준다)
    const ringPos=nr*10,score=manualScore==null?(nr>1.015?0:Math.min(10,Math.max(1,10-Math.floor(ringPos-.15)))):Number(manualScore);
    const xMm=ex/state.radiusX*80,yMm=ey/state.radiusY*80;
    let videoX=null,videoY=null;if(x!=null&&y!=null){const g=videoGeometry();videoX=((x-g.offX)/g.scale)/g.vw;videoY=((y-g.offY)/g.scale)/g.vh}
    const k=manualScore!=null?'manual':(kind||'laser');
    state.shots.push({score,screenX:x,screenY:y,videoX,videoY,xMm:+xMm.toFixed(1),yMm:+yMm.toFixed(1),normalizedRadius:+nr.toFixed(4),manual:manualScore!=null,kind:k,time:new Date().toLocaleTimeString('ko-KR',{hour12:false})});
    state.lastHit=performance.now();showScore(score);updateScore();drawOverlay();els.undoBtn.disabled=false;pushLive(true);
    if(state.shots.length>=state.maxShots)setTimeout(finishMatch,650)
  }

  function showScore(score){els.scorePop.textContent=score?String(score):'MISS';els.scorePop.classList.toggle('miss',!score);els.flash.classList.add('show');setTimeout(()=>els.flash.classList.remove('show'),420)}
  function updateScore(){const total=state.shots.reduce((a,s)=>a+s.score,0);els.totalScore.textContent=total;els.shotCount.textContent=state.shots.length;els.shotMax.textContent=state.running?state.maxShots:Number(els.maxShots.value);els.average.textContent=state.shots.length?(total/state.shots.length).toFixed(1):'0.0';els.shotGrid.innerHTML='';const count=state.running?state.maxShots:Number(els.maxShots.value);for(let i=0;i<count;i++){const d=document.createElement('div'),s=state.shots[i];d.className='shot'+(s?(s.score?' hit':' miss'):'')+(s&&s.kind==='object'?' obj':'');d.textContent=s?s.score:(i+1);els.shotGrid.appendChild(d)}}

  function processFrames(){
    cancelAnimationFrame(state.raf);const token=++state.frameLoopToken;
    /* 성능 측정: 분석이 카메라 속도를 못 따라가면 그사이 들어온 프레임은 아예 분석되지 않는다.
       레이저는 보통 한 프레임에만 찍히므로, 건너뛴 프레임에 찍힌 레이저는 흔적 없이 사라진다. */
    const loop=(now,meta)=>{if(token!==state.frameLoopToken)return;
      const pf=state.perf||(state.perf={n:0,sum:0,max:0,skipped:0,frames:0});
      if(meta&&Number.isFinite(meta.presentedFrames)){
        if(state.running&&state.detectorReady&&state.lastPF!=null){const d=meta.presentedFrames-state.lastPF;if(d>0){pf.frames+=d;if(d>1)pf.skipped+=d-1}}
        state.lastPF=meta.presentedFrames;
      }
      if(state.running&&!state.processing&&els.video.readyState>=2){state.processing=true;const t0=performance.now();try{detectLaser()}finally{state.processing=false;if(state.detectorReady){const dt=performance.now()-t0;pf.n++;pf.sum+=dt;if(dt>pf.max)pf.max=dt}}}
      schedule()};
    const schedule=()=>{if(token!==state.frameLoopToken)return;if(typeof els.video.requestVideoFrameCallback==='function')els.video.requestVideoFrameCallback(loop);else state.raf=requestAnimationFrame(loop)};schedule();
  }

  /* 기준 사진(경기 시작 순간의 표적 화면)과 비교해 다트·화살·스티커·구멍처럼 새로 생겨서 가만히 있는 것을 찾는다. */
  function detectObjectPass(data,total,sw,sh,vw,vh,t,insideScan){
    if(!state.objRef||state.objRef.length!==total*3)return;
    if(!state.objMask||state.objMask.length!==total){state.objMask=new Uint8Array(total);state.objDil=new Uint8Array(total);state.objTmp=new Uint8Array(total);state.objSeen=new Uint8Array(total);state.objStack=new Int32Array(total)}
    const R=state.objRef,M=state.objMask,rMax=Math.max(t.rx,t.ry)*1.15;
    const x0=Math.max(1,Math.floor(t.x-rMax)),x1=Math.min(sw-2,Math.ceil(t.x+rMax)),y0=Math.max(1,Math.floor(t.y-rMax)),y1=Math.min(sh-2,Math.ceil(t.y+rMax));
    const objThr=Math.max(30,130-state.sensitivity*.95);
    let sr=0,sg=0,sb=0,cnt=0;
    for(let y=y0;y<=y1;y+=3)for(let x=x0;x<=x1;x+=3){
      if(!insideScan(x,y,1.15))continue;
      const p=y*sw+x,k=p*3,i=p*4;
      let a=data[i]-R[k],b=data[i+1]-R[k+1],c=data[i+2]-R[k+2];
      a=a>40?40:a<-40?-40:a;b=b>40?40:b<-40?-40:b;c=c>40?40:c<-40?-40:c;

    }
    if(!cnt)return;sr/=cnt;sg/=cnt;sb/=cnt;
    let changed=0,roiN=0;M.fill(0);
    for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
      if(!insideScan(x,y,1.15))continue;roiN++;
      const p=y*sw+x,k=p*3,i=p*4;
      let a=data[i]-R[k]-sr,b=data[i+1]-R[k+1]-sg,c=data[i+2]-R[k+2]-sb;
      if(a<0)a=-a;if(b<0)b=-b;if(c<0)c=-c;

    }
    const frac=changed/Math.max(1,roiN),now=performance.now();
    if(frac>.10){
      if(!state.objBusySince)state.objBusySince=now;
      state.objTracks=[];
      if(now-state.objBusySince>2500){for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const p=y*sw+x,k=p*3,i=p*4;R[k]=data[i];R[k+1]=data[i+1];R[k+2]=data[i+2]}state.objBusySince=0}
      if(!state.objBusy){state.objBusy=true;els.guide.textContent='화면이 크게 바뀌었어요(손 등) · 표적에서 손을 떼 주세요'}
      return;
    }
    if(state.objBusy){state.objBusy=false;if(state.running)els.guide.textContent='레이저 감지 대기 중 · 짧게 발사하세요.'}
    state.objBusySince=0;
    const D=state.objDil,Tm=state.objTmp,seen=state.objSeen,stack=state.objStack;
    Tm.fill(0);D.fill(0);seen.fill(0);
    for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const p=y*sw+x;Tm[p]=M[p]|(x>x0&&M[p-1])|(x>x0+1&&M[p-2])|(x<x1&&M[p+1])|(x<x1-1&&M[p+2])}
    for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const p=y*sw+x;D[p]=Tm[p]|(y>y0&&Tm[p-sw])|(y>y0+1&&Tm[p-2*sw])|(y<y1&&Tm[p+sw])|(y<y1-1&&Tm[p+2*sw])}
    const blobs=[],areaUnit=rMax*rMax,minArea=Math.max(9,Math.round(areaUnit*.0015)),maxArea=Math.round(areaUnit*.35);
    for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
      const s0=y*sw+x;if(!D[s0]||seen[s0])continue;

        if(px>x0&&D[p-1]&&!seen[p-1]){seen[p-1]=1;stack[sp++]=p-1}
        if(px<x1&&D[p+1]&&!seen[p+1]){seen[p+1]=1;stack[sp++]=p+1}

      const tr=state.objTracks[j];

      if(!dup){

    }
  }

  function workToTarget(wx,wy,sw,sh,vw,vh){
    const m=videoToScreen(wx/sw*vw,wy/sh*vh),dx=m.x-state.center.x,dy=m.y-state.center.y,ca=Math.cos(state.targetAngle),sa=Math.sin(state.targetAngle);
    const u=(dx*ca+dy*sa)/state.radiusX,v=(-dx*sa+dy*ca)/state.radiusY,nr=Math.hypot(u,v);
    return{u,v,nr,ring:nr>1.015?0:Math.min(10,Math.max(1,10-Math.floor(nr*10-.15)))};
  }
  function finalizeCand(c){
    const {sw,sh,vw,vh}=c.dims,pos=workToTarget(c.x,c.y,sw,sh,vw,vh);let reason='';
    if(performance.now()-state.lastHit<=300)reason='직전 발과 너무 가까움';
    else if(pos.nr>(state.paperMultiple||1.5))reason='표적 범위 밖';
    else if(state.objKnown&&state.objKnown.some(k=>k.kind==='object'&&Math.hypot(k.x-c.x,k.y-c.y)<(k.r||10)+18))reason='물체 자국 근처';
    const ok=!reason&&tryRecordLaser(c.x,c.y,sw,sh,vw,vh,`[확인] dr=${Math.round(c.mag)} ${Math.round(c.lastSeen-c.t0)}ms`);
    if(ok){els.fpsPill.textContent='◎ 실제 레이저';setTimeout(showDetectorInfo,700)}
    diagCand(c,ok?'기록':'거부',ok?'':(reason||'기록 실패'),pos);
  }

  function tryRecordLaser(wx,wy,sw,sh,vw,vh,info){
    if(performance.now()-state.lastHit<=300)return false;
    if(state.objKnown&&state.objKnown.some(k=>k.kind==='object'&&Math.hypot(k.x-wx,k.y-wy)<(k.r||10)+18))return false;
    const mapped=videoToScreen(wx/sw*vw,wy/sh*vh),dx=mapped.x-state.center.x,dy=mapped.y-state.center.y,ca=Math.cos(state.targetAngle),sa=Math.sin(state.targetAngle),ex=dx*ca+dy*sa,ey=-dx*sa+dy*ca;
    const nx=ex/state.radiusX,ny=ey/state.radiusY;
    if(Math.hypot(nx,ny)>(state.paperMultiple||1.5))return false;
    recordShot(mapped.x,mapped.y,null,'laser');
    if(info){els.clrPill.textContent='#'+state.shots.length+' '+info;state.infoUntil=performance.now()+4000}
    return true;
  }

  /* 픽셀별 잡음 지도: 각 픽셀이 '레이저 없이도 프레임마다 평소 얼마나 흔들리는지'를 따로 기억한다.
     인쇄된 링 경계선·글자 테두리처럼 미세한 떨림·압축 잡음이 큰 곳은 기준이 자동으로 높아지고,
     평평한 흰 바탕·검은 바탕처럼 조용한 곳은 기준이 낮게 유지된다. (예전엔 화면 전체 평균 잡음 하나로 판정해서
     경계선 픽셀이 쉽게 기준을 넘었고, 밝을수록 그 흔들림이 커져 오인식이 폭증했다.) */
  function detectLaser(){
    state._frame=null;state.maintTick=(state.maintTick||0)+1;
    detectLaserCore();
    const f=state._frame;if(!f||!state.background)return;
    const {data,total,sw,x0,x1,y0,y1}=f,ch=els.laserColor.value==='green'?1:0;
    if(!state.prevR||state.prevR.length!==total||!state.noiseR){
      state.prevR=new Float32Array(total);state.noiseR=new Float32Array(total).fill(3);
      for(let y=y0;y<=y1;y++){const row=y*sw;for(let x=x0;x<=x1;x++){const p=row+x;state.prevR[p]=data[p*4+ch]}}
      return;
    }
    const pr=state.prevR,nz=state.noiseR;
    const every=state.detectorReady?2:1;   // 경기 중엔 2프레임에 한 번만 갱신
    if(!state._skipNoise&&state.maintTick%every===0){
      const a=state.detectorReady?.06:.15;   // 2프레임에 한 번이므로 예전(.03)의 2배   // 기준 화면 잡는 동안엔 빠르게 학습, 경기 중엔 천천히 따라감
      // 프레임 간 떨림뿐 아니라 '기준 화면과의 차이'도 함께 본다. 조명이 서서히 바뀌는 곳은 프레임 간 떨림은 작아도
      // 기준 화면과의 차이가 쌓이는데, 판정은 기준 화면 대비로 하므로 이 차이까지 알고 있어야 기준이 제대로 잡힌다.

    }

  }

  function detectLaserCore(){
    const vw=els.video.videoWidth,vh=els.video.videoHeight;if(!vw||!vh)return;
    // 작업 해상도(sw,sh)는 기준화면을 잡을 때 한 번만 정하고 계속 그 값을 쓴다.
    // 카메라 초점이 잡히는 동안 비디오 해상도 비율이 프레임마다 아주 미세하게 흔들리면,
    // 매 프레임 다시 계산할 경우 그때마다 기준화면이 초기화되어 "기준 화면 설정 중"에서 영원히 못 넘어갈 수 있었다.
    const sw=ANALYSIS_WIDTH;
    if(!state.workSH||!state.background)state.workSH=Math.round(sw*vh/vw);   // 화면 비율 그대로(픽셀이 정사각형이어야 원 계산이 맞음)
    const sh=state.workSH;
    if(els.work.width!==sw)els.work.width=sw;if(els.work.height!==sh)els.work.height=sh;
    wctx.drawImage(els.video,0,0,sw,sh);const data=wctx.getImageData(0,0,sw,sh).data,total=sw*sh;
    if(!state.lumBuf||state.lumBuf.length!==total)state.lumBuf=new Uint8Array(total);

    // (표적이 화면의 일부만 차지할 때 매 프레임 계산량을 크게 줄여, 짧게 스치는 레이저도 프레임을 안 놓치고 볼 확률을 높인다.)
    // 이 범위(t,x0,x1,y0,y1)는 아래쪽 실제 감지 로직에서도 그대로 재사용한다.
    const t=screenTargetToWork(sw,sh),scanR=Math.max(t.rx,t.ry)*(state.paperMultiple?state.paperMultiple+.1:1.6);
    const x0=Math.max(1,Math.floor(t.x-scanR)),x1=Math.min(sw-2,Math.ceil(t.x+scanR)),y0=Math.max(1,Math.floor(t.y-scanR)),y1=Math.min(sh-2,Math.ceil(t.y+scanR));

    // 화면 배치가 바뀌어(전체화면 전환·주소창 접힘 등) 감지 범위가 기준 화면을 잡아둔 범위 밖으로 벗어나면,
    // 기준 화면이 비어 있는 곳을 "확 바뀐 곳"으로 착각해 엉뚱한 곳을 레이저로 잡는다. 그 경우엔 기준 화면을 새로 잡는다.
    const rk=state.bgRoi;

    for(let y=y0;y<=y1;y++){const row=y*sw;for(let x=x0;x<=x1;x++){const p=row+x,i=p*4;lum[p]=(data[i]*.299+data[i+1]*.587+data[i+2]*.114+.5)|0}}

      state.background=new Float32Array(total);state.backgroundR=new Float32Array(total);state.backgroundG=new Float32Array(total);state.backgroundB=new Float32Array(total);
      for(let y=y0;y<=y1;y++){const row=y*sw;for(let x=x0;x<=x1;x++){const p=row+x,i=p*4;state.background[p]=lum[p];state.backgroundR[p]=data[i];state.backgroundG[p]=data[i+1];state.backgroundB[p]=data[i+2]}}
      state.prevLum=new Uint8Array(total);state.prevR=null;state.noiseR=null;state.bgRoi={x0,x1,y0,y1};state.warmupFrames=0;if(!state.warmupStart)state.warmupStart=performance.now();return
    }

    // "기준 화면 설정 중"에서 영원히 못 벗어나는 상황을 막기 위한 최후의 보루.

    if(state.warmupFrames<warmupLimit&&!warmupTimedOut){
      // 실제 레이저히트 영상을 분석해보니, 카메라가 완전히 정지해 있을 때(연속 프레임 간 변화가 거의 0)
      // 배경 잡음이 극히 낮아져서 약한 레이저도 훨씬 잘 튀어 보였다. 반대로 손떨림 등으로 화면이 계속
      // 흔들리면(우리 실제 촬영본은 그 차이가 약 90배 더 컸다) 잡음 기준이 높아져 약한 신호를 놓치기 쉬워진다.
      // 그래서 정해진 프레임 수만 채우면 끝내던 것에서, 화면이 실제로 "안정됐을 때"만 진행되도록 바꾼다.
      let motionSum=0,motionN=0;

    if(state.countdownEnd&&performance.now()<state.countdownEnd){blendBackground(data,lum,sw,x0,x1,y0,y1,.1);state.prevLum.set(lum);return}
    if(!state.detectorReady){state.detectorReady=true;if(state.detectKind!=='laser'){state.objRef=new Float32Array(total*3);for(let p=0,i=0;p<total;p++,i+=4){state.objRef[p*3]=data[i];state.objRef[p*3+1]=data[i+1];state.objRef[p*3+2]=data[i+2]}state.objTracks=[];state.objKnown=[];state.objBusySince=0;state.objBusy=false}els.matchBtn.textContent='경기 진행 중';els.guide.textContent='레이저 감지 대기 중 · 짧게 발사하세요.';els.livePill.textContent='● LIVE';setStatus('레이저 감지 대기','#ff4d66');state.readyAt=performance.now();showGo();return}
    // 사격 시작 직후 잠깐(0.7초)은 인식하지 않고 기준 화면만 최신으로 맞춘다 - 시작 순간에 카메라 노출·색이 다시 맞춰지며 튀는 것을 레이저로 착각하지 않게.
    if(state.settleMs>0&&state.readyAt&&performance.now()-state.readyAt<state.settleMs){blendBackground(data,lum,sw,x0,x1,y0,y1,.1);state.prevLum.set(lum);return}
    const tca=Math.cos(t.a),tsa=Math.sin(t.a),irx=1/t.rx,iry=1/t.ry;
    const insideScan=(x,y,margin=state.paperMultiple?state.paperMultiple+.1:1.6)=>{

    };
    const maskKey=[sw,sh,x0,x1,y0,y1,t.x.toFixed(2),t.y.toFixed(2),t.rx.toFixed(2),t.ry.toFixed(2),t.a.toFixed(4),state.paperMultiple||0].join(',');

    const px=weight?sx/weight:strongest.x,py=weight?sy/weight:strongest.y;
    if(state.pendingLaser&&Math.hypot(px-state.pendingLaser.x,py-state.pendingLaser.y)<12){const n=state.pendingLaser.frames;state.pendingLaser.x=(state.pendingLaser.x*n+px)/(n+1);state.pendingLaser.y=(state.pendingLaser.y*n+py)/(n+1);state.pendingLaser.frames++;state.pendingLaser.maxSignal=Math.max(state.pendingLaser.maxSignal,strongest.delta);state.pendingLaser.maxContrast=Math.max(state.pendingLaser.maxContrast,localContrast);state.pendingLaser.maxColorBoost=Math.max(state.pendingLaser.maxColorBoost,clusterColorBoost);state.pendingLaser.maxBright=Math.max(state.pendingLaser.maxBright,strongest.bright);state.pendingLaser.maxRedRise=Math.max(state.pendingLaser.maxRedRise,strongest.redRise);if(state.pendingLaser.frames>=2&&state.pendingLaser.maxSignal>=20&&state.pendingLaser.maxContrast>=6&&(state.pendingLaser.maxColorBoost>=2||state.pendingLaser.maxRedRise>=8)&&tryRecordLaser(state.pendingLaser.x,state.pendingLaser.y,sw,sh,vw,vh,`[보조] ${state.pendingLaser.frames}프레임 신호=${Math.round(state.pendingLaser.maxSignal)}`)){state.pendingLaser=null;state.laserBlocked=true;state.blockedFrames=0;state.releaseFrames=0;return}if(state.pendingLaser.frames>20){state.pendingLaser=null;state.laserBlocked=true;state.releaseFrames=0}}
    else state.pendingLaser={x:px,y:py,frames:1,maxSignal:strongest.delta,maxContrast:localContrast,maxColorBoost:clusterColorBoost,maxBright:strongest.bright,maxRedRise:strongest.redRise};
  }

  function undo(){if(!state.shots.length)return;state.shots.pop();state.running=true;els.manualBtn.disabled=false;els.matchBtn.textContent='경기 진행 중';els.undoBtn.disabled=!state.shots.length;els.guide.textContent='마지막 기록을 취소했습니다. 계속 사격하세요.';setStatus('경기 진행','#ff4d66');updateScore();drawOverlay();pushLive(true)}
  function reset(){clearCountdown();lockCamera(false);state.running=false;state.shots=[];state.matchId=null;state.spotLatched=false;state.missingFrames=0;clearDetectorBackground();state.detectorReady=false;els.player.disabled=false;els.firingLane.disabled=false;els.maxShots.disabled=false;els.eventName.disabled=false;els.detectKind.disabled=false;els.manualBtn.disabled=true;els.undoBtn.disabled=true;els.matchBtn.textContent=state.center?'경기 시작 대기 중':'경기 시작';els.matchBtn.disabled=!(state.center&&state.radius);els.livePill.textContent=state.stream?'● CAMERA':'● OFF';els.guide.textContent=state.center?'라이브 페이지에서 경기 시작을 누르세요.':'카메라 시작 후 표적을 자동 보정하세요.';setStatus(state.center?'경기 시작 대기 중':'준비');document.body.classList.remove('match-live');setTimeout(resize,60);updateScore();drawOverlay()}
  function loadLeaderboard(){
    els.leaderDialog.showModal();els.leaderList.className='empty';els.leaderList.textContent='기록을 불러오는 중입니다.';
    if(!isServerConfigured()){els.leaderList.textContent='index.html에 Apps Script /exec 주소를 먼저 넣어 주세요.';return}
    const callback='laserLeaderboard_'+Date.now();const script=document.createElement('script');const timer=setTimeout(()=>finish(new Error('시간 초과')),10000);
    function finish(error,rows){clearTimeout(timer);delete window[callback];script.remove();if(error){els.leaderList.className='empty';els.leaderList.textContent='순위표를 불러오지 못했습니다.';return}if(!rows.length){els.leaderList.className='empty';els.leaderList.textContent='아직 저장된 경기 기록이 없습니다.';return}els.leaderList.className='';els.leaderList.innerHTML=rows.map((r,i)=>`<div class="leader-row"><span class="rank">${i+1}</span><span>${escapeHtml(r.player)} <small>· ${r.firingLane||'-'}사로</small></span><strong>${r.totalScore}점</strong><small>10점 ${r.tens}</small></div>`).join('')}
    window[callback]=rows=>finish(null,rows);script.onerror=()=>finish(new Error('network'));script.src=`${APPS_SCRIPT_URL}?action=leaderboard&eventName=${encodeURIComponent(els.eventName.value.trim())}&callback=${callback}&t=${Date.now()}`;document.head.appendChild(script);
  }
  function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}

  async function toggleFullscreen(){
    try{
      if(document.fullscreenElement){await document.exitFullscreen()}
      else{const root=document.documentElement,request=root.requestFullscreen||root.webkitRequestFullscreen;if(!request)return;await request.call(root,{navigationUI:'hide'})}
    }catch(e){console.warn(e)}
  }
  function updateFullscreenButton(){const active=!!document.fullscreenElement;els.fullscreenBtn.textContent=active?'⛶ 전체화면 종료':'⛶ 전체화면';els.fullscreenBtn.setAttribute('aria-label',active?'전체화면 종료':'전체화면 켜기');setTimeout(resize,120)}

  els.cameraBtn.onclick=startCamera;els.calibrateBtn.onclick=beginCalibration;els.matchBtn.title='라이브 관전 페이지에서 사로를 맞춰 경기 시작 명령을 보내면 자동으로 시작돼요.';els.undoBtn.onclick=undo;els.resetBtn.onclick=reset;els.leaderBtn.onclick=loadLeaderboard;els.fullscreenBtn.onclick=toggleFullscreen;els.zoomOut.onclick=()=>changeZoom(-1);els.zoomIn.onclick=()=>changeZoom(1);els.manualBtn.onclick=()=>els.manualDialog.showModal();els.manualConfirm.onclick=()=>{recordShot(null,null,els.manualScore.value);els.manualDialog.close()};els.maxShots.onchange=updateScore;
  function showDetectorInfo(){els.fpsPill.textContent='고감도 레이저 '+state.sensitivity+(state.actualFps?' · '+Math.round(state.actualFps)+'fps':'')+(state.cameraLocked?' · 🔒':'')+(state.running&&state.seenPct!==''&&state.seenPct!=null?' · 분석 '+state.seenPct+'%':'')}
  els.sensitivityDown.onclick=()=>{state.sensitivity=Math.max(35,state.sensitivity-3);showDetectorInfo();toast('감도를 낮췄습니다.')};els.sensitivityUp.onclick=()=>{state.sensitivity=Math.min(98,state.sensitivity+3);showDetectorInfo();toast('감도를 높였습니다.')};els.laserColor.onchange=()=>{showDetectorInfo();clearDetectorBackground()};
  window.addEventListener('resize',resize);window.addEventListener('orientationchange',()=>setTimeout(resize,280));document.addEventListener('fullscreenchange',updateFullscreenButton);document.addEventListener('webkitfullscreenchange',updateFullscreenButton);document.addEventListener('visibilitychange',()=>{if(document.hidden){state.candidate=null;state.candidateFrames=0}});updateScore();
})();
</script>
