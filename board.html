<!DOCTYPE html>
<html lang="ko" translate="no">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="theme-color" content="#07111f">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LASER MATCH · 리그 전광판</title>
<style>
  /* TV·프로젝터용 전광판. 글자 크기는 화면 폭·높이(vw/vh)에 맞춘다.
     ※ 클래스 이름에 광고처럼 보이는 말(…-big, ad-, banner 등)을 쓰지 않는다 - 삼성 인터넷 광고 차단이 화면을 숨긴 적이 있다. */
  /* 화면 크기 맞춤: 모든 크기를 --u 단위로 쓴다. 보통 화면(가로:세로가 4:3보다 넓은 TV·모니터·노트북)에서는 --u = 1vh라
     원래 디자인 그대로이고, 그보다 좁은 화면(폴드 펼침 등 정사각형에 가까운 화면)에서만 가로 폭에 맞춰 줄인다.
     (처음엔 16:9 기준(.5625vw)으로 줄였더니 16:10 모니터에서도 글자가 약 10% 작아져 심심해 보였다)
     높이는 주소창을 뺀 실제 보이는 높이(dvh)를 쓴다(100vh는 휴대폰에서 아래가 잘렸다). */
  :root{--u:min(1vh,.75vw)}
  @supports (height:1dvh){:root{--u:min(1dvh,.75vw)}}
  :root{--bg:#07111f;--panel:#101d30;--panel2:#0b1626;--line:#29415e;--text:#f5f8ff;--muted:#b9c7d8;--dim:#5b6f86;--cyan:#29e7d6;--lime:#b7ff3c;--red:#ff4d66;--gold:#ffc940}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(circle at 50% -20%,#17375a 0,var(--bg) 55%);color:var(--text);font-family:system-ui,-apple-system,"Malgun Gothic","Noto Sans KR",sans-serif}
  .screen{height:100vh;height:100dvh;display:flex;flex-direction:column;padding:calc(1.6*var(--u)) 2vw;gap:calc(1.6*var(--u))}
  /* 왼쪽·오른쪽 칸 폭을 같게(1fr) 고정해야 가운데 경기명이 정확히 화면 가운데에 온다 */
  .top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:2vw;position:relative}
  /* 오른쪽 순위 기둥이 있을 때는 경기명을 왼쪽 영역(시계·사로 카드)의 가운데에 맞춘다. 연결 표시는 화면 오른쪽 끝에 그대로 둔다. */
  .screen.hasrank .top{padding-right:26.5vw}
  .screen.hasrank .conn{position:absolute;right:0;top:50%;transform:translateY(-50%)}
  .brand{font-size:calc(2.2*var(--u));font-weight:900;color:var(--cyan);letter-spacing:.05em;justify-self:start}
  .game{font-size:calc(4.2*var(--u));font-weight:900;text-align:center}
  .conn{justify-self:end;font-size:calc(1.6*var(--u));font-weight:800;border:.calc(2*var(--u)) solid #ffffff28;border-radius:999px;padding:.calc(6*var(--u)) 1.2vw;color:var(--muted)}
  .conn.ok{color:var(--lime);border-color:#b7ff3c66}.conn.bad{color:#ff7a8c;border-color:#ff4d6666}
  /* 사격 중: 왼쪽(시계+사로 카드) | 오른쪽(실시간 순위) */
  .body{flex:1;min-height:0;display:flex;gap:1.5vw}
  #main{flex:1;min-width:0;display:flex;flex-direction:column;gap:calc(1.6*var(--u))}
  .rankcol{width:25vw;flex:none;display:flex;flex-direction:column;background:var(--panel2);border:.calc(3*var(--u)) solid var(--line);border-radius:calc(1.6*var(--u));padding:calc(1.6*var(--u)) 1vw;min-height:0}
  .rankcol[hidden]{display:none}
  .rankcol h3{margin:0 0 calc(1.2*var(--u));font-size:calc(3.2*var(--u));font-weight:900;color:var(--cyan);text-align:center}
  .rlist{position:relative;flex:1;min-height:0}
  .ritem{position:absolute;left:0;right:0;height:calc(7.4*var(--u));display:grid;grid-template-columns:calc(5*var(--u)) minmax(0,1fr) auto;align-items:center;gap:.8vw;background:var(--panel);border:.calc(25*var(--u)) solid var(--line);border-radius:calc(1.2*var(--u));padding:0 1vw;transition:top .6s ease}
  .ritem .rn{font-size:calc(3.4*var(--u));font-weight:900;color:var(--gold);text-align:center}
  .ritem .rc{font-size:calc(3.2*var(--u));font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ritem .rc small{display:block;font-size:calc(1.7*var(--u));color:var(--muted);font-weight:800}
  .ritem .rs{font-size:calc(3.8*var(--u));font-weight:900;color:var(--lime);font-variant-numeric:tabular-nums}
  .ritem.fin{border-color:var(--lime)}
  .rcut{position:absolute;left:0;right:0;border-top:.calc(35*var(--u)) dashed var(--lime);color:var(--lime);font-size:calc(1.6*var(--u));font-weight:900;text-align:center;transition:top .6s ease}
  .rnote{font-size:calc(1.7*var(--u));color:var(--muted);text-align:center;margin-top:calc(1*var(--u));font-weight:800}
  .timer{text-align:center;line-height:1}
  .timer .lbl{font-size:calc(3.6*var(--u));font-weight:900;color:var(--cyan);margin-bottom:.calc(6*var(--u))}
  .timer .clk{font-size:calc(22*var(--u));font-weight:900;font-variant-numeric:tabular-nums;color:var(--gold)}
  .timer .clk.urgent{color:var(--red)}
  .timer.practice .lbl{color:var(--lime)}
  .lanes{flex:1;min-height:0;display:grid;gap:1.2vw;grid-auto-rows:1fr}
  /* 사로 카드 글자는 카드 폭(한 줄에 4장)도 넘지 않게 상한(vw)을 둔다. 16:9·16:10 화면에서는 상한에 걸리지 않아 원래 크기 그대로. */
  .card{background:var(--panel);border:.calc(3*var(--u)) solid var(--line);border-radius:calc(1.6*var(--u));padding:calc(1.4*var(--u)) 1vw;display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center;min-width:0;overflow:hidden}
  .card .no{font-size:calc(2.2*var(--u));font-weight:900;color:var(--cyan)}
  .card .cls{font-size:min(calc(4.6*var(--u)),3.1vw);font-weight:900;white-space:nowrap}
  .card .sc{font-size:min(calc(7.5*var(--u)),5vw);font-weight:900;color:var(--lime);font-variant-numeric:tabular-nums;line-height:1}
  .card .meta{font-size:min(calc(2.2*var(--u)),1.4vw);font-weight:800;color:var(--muted)}
  .card .bar{width:100%;height:calc(1*var(--u));background:var(--panel2);border-radius:calc(1*var(--u));overflow:hidden}
  .card .bar i{display:block;height:100%;background:var(--cyan)}
  .card .st{font-size:min(calc(2.4*var(--u)),1.5vw);font-weight:900;border-radius:999px;padding:.calc(4*var(--u)) 1.2vw;border:.calc(25*var(--u)) solid var(--line);color:var(--muted)}
  .card.fin{border-color:var(--lime)}.card.fin .st{color:var(--lime);border-color:var(--lime)}
  .card.tout{border-color:var(--gold)}.card.tout .st{color:var(--gold);border-color:var(--gold)}
  .msg{text-align:center;font-size:calc(7*var(--u));font-weight:900;line-height:1.3}
  .msg small{display:block;font-size:calc(3.2*var(--u));color:var(--muted);font-weight:800;margin-top:calc(1.5*var(--u))}
  .pulse{animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.55}}
  .center{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:calc(3*var(--u))}
  /* 결과 발표 표 */
  .rank{flex:1;min-height:0;display:flex;flex-direction:column;gap:.calc(8*var(--u))}
  .rank .head,.rank .row{display:grid;grid-template-columns:9vw minmax(0,1.4fr) 1fr 1fr 1fr 1.2fr 1.1fr;align-items:center;gap:1vw;padding:0 1.5vw}
  .rank .head{font-size:calc(2*var(--u));color:var(--muted);font-weight:800}
  .rank .row{flex:1;min-height:0;background:var(--panel);border:.calc(25*var(--u)) solid var(--line);border-radius:calc(1.2*var(--u));font-size:calc(3.6*var(--u));font-weight:900;font-variant-numeric:tabular-nums}
  .rank .row .rk{color:var(--gold)}
  .rank .row .fin{color:var(--lime);font-size:calc(4.2*var(--u))}
  .rank .row .tag{font-size:calc(2.4*var(--u));justify-self:start;border-radius:999px;padding:.calc(3*var(--u)) 1vw;border:.calc(25*var(--u)) solid var(--line);color:var(--muted)}
  .rank .row.hid{color:var(--dim);border-style:dashed}
  .rank .row.hid .rk{color:var(--dim)}
  .rank .row.adv{border-color:var(--lime);background:#11301f}
  .rank .row.adv .tag{color:var(--lime);border-color:var(--lime)}
  .rank .row.new{animation:pop .7s ease-out}
  @keyframes pop{from{transform:scale(1.06);background:#2a3d14}to{transform:none}}
  .cut{text-align:center;font-size:calc(2.2*var(--u));font-weight:900;color:var(--lime);border-top:.calc(35*var(--u)) dashed var(--lime);padding-top:.calc(4*var(--u))}
</style>
<script src="config.js"></script>
<script src="league.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>
<body>
<div class="screen">
  <div class="top"><span class="brand">🎯 2026 교내 사격 리그전</span><span class="game" id="game"></span><span class="conn" id="conn">연결 중…</span></div>
  <div class="body">
    <div id="main"><div class="center"><div class="msg">LASER MATCH 리그</div></div></div>
    <div class="rankcol" id="rankCol" hidden><h3>실시간 순위</h3><div class="rlist" id="rList"></div><div class="rnote">사격 점수 기준 · 시간 보너스는 결과 발표 때 반영</div></div>
  </div>
</div>
<script>
(function(){
  'use strict';
  const CFG=window.LASER_CONFIG||{},ROOT=String(CFG.LEAGUE_ROOT||'league_test'),FB=CFG.FIREBASE,C=window.LeagueCalc;
  const S={db:null,offset:0,st:null,live:{},reveal:null,revKey:'',shown:0,html:''};
  const $=id=>document.getElementById(id);
  const esc=v=>String(v==null?'':v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  function norm(o){const r={};Object.keys(o||{}).forEach(k=>{if(o[k]!=null)r[k]=o[k]});return r}
  // 서버 시각: 태블릿(lgSync)과 같은 방법으로 직접 재서 쓴다. Firebase 기본 보정값은 실제와 약 40ms 달랐다(태블릿 기록).
  const now=()=>Date.now()+(S.sync!=null?S.sync:S.offset);
  async function syncClock(){
    if(S.syncing||!S.db)return;S.syncing=true;const r=S.db.ref(ROOT+'/clock/board');let best=null;
    try{for(let i=0;i<8;i++){const t0=Date.now();await r.set(firebase.database.ServerValue.TIMESTAMP);const t1=Date.now();const sv=Number((await r.get()).val());if(!sv)continue;const rtt=t1-t0,off=sv-(t0+t1)/2;if(!best||rtt<best.rtt)best={rtt,off};await new Promise(z=>setTimeout(z,150))}
      if(best)S.sync=Math.round(best.off)}catch(e){}finally{S.syncing=false}
  }
  // 남은 시간 숫자가 바뀌는 순간(1초 경계) 바로 뒤에 다시 그린다(예전: 0.25초마다 → 태블릿과 최대 0.25초 어긋나 보임)
  function sched(){try{render()}catch(e){console.warn(e)}const st=S.st,ref=(st&&st.endAt)||0;const rem=((ref-now())%1000+1000)%1000;setTimeout(sched,Math.min(250,rem+4))}
  const ref=p=>S.db.ref(ROOT+'/'+p);
  function fmt(ms){const t=Math.max(0,Math.ceil(ms/1000));return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')}
  const clsName=(g,c)=>`${g}학년 ${c}반`;
  // 화면 내용이 바뀔 때만 다시 그린다(0.25초마다 확인).
  function put(html){if(html!==S.html){S.html=html;$('main').innerHTML=html}}

  function laneCards(st,showLive){
    const lanes=st.lanes||{},keys=Object.keys(lanes).sort((a,b)=>a-b),dec=st.scoring!=='int',rl=st.rule||{};
    const cols=keys.length<=4?keys.length:Math.ceil(keys.length/2);
    return `<div class="lanes" style="grid-template-columns:repeat(${Math.max(1,cols)},minmax(0,1fr))">`+keys.map(l=>{
      const v=S.live[l]||{},mine=showLive&&v.runId===st.runId,shots=mine?C.shotsOf(v):[],n=shots.length;
      let sum=0;for(const s of shots)sum+=dec?(Number(s.sd!=null?s.sd:s.si)||0):(Number(s.si)||0);
      const per=rl.per||1,team=st.teamSize||15,practice=st.kind==='practice';
      let cls='card',stTxt=mine?'사격 중':'대기';
      if(mine&&v.done){if(v.timeUp){cls+=' tout';stTxt='시간 종료'}else{cls+=' fin';stTxt=`완료 ${(Number(v.finishMs)/1000).toFixed(1)}초`}}
      const pct=rl.shots?Math.min(100,n/rl.shots*100):0;
      return `<div class="${cls}"><div class="no">${l}사로</div><div class="cls">${esc(clsName(st.grade,lanes[l]))}</div>
        <div class="sc">${practice?n+'<span style="font-size:calc(3*var(--u))"> 발</span>':(dec?sum.toFixed(1):sum)}</div>
        <div class="meta">${practice?'연습':`${n} / ${rl.shots}발 · 사수 ${Math.min(team,Math.floor(n/per)+1)} / ${team}`}</div>
        ${practice?'':`<div class="bar"><i style="width:${pct}%"></i></div>`}<div class="st">${stTxt}</div></div>`}).join('')+'</div>';
  }

  // 오른쪽 실시간 순위(사격 점수 기준). 사로마다 줄을 하나씩 계속 두고 위치(top)만 바꿔서, 순위가 바뀌면 줄이 미끄러지듯 움직인다.
  const ROW_VH=8.3;   // 줄 높이 calc(7.4*var(--u)) + 간격
  function renderRank(st,show){
    const col=$('rankCol'),list=$('rList');
    document.querySelector('.screen').classList.toggle('hasrank',!!show);
    if(!show){if(!col.hidden){col.hidden=true;list.innerHTML=''}return}
    col.hidden=false;
    const lanes=st.lanes||{},dec=st.scoring!=='int',rl=st.rule||{};
    const rows=Object.keys(lanes).map(l=>{const v=S.live[l]||{},mine=v.runId===st.runId,shots=mine?C.shotsOf(v):[];let sum=0;for(const s of shots)sum+=dec?(Number(s.sd!=null?s.sd:s.si)||0):(Number(s.si)||0);
      return{l,cls:lanes[l],sum:Math.round(sum*10)/10,n:shots.length,done:mine&&!!v.done}});
    rows.sort((a,b)=>b.sum-a.sum||a.n-b.n||a.l-b.l);
    const seen={};
    // 2·3라운드는 진출한 학급이 한꺼번에 쏘므로 '현재 진출권' 선을 보여 준다(1라운드는 두 조를 합쳐 정하므로 긋지 않음).
    const adv=st.round>=2?Number(rl.advance)||0:0,showCut=adv>0&&adv<rows.length,CUT_GAP=2.4;
    const topOf=i=>i*ROW_VH+(showCut&&i>=adv?CUT_GAP:0);   // 진출선 아래 줄들은 글씨가 들어갈 만큼 띄운다
    rows.forEach((r,i)=>{
      let el=list.querySelector(`[data-l="${r.l}"]`);
      if(!el){el=document.createElement('div');el.className='ritem';el.dataset.l=r.l;el.style.top=`calc(${topOf(i)}*var(--u))`;list.appendChild(el)}
      const html=`<span class="rn">${i+1}</span><span class="rc">${esc(st.grade+'-'+r.cls+'반')}<small>${r.l}사로 · ${r.n}/${rl.shots||'-'}발${r.done?' · 완료':''}</small></span><span class="rs">${dec?r.sum.toFixed(1):r.sum}</span>`;
      if(el.dataset.h!==html){el.dataset.h=html;el.innerHTML=html}
      el.style.top=`calc(${topOf(i)}*var(--u))`;el.classList.toggle('fin',r.done);seen[r.l]=1;
    });
    list.querySelectorAll('.ritem').forEach(el=>{if(!seen[el.dataset.l])el.remove()});
    let cut=list.querySelector('.rcut');
    if(showCut){if(!cut){cut=document.createElement('div');cut.className='rcut';cut.textContent='▲ 현재 진출권';list.appendChild(cut)}cut.style.top=`calc(${adv*ROW_VH-.3}*var(--u))`}
    else if(cut)cut.remove();
  }

  function render(){
    const st=S.st;
    const showRank=!!(st&&st.grade&&st.kind==='match'&&(st.phase==='shooting'||st.phase==='done')&&st.startAt);
    renderRank(st,showRank);
    if(!st||!st.grade){$('game').textContent='';put('<div class="center"><div class="msg">LASER MATCH 리그<small>경기 준비 중</small></div></div>');return}
    const heat=st.so?' 슛오프':st.round===1?' '+st.heat+'조':'';
    $('game').textContent=`${st.grade}학년 · ${st.round}라운드${heat}`;
    const t=now(),p=st.phase;
    if((p==='practice'||p==='shooting')&&st.startAt){
      const pre=t<st.startAt,left=st.endAt-Math.max(t,st.startAt),practice=p==='practice';
      const lbl=pre?'준비':(practice?'연습':'본사격'),clk=pre?String(Math.max(1,Math.ceil((st.startAt-t)/1000))):fmt(left);
      const urgent=!pre&&!practice&&left<=10000;
      put(`<div class="timer${practice?' practice':''}"><div class="lbl">${lbl}</div><div class="clk${urgent?' urgent':''}">${clk}</div></div>`+laneCards(st,true));
      return;
    }
    if(p==='done'){
      const heatA=st.round===1&&st.heat==='A';
      put(`<div class="msg pulse" style="font-size:calc(5.5*var(--u))">${heatA?'A조 경기 종료':'결과 발표가 있겠습니다'}<small>${heatA?'B조 경기가 끝난 뒤 두 조를 합쳐 발표합니다':'잠시만 기다려 주세요'}</small></div>`+laneCards(st,true));
      return;
    }
    if(p==='reveal'){renderReveal(st);return}
    // 대기·연습 종료·중지: 배정된 학급만 보여 준다
    const sub=p==='standby'?'연습 종료 · 곧 본사격을 시작합니다':p==='stopped'?'경기가 중지됐어요':'곧 경기를 시작합니다';
    put(`<div class="msg" style="font-size:calc(5*var(--u))">${sub}</div>`+laneCards(st,false));
  }

  function renderReveal(st){
    const R=S.reveal;
    if(!R||!R.rows){put('<div class="center"><div class="msg pulse">결과 발표가 있겠습니다</div></div>');return}
    const rows=(Array.isArray(R.rows)?R.rows:Object.values(R.rows)).filter(Boolean).sort((a,b)=>a.rank-b.rank||0);
    const N=rows.length,k=Math.min(N,st.revealStep||0),dec=R.scoring!=='int',F=C.fmt,F2=C.fmt2,adv=R.adv||0,allShown=k>=N;
    // 아래 순위부터 공개: 아래쪽 k개 행이 보인다. 방금 공개된 행은 잠깐 강조.
    if(S.shown!==k){S.shown=k;S.newIdx=N-k;S.newUntil=Date.now()+1500}
    const justShown=Date.now()<(S.newUntil||0)?S.newIdx:-1;
    let html=`<div class="msg" style="font-size:calc(4.6*var(--u))">${allShown?(adv?`🎉 ${R.round+1}라운드 진출 학급`:'🏆 최종 순위'):'결과 발표'}<small style="margin-top:.calc(5*var(--u))">${R.grade}학년 ${R.round}라운드 · 최종 점수 = 사격 점수 + 시간 보너스</small></div>`;
    html+=`<div class="rank"><div class="head"><span>순위</span><span>학급</span><span>사격</span><span>완료 시간</span><span>보너스</span><span>최종</span><span></span></div>`;
    rows.forEach((x,i)=>{
      const vis=i>=N-k;
      if(allShown&&adv&&i===adv)html+=`<div class="cut">▲ 진출 (상위 ${adv}개 학급)</div>`;
      if(!vis){html+=`<div class="row hid"><span class="rk">${x.rank}위</span><span>?</span><span>?</span><span>?</span><span>?</span><span>?</span><span></span></div>`;return}
      const tag=adv?(x.advanced?(allShown?'진출':''):`${x.rank}위 확정`):`최종 ${x.rank}위`;
      html+=`<div class="row${allShown&&x.advanced?' adv':''}${i===justShown?' new':''}"><span class="rk">${x.rank}위${x.tie?'*':''}</span><span>${esc(R.grade+'-'+x.cls+'반')}</span><span>${F(x.shoot,dec)}</span><span>${x.finishSec!=null?x.finishSec.toFixed(1)+'초':(x.timeUp?'시간 초과':'-')}</span><span>+${F2(x.bonus)}</span><span class="fin">${F2(x.final)}</span><span>${tag?`<span class="tag">${tag}</span>`:''}</span></div>`;
    });
    put(html+'</div>');
  }

  function watchReveal(st){
    const key=st&&st.phase==='reveal'?String(st.revealKey||''):'';
    if(key===S.revKey)return;
    if(S.revKey)ref('reveal/'+S.revKey).off();
    S.revKey=key;S.reveal=null;S.shown=0;
    if(key)ref('reveal/'+key).on('value',s=>{S.reveal=s.val();render()});
  }

  function init(){
    if(!FB||!window.firebase){$('conn').textContent='config.js 또는 인터넷 확인';return}
    firebase.initializeApp(FB);S.db=firebase.database();
    S.db.ref('.info/serverTimeOffset').on('value',s=>{S.offset=Number(s.val())||0});
    S.db.ref('.info/connected').on('value',s=>{const on=s.val()===true;$('conn').textContent=on?'● 실시간 연결됨':'연결 끊김 · 재연결 중';$('conn').className='conn '+(on?'ok':'bad')});
    firebase.auth().signInAnonymously().then(()=>{
      ref('state').on('value',s=>{S.st=s.val();if(S.st)S.st.lanes=norm(S.st.lanes);watchReveal(S.st);render()});
      ref('live').on('value',s=>{S.live=norm(s.val());render()});
      sched();syncClock();setInterval(()=>{const st=S.st;if(!(st&&(st.phase==='practice'||st.phase==='shooting')))syncClock()},120000);   // 사격 중에는 다시 재지 않는다(시계가 튀지 않게)
    }).catch(e=>{$('conn').textContent='로그인 실패: '+e.message});
  }
  init();
})();
</script>
</body>
</html>
